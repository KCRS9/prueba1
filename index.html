<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TAI-LI Quiz">
<title>TAI-LI Quiz · 2019-2022-2024</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f1a;--s:#1a1a2e;--s2:#22223b;--s3:#2d2d4e;--a:#7c6af7;--a2:#a78bfa;--ag:rgba(124,106,247,.25);--t:#e8e6f0;--t2:#9d9bbf;--t3:#6b69a0;--ok:#10b981;--okb:rgba(16,185,129,.12);--okr:rgba(16,185,129,.4);--no:#f43f5e;--nob:rgba(244,63,94,.12);--nor:rgba(244,63,94,.4);--nb:rgba(255,255,255,.04);--nr:rgba(255,255,255,.08);--w:#f59e0b;--wb:rgba(245,158,11,.12);--wr:rgba(245,158,11,.35);--r:14px;--rs:8px;--f:'Sora',sans-serif;--m:'JetBrains Mono',monospace;--tr:.2s cubic-bezier(.4,0,.2,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{font-family:var(--f);background:var(--bg);color:var(--t);min-height:100dvh;line-height:1.6;overscroll-behavior:none}
body::before{content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(ellipse 600px 400px at 20% 10%,rgba(124,106,247,.07) 0%,transparent 60%),radial-gradient(ellipse 400px 300px at 80% 90%,rgba(167,139,250,.05) 0%,transparent 60%);pointer-events:none;z-index:0}
#app{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:0 16px;min-height:100dvh;display:flex;flex-direction:column}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:18px 0 14px;border-bottom:1px solid rgba(255,255,255,.06);margin-bottom:20px;flex-shrink:0}
.logo{display:flex;align-items:center;gap:10px}
.logo-i{width:34px;height:34px;background:linear-gradient(135deg,var(--a),var(--a2));border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:var(--m);font-size:12px;font-weight:500;color:#fff;flex-shrink:0}
.logo-t{font-size:14px;font-weight:600;color:var(--t);letter-spacing:-.02em}
.logo-s{font-size:10px;color:var(--t3);font-weight:400}
.hchip{font-size:11px;font-family:var(--m);padding:4px 10px;border-radius:20px;background:var(--s2);border:1px solid var(--nr);color:var(--t2)}
#main{flex:1;display:flex;flex-direction:column;overflow-y:auto;padding-bottom:24px}
/* Home */
.hero{text-align:center;padding:12px 0 24px}
.hero-yr{font-family:var(--m);font-size:11px;color:var(--a);letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
.hero-t{font-size:clamp(24px,6vw,34px);font-weight:600;letter-spacing:-.03em;line-height:1.2;margin-bottom:8px;background:linear-gradient(135deg,var(--t) 40%,var(--a2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-s{font-size:13px;color:var(--t2);max-width:360px;margin:0 auto}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:24px}
.sc{background:var(--s);border:1px solid var(--nr);border-radius:var(--r);padding:14px 10px;text-align:center}
.sn{font-size:24px;font-weight:600;font-family:var(--m);color:var(--t);line-height:1;margin-bottom:3px}
.sn.g{color:var(--ok)}.sn.b{color:var(--no)}.sn.p{color:var(--a2)}
.sl{font-size:11px;color:var(--t3)}
.lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);margin-bottom:8px}
/* Year tabs */
.ytabs{display:flex;gap:5px;margin-bottom:10px;background:var(--s);border:1px solid var(--nr);border-radius:var(--r);padding:4px}
.ytab{flex:1;padding:7px;font-family:var(--f);font-size:12px;font-weight:500;border:none;border-radius:10px;background:transparent;color:var(--t3);cursor:pointer;transition:var(--tr)}
.ytab.on{background:var(--a);color:#fff}
/* Section grid */
.sgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.sbtn{background:var(--s);border:1px solid var(--nr);border-radius:var(--r);padding:13px;cursor:pointer;text-align:left;transition:var(--tr);position:relative;overflow:hidden}
.sbtn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--ag),transparent);opacity:0;transition:opacity var(--tr)}
.sbtn:hover::before,.sbtn.on::before{opacity:1}
.sbtn.on{border-color:var(--a);background:var(--s2)}
.sbtn-n{font-size:13px;font-weight:500;color:var(--t);margin-bottom:2px}
.sbtn-c{font-size:11px;font-family:var(--m);color:var(--t3)}
.sbtn.on .sbtn-n{color:var(--a2)}
.wbtn{width:100%;background:var(--s);border:1px solid var(--wr);border-radius:var(--r);padding:11px 14px;cursor:pointer;text-align:left;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;transition:var(--tr)}
.wbtn:hover{background:var(--s2)}
.wbt{font-size:13px;font-weight:500;color:var(--w)}
.wbc{font-family:var(--m);font-size:11px;background:var(--wb);color:var(--w);padding:3px 10px;border-radius:20px}
/* Continue banner */
.cont-ban{background:var(--s);border:1px solid rgba(124,106,247,.4);border-radius:var(--r);padding:13px 15px;margin-bottom:12px;cursor:pointer;transition:var(--tr)}
.cont-ban:hover{background:var(--s2)}
.cont-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.cont-lbl{font-size:10px;font-family:var(--m);color:var(--a);letter-spacing:.08em;text-transform:uppercase}
.cont-x{background:none;border:none;color:var(--t3);cursor:pointer;font-size:15px;line-height:1;padding:0}
.cont-info{font-size:12px;color:var(--t2)}
.cont-info strong{color:var(--t)}
.cont-bar{height:3px;background:var(--s3);border-radius:2px;margin-top:7px;overflow:hidden}
.cont-fill{height:100%;background:linear-gradient(90deg,var(--a),var(--a2));border-radius:2px}
/* Install banner */
.inst-ban{background:var(--s);border:1px solid rgba(124,106,247,.3);border-radius:var(--r);padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.inst-t{font-size:12px;color:var(--t2);flex:1}
.inst-t strong{color:var(--a2)}
.inst-btn{font-family:var(--f);font-size:11px;font-weight:600;padding:7px 12px;border-radius:var(--rs);background:var(--a);color:#fff;border:none;cursor:pointer;white-space:nowrap;transition:var(--tr);flex-shrink:0}
.inst-x{background:none;border:none;color:var(--t3);cursor:pointer;font-size:16px;line-height:1;padding:3px}
.start-btn{width:100%;background:linear-gradient(135deg,var(--a),var(--a2));border:none;border-radius:var(--r);padding:15px;font-family:var(--f);font-size:14px;font-weight:600;color:#fff;cursor:pointer;transition:var(--tr);box-shadow:0 4px 20px var(--ag);margin-top:4px}
.start-btn:hover{opacity:.9;transform:translateY(-1px)}
.start-btn:active{transform:translateY(0)}
/* Quiz */
.qprog{margin-bottom:18px}
.pmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.pctr{font-family:var(--m);font-size:11px;color:var(--t3)}
.psco{font-family:var(--m);font-size:11px;color:var(--a2)}
.ptrack{height:3px;background:var(--s2);border-radius:2px;overflow:hidden}
.pfill{height:100%;background:linear-gradient(90deg,var(--a),var(--a2));border-radius:2px;transition:width .4s cubic-bezier(.4,0,.2,1)}
.schip{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-family:var(--m);color:var(--t3);background:var(--s2);border:1px solid var(--nr);padding:3px 9px;border-radius:20px;margin-bottom:8px;margin-right:5px}
.ychip{background:var(--s2);border:1px solid rgba(124,106,247,.3);color:var(--a2)}
.achip{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-family:var(--m);color:var(--w);background:var(--wb);border:1px solid var(--wr);padding:3px 9px;border-radius:20px;margin-bottom:8px}
.qnum{font-family:var(--m);color:var(--a);font-size:11px;margin-bottom:5px}
.qtext{font-size:15px;color:var(--t);line-height:1.65;margin-bottom:18px}
.opts{display:flex;flex-direction:column;gap:7px;margin-bottom:18px}
.opt{display:flex;align-items:flex-start;gap:11px;padding:12px 14px;border:1px solid var(--nr);border-radius:var(--r);cursor:pointer;font-size:14px;color:var(--t);line-height:1.5;background:var(--s);transition:all var(--tr);position:relative;overflow:hidden}
.opt::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--ag),transparent);opacity:0;transition:opacity var(--tr)}
.opt:hover:not(.dis)::before{opacity:1}
.opt:hover:not(.dis){border-color:rgba(124,106,247,.4)}
.opt.dis{cursor:default}
.opt.ok{border-color:var(--okr);background:var(--okb)}
.opt.no{border-color:var(--nor);background:var(--nob)}
.opt.dim{border-color:transparent;background:rgba(255,255,255,.02);opacity:.55}
.ol{font-family:var(--m);font-size:11px;font-weight:500;min-width:20px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:var(--s3);color:var(--t2);flex-shrink:0;margin-top:1px;transition:var(--tr)}
.opt.ok .ol{background:var(--ok);color:#fff}
.opt.no .ol{background:var(--no);color:#fff}
.otxt{flex:1}
/* Feedback */
.fb{border-radius:var(--r);padding:14px;margin-bottom:14px;font-size:13px;line-height:1.6;border:1px solid}
.fb.ok{background:var(--okb);border-color:var(--okr)}
.fb.no{background:var(--nob);border-color:var(--nor)}
.fbv{font-weight:600;font-size:13px;margin-bottom:7px}
.fb.ok .fbv{color:var(--ok)}.fb.no .fbv{color:var(--no)}
.fbe{color:var(--t2);margin-bottom:10px}
.fbo{border-top:1px solid rgba(255,255,255,.06);padding-top:9px;display:flex;flex-direction:column;gap:7px}
.fbor{display:flex;gap:7px;align-items:flex-start;font-size:11px;color:var(--t3);line-height:1.5}
.fbol{font-family:var(--m);font-size:10px;font-weight:500;flex-shrink:0;min-width:16px}
.fbom{flex-shrink:0;font-size:10px}
.fbor.cok{color:var(--ok)}.fbor.cno{color:var(--no)}
/* Saber más */
.smbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:7px;padding:10px;border:1px solid rgba(124,106,247,.4);border-radius:var(--rs);background:transparent;color:var(--a2);font-family:var(--f);font-size:12px;font-weight:500;cursor:pointer;transition:var(--tr);margin-bottom:14px}
.smbtn:hover{background:rgba(124,106,247,.1)}
.smbtn:disabled{opacity:.5;cursor:default}
.smbox{background:var(--s2);border:1px solid rgba(124,106,247,.25);border-radius:var(--r);padding:14px;margin-bottom:14px;font-size:13px;color:var(--t2);line-height:1.7}
.smbox h4{color:var(--a2);font-size:12px;font-weight:600;margin-bottom:7px}
.sml{display:flex;align-items:center;gap:8px;color:var(--t3);font-size:12px}
.dp{display:flex;gap:4px}
.dp span{width:5px;height:5px;border-radius:50%;background:var(--a);animation:dp 1s infinite}
.dp span:nth-child(2){animation-delay:.2s}
.dp span:nth-child(3){animation-delay:.4s}
@keyframes dp{0%,80%,100%{opacity:.2}40%{opacity:1}}
/* Nav */
.nav{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.btn2{padding:10px 16px;font-family:var(--f);font-size:13px;font-weight:500;border:1px solid var(--nr);border-radius:var(--rs);background:var(--s);color:var(--t2);cursor:pointer;transition:var(--tr)}
.btn2:hover{background:var(--s2);color:var(--t)}
.btn1{padding:10px 20px;font-family:var(--f);font-size:13px;font-weight:600;border:none;border-radius:var(--rs);background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;cursor:pointer;transition:var(--tr);box-shadow:0 2px 10px var(--ag)}
.btn1:hover{opacity:.9;transform:translateY(-1px)}.btn1:active{transform:translateY(0)}
.skip{margin-left:auto;font-size:12px;color:var(--t3);background:none;border:none;cursor:pointer;font-family:var(--f);padding:7px;text-decoration:underline;text-underline-offset:3px}
/* Results */
.rh{text-align:center;padding:28px 0}
.rpct{font-size:64px;font-weight:600;font-family:var(--m);line-height:1;margin-bottom:7px;background:linear-gradient(135deg,var(--a),var(--a2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.rl{font-size:13px;color:var(--t2)}
.rnav{display:flex;flex-direction:column;gap:9px;margin-top:7px}
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fu{animation:fu .3s cubic-bezier(.4,0,.2,1) both}
.fu1{animation-delay:.05s}.fu2{animation-delay:.1s}.fu3{animation-delay:.15s}.fu4{animation-delay:.2s}
@media(max-width:480px){.sgrid{grid-template-columns:1fr}.rpct{font-size:50px}}
.sup-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.sup-card{background:var(--s);border:1px solid var(--nr);border-radius:var(--r);padding:12px;cursor:pointer;text-align:left;transition:var(--tr);width:100%;font-family:var(--f)}
.sup-card:hover{border-color:var(--a);background:var(--s2)}
.sup-card-badge{font-family:var(--m);font-size:10px;color:var(--a);margin-bottom:4px}
.sup-card-name{font-size:12px;font-weight:500;color:var(--t);margin-bottom:2px;line-height:1.3}
.sup-card-count{font-size:11px;font-family:var(--m);color:var(--t3)}
.ctx-panel{background:var(--s);border:1px solid rgba(124,106,247,.3);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.ctx-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;user-select:none;background:var(--s2)}
.ctx-title{font-size:11px;font-weight:600;color:var(--a2)}
.ctx-arrow{font-size:11px;color:var(--t3);transition:transform var(--tr)}
.ctx-body{padding:12px 14px;font-size:12px;color:var(--t2);line-height:1.6;display:none}
.ctx-body.open{display:block}
.ctx-body p{margin:0 0 8px}
.ctx-body ul{margin:0 0 8px;padding-left:16px}
.ctx-body li{margin:2px 0}
.ctx-body strong{color:var(--t)}
.ctx-body code{font-family:var(--m);background:var(--s3);padding:1px 5px;border-radius:4px;font-size:11px}
.uml-wrap{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.uml-class{border:1px solid rgba(124,106,247,.4);border-radius:8px;overflow:hidden;font-size:10px;font-family:var(--m)}
.uml-name{background:rgba(124,106,247,.2);padding:5px 8px;color:var(--a2);font-weight:600;text-align:center}
.uml-attr{padding:2px 8px;color:var(--t2);border-top:1px solid rgba(124,106,247,.15)}
.uml-rel{font-size:10px;color:var(--t3);margin:4px 0;font-family:var(--m);text-align:center}
.net-box{border:1px solid rgba(124,106,247,.3);border-radius:6px;padding:6px 10px;background:var(--s3);font-family:var(--m);font-size:11px;color:var(--t2);margin:4px 0}
.net-box strong{color:var(--a2)}
@media(max-width:480px){.sup-grid{grid-template-columns:1fr}.uml-wrap{grid-template-columns:1fr}}
.tem-btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:13px 16px;background:var(--s);border:1px solid rgba(124,106,247,.3);border-radius:var(--r);text-decoration:none;color:var(--t);cursor:pointer;transition:var(--tr);margin-top:4px}
.tem-btn:hover{background:var(--s2);border-color:var(--a)}
.tem-btn-l{display:flex;align-items:center;gap:10px}
.tem-btn-icon{font-size:18px;line-height:1}
.tem-btn-n{font-size:13px;font-weight:500;color:var(--t)}
.tem-btn-s{font-size:11px;font-family:var(--m);color:var(--t3);margin-top:1px}
.tem-btn-arr{font-size:14px;color:var(--a2)}
</style>
</head>
<body>
<div id="app">
<header class="hdr">
  <div class="logo">
    <div class="logo-i">TAI</div>
    <div><div class="logo-t">TAI-LI Quiz</div><div class="logo-s">2019 · 2022 · 2024</div></div>
  </div>
  <div id="hstats"></div>
</header>
<div id="main"></div>
</div>
<script>
const Q2019=[{id:1,year:2019,section:"Primera parte",anulada:false,q:"En relación a los derechos y deberes de los ciudadanos, el artículo 30 de la Constitución Española indica que:",opts:["Mediante ley podrán ser de obligado cumplimiento los deberes de los ciudadanos en los casos de grave riesgo, catástrofe o calamidad pública.","Mediante Real Decreto podrán ser de obligado cumplimiento los deberes de los ciudadanos en los casos de grave riesgo, catástrofe o calamidad pública.","Mediante ley podrán eliminarse los deberes de los ciudadanos en los casos de grave riesgo, catástrofe o calamidad pública.","Mediante ley podrán regularse los deberes de los ciudadanos en los casos de grave riesgo, catástrofe o calamidad pública."],answer:3,explanation:"El art. 30 CE permite que la ley regule (no elimine ni imponga por Real Decreto) los deberes ciudadanos en situaciones de grave riesgo o catástrofe.",expOpts:["La ley regula pero no hace 'de obligado cumplimiento' en los términos descritos.","Un Real Decreto no es el instrumento adecuado; se exige Ley.","La ley no puede eliminar deberes constitucionales.","Correcto: el art. 30.4 CE permite que la ley regule las obligaciones ante situaciones de grave riesgo."]},
{id:2,year:2019,section:"Primera parte",anulada:false,q:"Según el artículo 62 de la Constitución Española, ¿a quién corresponde expedir los decretos acordados en el Consejo de Ministros?",opts:["Al Rey.","Al Presidente del Gobierno.","Al titular del Ministerio de la Presidencia.","Al Presidente de la Mesa del Congreso."],answer:0,explanation:"El art. 62.f) CE atribuye al Rey la función de expedir los decretos acordados en el Consejo de Ministros, actuando con refrendo ministerial.",expOpts:["Correcto: art. 62.f) CE. El Rey expide los decretos del Consejo de Ministros.","El Presidente los propone pero quien los expide formalmente es el Rey.","El titular de la Presidencia refrenda pero no expide.","El Presidente de la Mesa del Congreso no tiene competencia sobre decretos del Gobierno."]},
{id:3,year:2019,section:"Primera parte",anulada:false,q:"Según el artículo 159 de la Constitución Española, el Tribunal Constitucional se compone de:",opts:["Doce miembros nombrados por el Rey; de ellos, tres serán a propuesta del Congreso por mayoría de tres quintos de sus miembros.","Doce miembros nombrados por el Rey; de ellos, cuatro serán a propuesta del Congreso por mayoría de tres quintos de sus miembros.","Dieciséis miembros nombrados por el Rey; de ellos, cuatro serán a propuesta del Congreso por mayoría de tres quintos de sus miembros.","Dieciséis miembros nombrados por el Rey; de ellos, tres serán a propuesta del Congreso por mayoría de tres quintos de sus miembros."],answer:1,explanation:"El art. 159 CE establece 12 miembros en total: 4 a propuesta del Congreso, 4 del Senado, 2 del Gobierno y 2 del CGPJ, todos nombrados por el Rey.",expOpts:["Falso: son 12 miembros pero 4 a propuesta del Congreso (no 3).","Correcto: 12 miembros, 4 a propuesta del Congreso. Art. 159.1 CE.","Falso: el TC tiene 12 miembros, no 16.","Falso: el TC tiene 12 miembros, no 16."]},
{id:4,year:2019,section:"Primera parte",anulada:false,q:"Según el artículo 68 de la Constitución Española, indique de cuántos diputados se compone el Congreso:",opts:["De un mínimo de 250 y de un máximo de 350.","De un mínimo de 300 y de un máximo de 400.","De un mínimo de 300 y de un máximo de 350.","De un mínimo de 350 y de un máximo de 400."],answer:1,explanation:"El art. 68.1 CE: el Congreso se compone de un mínimo de 300 y un máximo de 400 Diputados. Actualmente tiene 350.",expOpts:["Falso: el mínimo constitucional es 300, no 250.","Correcto: mínimo 300, máximo 400. Art. 68.1 CE.","Falso: el máximo es 400, no 350.","Falso: el mínimo es 300, no 350."]},
{id:5,year:2019,section:"Primera parte",anulada:false,q:"Según se expone en el artículo 113 de la Constitución Española, la moción de censura deberá ser propuesta por:",opts:["Al menos la décima parte de los Diputados.","Al menos un veinte por ciento de los Diputados.","Al menos la décima parte de cada una de las Cámaras.","Al menos 20 Diputados y 20 Senadores."],answer:0,explanation:"El art. 113.2 CE exige que la moción de censura sea propuesta al menos por la décima parte de los Diputados (35 diputados), incluyendo un candidato alternativo a la Presidencia.",expOpts:["Correcto: mínimo 1/10 de los Diputados (35). Art. 113.2 CE.","Falso: no es un 20%, sino un 10%.","Falso: la moción de censura se presenta en el Congreso, no en ambas Cámaras.","Falso: no se requiere participación del Senado."]},
{id:6,year:2019,section:"Primera parte",anulada:false,q:"¿Cuál de los siguientes NO es uno de los 17 Objetivos de Desarrollo Sostenibles de la Agenda 2030?",opts:["Hambre cero.","Educación de calidad.","Aguas residuales y saneamiento.","Trabajo decente y crecimiento económico."],answer:2,explanation:"El ODS 6 es 'Agua limpia y saneamiento', no 'Aguas residuales y saneamiento'. El término exacto es agua limpia y saneamiento accesible para todos.",expOpts:["ODS 2: Hambre cero. Sí es uno de los 17 ODS.","ODS 4: Educación de calidad. Sí es uno de los 17 ODS.","El ODS real es 'Agua limpia y saneamiento' (ODS 6), no 'Aguas residuales y saneamiento'.","ODS 8: Trabajo decente y crecimiento económico. Sí es uno de los 17 ODS."]},
{id:7,year:2019,section:"Primera parte",anulada:false,q:"Según la Ley 19/2013, de transparencia, acceso a la información pública y buen gobierno, ¿cuál de los siguientes NO es miembro de la Comisión de Transparencia y Buen Gobierno?",opts:["Un Diputado.","Un representante de la Subsecretaria de Estado de Administraciones Públicas.","Un representante del Defensor del Pueblo.","Un representante de la Autoridad Independiente de Responsabilidad Fiscal."],answer:1,explanation:"El Consejo de Transparencia incluye al Defensor del Pueblo, representantes del Congreso, Senado, CGPJ y Tribunal de Cuentas. La Subsecretaría de Administraciones Públicas no tiene representación específica.",expOpts:["Un Diputado sí forma parte del Consejo.","Falso: no existe tal representación en el Consejo de Transparencia.","El Defensor del Pueblo sí tiene representación.","Un representante de AIREF sí está incluido."]},
{id:8,year:2019,section:"Primera parte",anulada:false,q:"Indique cuál es el Título de la Constitución Española relativo a la Organización Territorial del Estado:",opts:["Título IV.","Título VI.","Título VIII.","Título X."],answer:2,explanation:"El Título VIII de la CE (arts. 137-158) regula la Organización Territorial del Estado, incluyendo Comunidades Autónomas, municipios y provincias.",expOpts:["El Título IV regula el Gobierno y la Administración (arts. 97-107).","El Título VI regula el Poder Judicial (arts. 117-127).","Correcto: el Título VIII regula la Organización Territorial del Estado.","El Título X regula la Reforma Constitucional (arts. 166-169)."]},
{id:9,year:2019,section:"Primera parte",anulada:false,q:"De acuerdo con el artículo 103.1 de la Constitución Española, la Administración Pública sirve con objetividad los intereses generales y actúa de acuerdo con los principios de:",opts:["Eficacia, eficiencia, descentralización, desconcentración y cooperación, con sometimiento pleno a la Ley y al Derecho.","Eficacia, jerarquía, descentralización, desconcentración y coordinación, con sometimiento pleno a la ley y al Derecho.","Eficacia, jerarquía, descentralización, concentración y coordinación, con sometimiento pleno al ordenamiento jurídico.","Eficacia, jerarquía, descentralización, desconcentración y cooperación, con sometimiento pleno a la Ley y al Derecho."],answer:1,explanation:"El art. 103.1 CE: eficacia, jerarquía, descentralización, desconcentración y coordinación, con sometimiento pleno a la ley y al Derecho.",expOpts:["Falso: no es 'eficiencia' sino 'jerarquía', y no es 'cooperación' sino 'coordinación'.","Correcto: eficacia, jerarquía, descentralización, desconcentración y coordinación. Art. 103.1 CE.","Falso: dice 'concentración' en lugar de 'desconcentración', conceptos opuestos.","Falso: 'cooperación' no aparece en el art. 103.1 CE; el principio correcto es 'coordinación'."]},
{id:10,year:2019,section:"Primera parte",anulada:false,q:"Según lo establecido en el artículo 82 de la Constitución Española, cuando se trate de refundir varios textos legales en uno solo, la delegación legislativa de las Cortes Generales en el Gobierno deberá otorgarse mediante:",opts:["Una Ley de Bases.","Una Ley Orgánica.","Una Ley Ordinaria.","Un Decreto Legislativo."],answer:2,explanation:"Para refundir textos existentes se usa Ley Ordinaria. Para textos articulados nuevos se usa Ley de Bases. El Decreto Legislativo es el resultado, no el instrumento.",expOpts:["La Ley de Bases se usa para crear textos articulados, no para refundición.","La Ley Orgánica no es el instrumento para esta delegación.","Correcto: para refundir textos existentes se usa ley ordinaria. Art. 82.2 CE.","El Decreto Legislativo es el resultado de la delegación, no el instrumento que la otorga."]},
{id:11,year:2019,section:"Primera parte",anulada:false,q:"En el artículo 51 de la Ley Orgánica 3/2007, para la igualdad efectiva de mujeres y hombres, se definen criterios de actuación de las Administraciones públicas. ¿Cuál de los siguientes es uno de ellos?",opts:["Facilitar la conciliación de la vida familiar y laboral, sin menoscabo de la formación profesional y acción social.","Fomentar la participación en igualdad, tanto en el acceso al empleo público como a lo largo de la carrera profesional.","Establecer medidas cautelares de protección frente al acoso sexual.","Establecer medidas efectivas para eliminar cualquier discriminación retributiva, directa o indirecta, por razón de sexo."],answer:3,explanation:"El art. 51 de la LO 3/2007 establece como criterio de actuación el eliminar la discriminación retributiva por razón de sexo.",expOpts:["La conciliación se menciona en otros artículos.","Fomentar la participación sí es criterio, pero la opción d es más específica del art. 51.","Las medidas contra el acoso se tratan en otros artículos.","Correcto: eliminar la discriminación retributiva es un criterio explícito del art. 51."]},
{id:12,year:2019,section:"Primera parte",anulada:false,q:"Según el artículo 8 de la Ley Orgánica 3/2007, para la igualdad efectiva de mujeres y hombres, todo trato desfavorable a las mujeres relacionado con el embarazo o la maternidad constituye:",opts:["Discriminación indirecta por razón de sexo.","Discriminación directa por razón de sexo.","Discriminación por asociación en razón de sexo.","Discriminación maternal por razón de sexo."],answer:1,explanation:"El art. 8 de la LO 3/2007: todo trato desfavorable relacionado con el embarazo o la maternidad constituye discriminación DIRECTA por razón de sexo.",expOpts:["La discriminación indirecta se produce cuando una norma aparentemente neutra perjudica desproporcionadamente a las mujeres.","Correcto: art. 8 LO 3/2007. El embarazo y la maternidad son discriminación directa por razón de sexo.","'Discriminación por asociación' no es la categoría aplicable.","'Discriminación maternal' no es un término jurídico reconocido en la ley."]},
{id:13,year:2019,section:"Primera parte",anulada:false,q:"Según el artículo 26 de la Ley 39/2006, de Promoción de la Autonomía Personal y Atención a las personas en situación de dependencia, señale la opción correcta en relación a la clasificación de los grados de dependencia:",opts:["Grado I. Dependencia moderada: cuando la persona necesita ayuda para realizar varias actividades básicas de la vida diaria, al menos una vez al día o tiene necesidades de apoyo intermitente o limitado para su autonomía personal.","Grado II. Gran dependencia: cuando la persona necesita ayuda para realizar varias actividades básicas de la vida diaria una o dos veces al día, pero no quiere el apoyo permanente de un cuidador o tiene necesidades de apoyo extenso para su autonomía personal.","Grado III. Dependencia total: cuando la persona necesita ayuda para realizar varias actividades básicas de la vida diaria varias veces al día y, por su pérdida total de autonomía necesita el apoyo indispensable y continuo de otra persona o tiene necesidades de apoyo generalizado para su autonomía personal.","Grado IV. Dependencia máxima: cuando la persona necesita constantemente ayuda para realizar cualquier actividad básica de la vida diaria."],answer:0,explanation:"La ley establece tres grados. El Grado I (Dependencia moderada) corresponde a necesitar ayuda al menos una vez al día o apoyo intermitente.",expOpts:["Correcto: Grado I es Dependencia moderada, con ayuda al menos una vez al día o apoyo intermitente.","Falso: Grado II es Dependencia severa (no Gran dependencia). 'No quiere apoyo' es incorrecto.","Falso: Grado III es Gran dependencia, no 'dependencia total'.","Falso: la ley solo tiene tres grados; no existe Grado IV."]},
{id:14,year:2019,section:"Primera parte",anulada:false,q:"En relación al DNIe v3.0, indique la respuesta correcta:",opts:["Contiene dos certificados electrónicos de componentes: uno de Autenticación y otro de Firma.","La renovación de los certificados incluidos en la tarjeta del DNI electrónico puede realizarse en los Puntos de Actualización del DNIe y a través de Internet.","Actualmente, los certificados electrónicos de Autenticación y de Firma Electrónica que contiene tienen un plazo de validez de 24 meses.","El PIN debe tener un mínimo de 8 caracteres y un máximo de 12."],answer:2,explanation:"El DNIe v3.0 contiene certificados de Autenticación y de Firma con una validez de 24 meses (2 años) a partir de la emisión o renovación.",expOpts:["Falso: los certificados son 'del titular', no 'de componentes'.","Falso: la renovación solo puede hacerse en Comisarías o Puntos de Actualización físicos, no por Internet en v3.0.","Correcto: los certificados del DNIe v3.0 tienen un plazo de validez de 24 meses.","Falso: el PIN del DNIe tiene entre 4 y 8 caracteres numéricos."]},
{id:15,year:2019,section:"Primera parte",anulada:false,q:"La nueva Agenda Digital \"España Digital 2025\" recoge un conjunto de medidas, reformas e inversiones. ¿En cuántos ejes se articulan estas medidas?",opts:["6","9","12","10"],answer:3,explanation:"La Agenda Digital 'España Digital 2025' se estructura en 10 ejes de actuación que abarcan conectividad, digitalización, administración digital y competencias digitales.",expOpts:["Falso: no son 6 ejes.","Falso: no son 9 ejes.","Falso: no son 12 ejes.","Correcto: España Digital 2025 se articula en 10 ejes."]},
{id:16,year:2019,section:"Primera parte",anulada:false,q:"¿Qué algoritmos criptográficos soporta el DNIe v3.0?",opts:["RSA, PGP y Blowfish.","RC5 y algoritmo de hash MD5.","ElGamal, algoritmo de hash MD5 y cifrado simétrico Triple DES.","RSA, algoritmo de hash SHA-256 y cifrado simétrico Triple DES y AES."],answer:3,explanation:"El DNIe v3.0 soporta RSA para criptografía asimétrica, SHA-256 para hash, y Triple DES y AES para cifrado simétrico.",expOpts:["Falso: PGP es un programa de cifrado, no un algoritmo base. Blowfish no está soportado.","Falso: RC5 y MD5 no son los algoritmos del DNIe v3.0.","Falso: ElGamal y MD5 no son los algoritmos del DNIe v3.0.","Correcto: RSA, SHA-256, Triple DES y AES son los algoritmos del DNIe v3.0."]},
{id:17,year:2019,section:"Primera parte",anulada:false,q:"Con respecto a la prescripción de las sanciones referidas a la Ley Orgánica 3/2018, de Protección de Datos Personales y garantía de los derechos digitales, señale cuál de estas afirmaciones es correcta:",opts:["Las sanciones por importe igual o inferior a 40.000 euros, prescriben en el plazo de diez meses.","Las sanciones por importe igual o inferior a 40.000 euros, prescriben en el plazo de un año.","Las sanciones por importe igual o inferior a 40.000 euros, prescriben en el plazo de dos años","Las sanciones por importe igual o inferior a 40.000 euros, prescriben en el plazo de tres años."],answer:1,explanation:"La LOPDGDD establece: sanciones leves (hasta 40.000€) prescriben en 1 año, graves en 2 años y muy graves en 3 años.",expOpts:["Falso: no existe un plazo de 10 meses en la LOPDGDD.","Correcto: las sanciones hasta 40.000€ prescriben en 1 año.","Falso: el plazo de 2 años corresponde a sanciones graves.","Falso: el plazo de 3 años es para sanciones muy graves."]},
{id:18,year:2019,section:"Primera parte",anulada:false,q:"Señale la respuesta correcta en relación al ámbito de aplicación material del Reglamento (UE) 2016/679 en lo que respecta al tratamiento de datos personales:",opts:["Se aplica al tratamiento total o parcialmente automatizado de datos personales por parte de las autoridades competentes con fines de prevención, investigación, detección o enjuiciamiento de infracciones penales, o de ejecución de sanciones penales, incluida la de protección frente a amenazas a la seguridad pública y su prevención.","Se aplica al tratamiento total o parcialmente automatizado de datos personales, así como al tratamiento no automatizado de datos personales contenidos o destinados a ser incluidos en un fichero.","Se aplica al tratamiento de datos personales efectuado por una persona física en el ejercicio de actividades exclusivamente personales o domésticas.","Se aplica al tratamiento total de datos personales."],answer:1,explanation:"El art. 2.1 del RGPD: se aplica al tratamiento automatizado y al tratamiento no automatizado de datos en ficheros. Las actividades domésticas y la prevención penal tienen regímenes especiales.",expOpts:["Falso: el tratamiento con fines penales se rige por la Directiva 2016/680, no el RGPD.","Correcto: art. 2.1 RGPD. Aplica al tratamiento automatizado y al no automatizado en ficheros.","Falso: las actividades personales/domésticas están expresamente excluidas (art. 2.2.c).","Falso: el RGPD requiere condiciones específicas, no se aplica a 'todo tratamiento'."]},
{id:19,year:2019,section:"Primera parte",anulada:false,q:"Según el Esquema Nacional de Seguridad, ¿cuál de las siguientes medidas de seguridad afecta a la dimensión de Trazabilidad?",opts:["Copias de seguridad.","Sellos de tiempo.","Cifrado.","Firma electrónica."],answer:1,explanation:"Los sellos de tiempo permiten certificar que una información existía en un momento determinado, garantizando la trazabilidad temporal de los eventos.",expOpts:["Las copias de seguridad protegen principalmente la Disponibilidad.","Correcto: los sellos de tiempo garantizan la trazabilidad temporal.","El cifrado protege la Confidencialidad.","La firma electrónica protege Autenticidad e Integridad, no específicamente la Trazabilidad."]},
{id:20,year:2019,section:"Primera parte",anulada:false,q:"Conforme al artículo 30 de la Ley 39/2015, de Procedimiento Administrativo Común de las Administraciones Públicas, el cómputo de plazos señalados en días, siempre que por Ley o en el Derecho de la Unión Europea no se exprese otro cómputo, se entienden como:",opts:["Días hábiles, contados a partir del día siguiente a aquel que tenga la notificación o publicación del acto de que se trate.","Días hábiles, contados a partir del mismo día a aquel que tenga la notificación o publicación del acto de que se trate.","Días naturales, contados a partir del día siguiente a aquel que tenga la notificación o publicación del acto de que se trate.","Días naturales, contados a partir del mismo día a aquel que tenga la notificación o publicación del acto de que se trate."],answer:0,explanation:"El art. 30.2 de la Ley 39/2015: los plazos en días son hábiles (salvo que la ley diga otra cosa), y se computan a partir del día siguiente al de la notificación.",expOpts:["Correcto: días hábiles, a partir del día siguiente a la notificación. Art. 30.2 Ley 39/2015.","Falso: el cómputo empieza el día siguiente, no el mismo día.","Falso: el sistema general de la Ley 39/2015 es días hábiles, no naturales.","Falso: ni son días naturales ni se cuentan desde el mismo día."]},
{id:21,year:2019,section:"Primera parte",anulada:false,q:"La guía de auditoría, que identifica los requisitos a cumplir en conformidad con el Esquema Nacional de Interoperabilidad (ENI), contiene un conjunto de controles apropiados para evaluar el cumplimiento de lo previsto en el ENI, agrupados en tres categorías:",opts:["Marco organizativo, Marco operacional y Medidas de protección.","Marco organizativo, Marco semántico y Marco de seguridad.","Evaluación organizativa, Evaluación semántica y Evaluación temporal.","Marco organizativo, Marco operacional y Medidas técnicas."],answer:3,explanation:"La guía de auditoría del ENI organiza sus controles en: Marco organizativo, Marco operacional y Medidas técnicas.",expOpts:["Falso: 'Medidas de protección' es terminología del ENS, no del ENI.","Falso: 'Marco semántico' no es categoría de la guía del ENI.","Falso: 'Evaluación organizativa' no es la terminología correcta.","Correcto: Marco organizativo, Marco operacional y Medidas técnicas son las tres categorías."]},
{id:22,year:2019,section:"Primera parte",anulada:false,q:"¿Cuál de las siguientes NO es una Norma Técnica de Interoperabilidad?",opts:["Catálogo de estándares.","Modelo de Datos para el intercambio de asientos entre las Entidades Registrales.","Protocolo de gestión de recursos de la Administración.","Expediente Electrónico."],answer:2,explanation:"Las NTI incluyen: Catálogo de estándares, Expediente Electrónico, Documento Electrónico, Digitalización, entre otras. 'Protocolo de gestión de recursos' no es una NTI.",expOpts:["El Catálogo de estándares sí es una NTI.","El Modelo de Datos para intercambio de asientos registrales sí es una NTI.","Correcto: no existe NTI llamada 'Protocolo de gestión de recursos de la Administración'.","El Expediente Electrónico sí es una NTI."]},
{id:23,year:2019,section:"Primera parte",anulada:false,q:"Dentro de los servicios horizontales de Administración Electrónica, indique la afirmación correcta respecto a la funcionalidad principal del producto eVisor:",opts:["Es un servicio que permite la creación de mapas interactivos para su presentación en portales web, cuadros de mando y otras aplicaciones sin necesidad de conocimientos de georreferenciación ni desarrollos adicionales.","Es una aplicación web de generación de copia auténtica en papel de documentos con firma electrónica y de justificantes de firma electrónica.","Es una herramienta basada en un Sistema de Información Territorial (GIS), que ofrece las funcionalidades necesarias para facilitar la gestión de la información de las Administraciones Públicas mediante la georreferenciación.","Es una herramienta que ofrece el Observatorio de Accesibilidad Web para realizar el servicio de diagnóstico en línea para las Administraciones Públicas."],answer:1,explanation:"eVisor es la herramienta de la AGE para visualizar y generar copias auténticas en papel de documentos con firma electrónica.",expOpts:["Eso describe una herramienta de mapas interactivos, no eVisor.","Correcto: eVisor genera copias auténticas en papel de documentos firmados electrónicamente.","Eso describe una herramienta GIS, no eVisor.","Eso describe el Observatorio de Accesibilidad, no eVisor."]},
{id:24,year:2019,section:"Primera parte",anulada:false,q:"¿Qué solución común permite la gestión de la nómina de empleados públicos?",opts:["SOROLLA2","BADARAL","NEDAES","NOMINAe"],answer:2,explanation:"NEDAES (Nómina del Estado) es la aplicación de la AGE para la gestión de nóminas de empleados públicos. SOROLLA2 es gestión contable y BADARAL es gestión de recursos humanos.",expOpts:["SOROLLA2 es la solución de gestión económico-financiera y contable.","BADARAL es la solución de gestión de recursos humanos/personal de la AGE.","Correcto: NEDAES gestiona la nómina de los empleados públicos del Estado.","NOMINAe no es la solución principal de gestión de nóminas de la AGE."]},
{id:25,year:2019,section:"Primera parte",anulada:false,q:"¿Qué es la arquitectura ARM?",opts:["Una arquitectura avanzada para microprocesadores RISC.","Una arquitectura para computación en la nube, basada en el intercambio asíncrono de información entre nodos usando agentes autónomos.","Una arquitectura de almacenamiento de información basada en redes de comunicaciones de fibra óptica.","Una arquitectura de computación cuántica."],answer:0,explanation:"ARM (Advanced RISC Machine) es una arquitectura de procesadores RISC ampliamente utilizada en dispositivos móviles y sistemas embebidos por su eficiencia energética.",expOpts:["Correcto: ARM es una arquitectura RISC avanzada, dominante en dispositivos móviles.","Falso: no tiene relación con la computación en la nube.","Falso: no tiene relación con el almacenamiento en fibra óptica.","Falso: no es una arquitectura de computación cuántica."]},
{id:26,year:2019,section:"Primera parte",anulada:false,q:"Indique la velocidad máxima de transferencia del USB 4.0:",opts:["Hasta 20 Gbps.","Hasta 30 Gbps.","Hasta 40 Gbps.","Hasta 50 Gbps."],answer:2,explanation:"USB 4.0 tiene una velocidad máxima de 40 Gbps, el doble que USB 3.2 Gen 2x2 (20 Gbps).",expOpts:["Falso: 20 Gbps es USB 3.2 Gen 2x2.","Falso: 30 Gbps no es una velocidad estándar de USB.","Correcto: USB 4.0 alcanza hasta 40 Gbps.","Falso: 50 Gbps no es la velocidad máxima de USB 4.0."]},
{id:27,year:2019,section:"Primera parte",anulada:false,q:"Indique cuál de las siguientes es una tecnología de interfaz hardware:",opts:["Thunderbird","HIT","Thunderbolt","RISC"],answer:2,explanation:"Thunderbolt es la tecnología de interfaz hardware de alta velocidad desarrollada por Intel. Thunderbird es un cliente de correo.",expOpts:["Thunderbird es el cliente de correo de Mozilla, no una interfaz hardware.","HIT no es una tecnología de interfaz hardware reconocida.","Correcto: Thunderbolt es una tecnología de interfaz hardware de alta velocidad de Intel.","RISC es una arquitectura de procesadores, no una interfaz hardware."]},
{id:28,year:2019,section:"Primera parte",anulada:false,q:"En relación con el almacenamiento, ¿qué es un SSD?",opts:["Secure System Disk. Es un sistema de almacenamiento de datos cifrado AES 128.","Solid State Disk. Es un dispositivo de almacenamiento de datos que utiliza discos magnéticos.","Solid State Drive. Es un dispositivo de almacenamiento de datos que utiliza memoria no volátil.","Solid State Device. Es un dispositivo de almacenamiento de datos que utiliza memoria volátil."],answer:2,explanation:"SSD significa Solid State Drive. Utiliza memoria flash no volátil, sin partes mecánicas móviles. Más rápido y silencioso que los HDD.",expOpts:["Falso: SSD no significa 'Secure System Disk'.","Falso: SSD usa memoria flash, no discos magnéticos (eso serían los HDD).","Correcto: Solid State Drive, con memoria no volátil (flash NAND).","Falso: la memoria de un SSD es NO volátil."]},
{id:29,year:2019,section:"Primera parte",anulada:false,q:"AV1 es un:",opts:["Nuevo sistema de realidad aumentada.","Nuevo sistema operativo para la IoT.","Nuevo códec de vídeo.","Nuevo estándar de seguridad para WiFi 6."],answer:2,explanation:"AV1 (AOMedia Video 1) es un códec de vídeo de código abierto desarrollado por la Alliance for Open Media. Ofrece mayor eficiencia de compresión que H.264/H.265.",expOpts:["Falso: AV1 no es un sistema de realidad aumentada.","Falso: AV1 no es un sistema operativo.","Correcto: AV1 es un códec de vídeo de código abierto y alta eficiencia.","Falso: AV1 no tiene relación con la seguridad WiFi."]},
{id:30,year:2019,section:"Primera parte",anulada:false,q:"Si un árbol binario lo recorremos siguiendo el orden siguiente: raíz, subárbol izquierdo, subárbol derecho, ¿cuál de los siguientes tipos de recorrido estamos utilizando?",opts:["Preorden","Inorden","Postorden","Reorden"],answer:0,explanation:"Preorden: raíz→izquierda→derecha. Inorden: izquierda→raíz→derecha. Postorden: izquierda→derecha→raíz. 'Reorden' no existe.",expOpts:["Correcto: Preorden visita primero la raíz, luego subárbol izquierdo y por último el derecho.","Inorden visita izquierda, raíz, derecha.","Postorden visita izquierda, derecha, raíz.","'Reorden' no es un tipo de recorrido de árboles binarios."]},
{id:31,year:2019,section:"Primera parte",anulada:false,q:"En una distribución Linux, ¿qué directorio contiene, entre otros, los ficheros de configuración tanto a nivel de componentes del sistema operativo en sí, como de los programas y aplicaciones instaladas a posteriori?",opts:["/root","/bin","/dev","/etc"],answer:3,explanation:"En Linux, /etc contiene los ficheros de configuración del sistema y aplicaciones. /root es el home del superusuario, /bin los ejecutables y /dev los dispositivos.",expOpts:["/root es el directorio home del usuario root.","/bin contiene los ejecutables binarios básicos.","/dev contiene los ficheros de dispositivos.","Correcto: /etc contiene los ficheros de configuración del sistema y las aplicaciones."]},
{id:32,year:2019,section:"Primera parte",anulada:false,q:"En los sistemas Linux, si se ejecuta el comando chmod 640 para modificar los permisos de un archivo, ¿qué permisos estoy asignando?",opts:["Acceso de lectura, escritura y ejecución al propietario, acceso de lectura al grupo y ningún acceso al resto de usuarios.","Acceso de lectura, escritura y ejecución al propietario, acceso de lectura y escritura al grupo, y acceso de ejecución al resto de usuarios.","Acceso de lectura y escritura al propietario, acceso de lectura al grupo, y ningún acceso al resto de usuarios.","Acceso de lectura y escritura al propietario, acceso de ejecución al grupo, y ningún acceso al resto de usuarios."],answer:2,explanation:"chmod 640: 6=110 (rw-) propietario, 4=100 (r--) grupo, 0=000 (---) otros. Lectura(4)+escritura(2)+ejecución(1).",expOpts:["Falso: 6=rw- (no incluye ejecución). 7 sería rwx.","Falso: no hay ejecución en ningún nivel con 640.","Correcto: 6=rw-, 4=r--, 0=--- (sin acceso).","Falso: 4 en grupo es r-- (lectura), no ejecución."]},
{id:33,year:2019,section:"Primera parte",anulada:false,q:"¿Cuál de los siguientes NO es un ORM (Mapeador Objeto-Relacional)?",opts:["ADO.NET Entity Framework","Ruby Hibernation","NHibernate","Hibernate"],answer:1,explanation:"'Ruby Hibernation' no es un ORM real. Los ORM reales incluyen Entity Framework (.NET), NHibernate (.NET), Hibernate (Java), ActiveRecord (Ruby on Rails).",expOpts:["ADO.NET Entity Framework sí es un ORM para .NET.","Correcto: 'Ruby Hibernation' no existe como ORM. El ORM de Ruby on Rails es ActiveRecord.","NHibernate sí es un ORM para .NET.","Hibernate sí es un ORM para Java."]},
{id:34,year:2019,section:"Primera parte",anulada:false,q:"¿Cuál de las siguientes opciones NO se corresponde con una de las 12 Reglas de Codd?",opts:["Regla de la no subversión. Si el sistema ofrece una interfaz de acceso a bajo nivel, dicho acceso no se podrá usar para subvertir el sistema (por ejemplo para sortear restricciones de integridad o seguridad).","Tratamiento sistemático de valores nulos. El sistema debe permitir que haya campos nulos. Se debe disponer de una representación de valores desconocidos y no aplicables diferente de los valores normales.","Dependencia de la distribución. Que la base de datos se almacene o gestione de forma distribuida en varios servidores afecta al uso de la misma y a la programación de las aplicaciones de usuario.","Catálogo dinámico en línea basado en el modelo relacional. El sistema debe soportar un catálogo en línea, el catálogo relacional, que da acceso a la estructura de la base de datos y que debe ser accesible a los usuarios autorizados."],answer:2,explanation:"Las 12 Reglas de Codd incluyen la 'Independencia de la distribución' (regla 9): la distribución NO debe afectar al uso ni a la programación. La opción c invierte el concepto.",expOpts:["La regla de la no subversión (regla 12) sí es una Regla de Codd.","El tratamiento sistemático de valores nulos (regla 3) sí es una Regla de Codd.","Correcto: la regla real es 'Independencia de la distribución'. La opción c la invierte.","El catálogo dinámico en línea (regla 4) sí es una Regla de Codd."]},
{id:35,year:2019,section:"Primera parte",anulada:false,q:"Indique la definición correcta en referencia a los diagramas de flujo de datos de Métrica v3:",opts:["Almacén de datos: representa la información en movimiento utilizada por el sistema.","Proceso de control: representa procesos que coordinan y sincronizan las actividades de otros procesos del diagrama de flujo de datos.","Flujo de control: representa el flujo entre dos procesos de control.","Flujo de datos: representa el movimiento de los datos, y establece la comunicación entre dos almacenes."],answer:1,explanation:"En los DFD de Métrica v3, el Proceso de control representa procesos que coordinan y sincronizan otras actividades. El Almacén guarda info en reposo.",expOpts:["Falso: el Almacén de datos representa información en reposo, no en movimiento.","Correcto: el Proceso de control coordina y sincroniza actividades de otros procesos.","Falso: el flujo de control conecta procesos de control pero no es esa la definición principal.","Falso: el flujo de datos conecta procesos, entidades o almacenes, no exclusivamente dos almacenes."]},
{id:36,year:2019,section:"Primera parte",anulada:false,q:"Una tabla se encuentra en Tercera Forma Normal (3FN) si:",opts:["Está en 2FN y todo atributo que no forma parte de una clave candidata depende de ella al completo.","Está en 2FN y no existe ninguna dependencia transitiva de atributos no principales respecto de las claves.","Está en 2FN y no existen relaciones de dependencia de reunión no triviales que no se generen desde las claves.","Está en 2FN y los atributos que no forman parte de ninguna clave dependen de la clave principal."],answer:1,explanation:"La 3FN exige estar en 2FN y eliminar las dependencias transitivas: ningún atributo no clave debe depender de otro atributo no clave.",expOpts:["Falso: eso describe la 2FN (dependencia funcional completa).","Correcto: la 3FN elimina dependencias transitivas de atributos no principales.","Falso: eso describe la Forma Normal de Boyce-Codd o la 4FN.","Falso: habla de 'clave principal' pero la 3FN se refiere a cualquier clave candidata."]},
{id:37,year:2019,section:"Primera parte",anulada:false,q:"Según Métrica v3, en la teoría de la normalización se define el término de Dependencia Funcional como:",opts:["Un atributo Y depende funcionalmente respecto de otro X, si depende funcionalmente de él en su totalidad, es decir, no depende de ninguno de los posibles atributos que formen parte de X.","Un atributo Y se dice que depende funcionalmente de otro X si, y sólo si, a cada valor de X le corresponde un único valor de Y.","Un atributo depende funcionalmente de otro si, y sólo si, depende de él a través de otro atributo.","Un atributo X sólo puede tomar un único valor de dominio simple."],answer:1,explanation:"La Dependencia Funcional (DF) se define como: Y depende funcionalmente de X (X→Y) si, y solo si, para cada valor de X existe exactamente un valor de Y.",expOpts:["Falso: eso describe la Dependencia Funcional Completa, no la DF simple.","Correcto: a cada valor de X le corresponde un único valor de Y. Definición clásica de DF.","Falso: eso describe la Dependencia Funcional Transitiva.","Falso: eso describe el concepto de dominio simple."]},
{id:38,year:2019,section:"Primera parte",anulada:false,q:"En el lenguaje C++, si hablamos de un bucle con estructura do…while:",opts:["Sólo se ejecuta si la condición del bucle es verdadera.","Evalúa la condición del bucle y después se ejecuta al menos una vez.","Se ejecuta una vez antes de evaluar la condición del bucle.","Se ejecuta una sola vez siempre y cuando sea verdadera la condición del bucle."],answer:2,explanation:"El bucle do...while evalúa la condición al final, por lo que el cuerpo siempre se ejecuta al menos una vez.",expOpts:["Falso: eso describe el bucle while normal.","Falso: es al revés; el do...while se ejecuta primero y luego evalúa la condición.","Correcto: en do...while el cuerpo se ejecuta primero y luego se evalúa la condición.","Falso: se ejecuta siempre al menos una vez; la condición determina si se REPITE."]},
{id:39,year:2019,section:"Primera parte",anulada:false,q:"Señale la respuesta correcta en relación a las tecnologías y herramientas de desarrollo front-end:",opts:["Sass, Less y Stylus, son preprocesadores de CSS.","Postman es una herramienta que sirve para probar la parte de front-end, no permitiendo validar los servicios REST.","Node js fue construido con el motor de java jre 1.9","Bootstrap es una herramienta de desarrollo que permite realizar test de los servicios REST, aislando al programador del front-end."],answer:0,explanation:"Sass, Less y Stylus son preprocesadores de CSS que permiten usar variables, anidamiento y mixins, generando CSS estándar.",expOpts:["Correcto: Sass, Less y Stylus son preprocesadores de CSS.","Falso: Postman sí permite validar servicios REST; es la herramienta estándar.","Falso: Node.js está construido sobre el motor V8 de JavaScript de Google.","Falso: Bootstrap es un framework CSS/HTML para diseño responsivo."]},
{id:40,year:2019,section:"Primera parte",anulada:false,q:"En Java, una clase declarada como 'abstract':",opts:["Puede no estar implementada o estarlo de manera incompleta.","Puede ser instanciada.","No puede ser extendida por subclases.","No existe el modificador abstract en Java."],answer:0,explanation:"Una clase abstracta en Java puede tener métodos abstractos (sin implementación) y métodos concretos. No puede instanciarse directamente.",expOpts:["Correcto: una clase abstracta puede tener implementación parcial o nula.","Falso: las clases abstractas NO pueden instanciarse directamente.","Falso: las clases abstractas están diseñadas precisamente para ser extendidas.","Falso: el modificador abstract sí existe en Java."]},
{id:41,year:2019,section:"Primera parte",anulada:false,q:"En la declaración de una clase en java, ¿mediante qué cláusula es posible definir un listado de uno o varios interfaces para la clase en cuestión?",opts:["Mediante la cláusula 'interfaces'.","Mediante la cláusula 'declares'.","Mediante la cláusula 'implements'.","En Java no es posible declarar una clase con más de un interface."],answer:2,explanation:"En Java, la cláusula 'implements' permite a una clase implementar una o varias interfaces. Es la forma de conseguir herencia múltiple en Java.",expOpts:["'interfaces' no es una cláusula válida en Java.","'declares' no es una cláusula válida en Java.","Correcto: 'implements' permite a una clase declarar que implementa interfaces.","Falso: en Java una clase puede implementar múltiples interfaces."]},
{id:42,year:2019,section:"Primera parte",anulada:false,q:"Teniendo una base de datos relacional, con una tabla \"Empleados\" con campos {Id, Nombre, Puesto, Salario,....}, indique cuál sería una forma válida de comenzar la creación de un Trigger en ANSI SQL, si lo que se quiere validar es un cambio de valor del campo \"Salario\":",opts:["CREATE TRIGGER Validar_salario BEFORE UPDATE OF Salario OF TABLE Empleados","CREATE NEW TRIGGER BEFORE UPDATE OF Salario ON Empleados","CREATE TRIGGER Validar_salario IN Empleados BEFORE UPDATE OF Salario","CREATE TRIGGER Validar_salario BEFORE UPDATE OF Salario ON Empleados"],answer:3,explanation:"Sintaxis ANSI SQL: CREATE TRIGGER nombre BEFORE|AFTER evento [OF columna] ON tabla. La preposición correcta es ON.",expOpts:["Falso: la preposición es ON, no OF TABLE.","Falso: no existe CREATE NEW TRIGGER en ANSI SQL.","Falso: la preposición correcta es ON, no IN.","Correcto: CREATE TRIGGER nombre BEFORE UPDATE OF Salario ON Empleados es la sintaxis ANSI SQL correcta."]},
{id:43,year:2019,section:"Primera parte",anulada:false,q:"Si utilizamos el gestor de base de datos Oracle (v.10g), ¿qué podríamos hacer si dentro de una transacción de la base de datos se quiere establecer un punto de recuperación?",opts:["Utilizar la sentencia SAVEPOINT y así definir un punto de salvaguarda dentro de una transacción.","Utilizar la sentencia ROLLBACK y así definir un punto de salvaguarda dentro de una transacción","Usar los comandos GRANT para dar permisos adecuados de administrador DBA sobre las tablas.","Utilizar la sentencia RECOVERPOINT y así definir un punto de salvaguarda dentro de una transacción."],answer:0,explanation:"SAVEPOINT permite establecer un punto de guardado dentro de una transacción. Permite hacer ROLLBACK TO nombre_savepoint sin cancelar toda la transacción.",expOpts:["Correcto: SAVEPOINT define puntos de salvaguarda dentro de una transacción.","Falso: ROLLBACK deshace la transacción entera o hasta un SAVEPOINT.","Falso: GRANT es para permisos (DCL).","Falso: RECOVERPOINT no es una instrucción SQL estándar."]},
{id:44,year:2019,section:"Primera parte",anulada:false,q:"Respecto a los patrones de diseño GoF (Gang of Four), indique cuál de las siguientes definiciones se corresponde con el patrón Decorator:",opts:["Proporciona el poder agregar una nueva funcionalidad a un objeto dinámicamente.","Proporciona una interfaz unificada para un conjunto de interfaces de un subsistema.","Proporciona un sustituto o representante de otro objeto para controlar el acceso a éste.","Proporciona un modo de acceder secuencialmente a los elementos de un objeto agregado sin exponer su representación interna."],answer:0,explanation:"El patrón Decorator permite añadir responsabilidades o funcionalidades a un objeto de manera dinámica.",expOpts:["Correcto: el Decorator añade funcionalidades a objetos de forma dinámica.","Eso describe el patrón Facade (Fachada).","Eso describe el patrón Proxy.","Eso describe el patrón Iterator (Iterador)."]},
{id:45,year:2019,section:"Primera parte",anulada:false,q:"Cuál de las siguientes afirmaciones NO se corresponde con el lenguaje UML:",opts:["Una clase se representa mediante un rectángulo con tres secciones, la superior contiene el identificador o nombre de la clase, la central contiene los atributos, y la inferior, las operaciones o métodos que tienen asociados.","Las asociaciones son los elementos que representan las relaciones que existen entre los elementos estructurales que se utilizan en los modelos.","Un tipo de asociación entre elementos estructurales es la dispersión.","La agregación es un tipo de asociación entre elementos estructurales que representa una clase que es parte de otra."],answer:2,explanation:"En UML existen: asociación simple, agregación, composición, dependencia, realización y generalización. 'Dispersión' no es un tipo de asociación UML.",expOpts:["Correcto: una clase UML tiene tres compartimentos.","Correcto: las asociaciones representan relaciones.","Correcto: 'dispersión' no es un tipo de asociación UML. Esta es la afirmación incorrecta.","Correcto: la agregación sí es un tipo de asociación UML."]},
{id:46,year:2019,section:"Primera parte",anulada:false,q:"En JAVA, siendo x=6 e y=3 (ambas variables de tipo int), la operación x^y da como resultado:",opts:["216","63","3","5"],answer:3,explanation:"En Java, ^ es XOR bit a bit, NO potenciación. 6 en binario=110, 3 en binario=011. XOR: 110 XOR 011 = 101 = 5 en decimal.",expOpts:["Falso: 216 sería 6^3 si ^ fuera potencia, pero en Java es XOR.","Falso: 63 no es el resultado correcto.","Falso: 3 no es el resultado del XOR.","Correcto: 6 XOR 3 = 110 XOR 011 = 101 = 5 en decimal."]},
{id:47,year:2019,section:"Primera parte",anulada:false,q:"En el entorno de programación .Net, indique que es un NuGet:",opts:["Una biblioteca de clases base.","Un administrador de paquetes.","Una implementación de .Net.","Un entorno de ejecución."],answer:1,explanation:"NuGet es el administrador de paquetes oficial para el ecosistema .NET. Permite instalar, actualizar y gestionar dependencias en proyectos .NET.",expOpts:["Las bibliotecas de clases base (BCL) son parte del framework .NET.","Correcto: NuGet es el gestor de paquetes de .NET, equivalente a npm o Maven.","Una implementación de .NET sería .NET Framework o .NET Core.","Un entorno de ejecución sería el CLR."]},
{id:48,year:2019,section:"Primera parte",anulada:false,q:"Indique cuál de las siguientes opciones corresponde a una API de Java para el procesamiento de documentos en formato XML.",opts:["JNA","StAX","JNI","JPaX"],answer:1,explanation:"StAX (Streaming API for XML) es una API de Java para procesar documentos XML mediante un modelo de cursor, eficiente en memoria para ficheros grandes.",expOpts:["JNA permite llamar a código nativo; no está relacionado con XML.","Correcto: StAX (Streaming API for XML) es una API Java para procesar XML.","JNI permite a Java interactuar con código nativo; no es de XML.","JPaX no es una API real de Java."]},
{id:49,year:2019,section:"Primera parte",anulada:false,q:"¿Cuál NO es una característica de los servicios REST?",opts:["Utiliza métodos del protocolo HTTP de forma explícita.","La solicitud no requiere que el servidor recupere información de estado de la aplicación.","Son admitidos los formatos XML y JSON para la transmisión o recepción de datos.","Usa la especificación UDDI para publicar y encontrar información sobre los servicios web expuestos."],answer:3,explanation:"UDDI es un estándar para registrar servicios web SOAP, no REST. Los servicios REST se documentan con OpenAPI/Swagger.",expOpts:["REST sí usa métodos HTTP (GET, POST, PUT, DELETE) de forma explícita.","REST es stateless: el servidor no almacena el estado del cliente entre peticiones.","REST admite múltiples formatos (JSON, XML, etc.).","Correcto: UDDI es para servicios SOAP, no para REST."]},
{id:50,year:2019,section:"Primera parte",anulada:false,q:"Indique, de entre las siguientes afirmaciones, cuál es relativa a Ruby on Rails (RoR):",opts:["Es un lenguaje de programación creado por G. Ruby.","Es un framework de control de versiones escrito en el lenguaje Ruby.","Es un framework de desarrollo de aplicaciones web basado en el patrón MVC.","Es un servicio de .NET."],answer:2,explanation:"Ruby on Rails (Rails) es un framework de desarrollo web escrito en Ruby, que sigue el patrón MVC y el principio de 'convención sobre configuración'.",expOpts:["Falso: Ruby es el lenguaje; Rails es el framework.","Falso: no es un sistema de control de versiones.","Correcto: Ruby on Rails es un framework web MVC escrito en Ruby.","Falso: no tiene relación con .NET."]},
{id:51,year:2019,section:"Primera parte",anulada:false,q:"En una sentencia \"if\" en el lenguaje de programación Python, ¿cómo se identifica el bloque de código a ejecutar si la condición se cumple?",opts:["El bloque debe estar delimitado por llaves {}","El bloque debe estar delimitado por corchetes []","El bloque debe estar delimitado por corchetes ()","Cada línea del bloque debe estar precedida por el mismo número de espacios en blanco, con la misma sangría."],answer:3,explanation:"Python usa la indentación (sangría) para delimitar bloques de código. No usa llaves {} como Java o C.",expOpts:["Falso: Python no usa llaves {} para delimitar bloques.","Falso: los corchetes [] son para listas en Python.","Falso: los paréntesis () son para llamadas a funciones.","Correcto: en Python, la indentación (sangría consistente) define los bloques de código."]},
{id:52,year:2019,section:"Primera parte",anulada:false,q:"En el lenguaje XML, ¿cuál de las siguientes sentencias sería correcta para añadir comentarios?",opts:["<-- Aquí va el comentario /-->","< Aquí va el comentario !>","<!-- Aquí va el comentario -->","<--! Aquí va el comentario -->"],answer:2,explanation:"La sintaxis de comentarios en XML (y HTML) es <!-- comentario -->. El comentario comienza con <!-- y termina con -->.",expOpts:["Falso: la apertura sería <!-- no <--.","Falso: esta sintaxis no es válida en XML.","Correcto: <!-- comentario --> es la sintaxis válida para comentarios en XML.","Falso: el orden correcto es <!-- no <--!."]},
{id:53,year:2019,section:"Primera parte",anulada:false,q:"En relación con el Real Decreto 1112/2018, sobre accesibilidad de los sitios web y aplicaciones para dispositivos móviles del sector público, indique qué respuesta es INCORRECTA:",opts:["Las entidades obligadas deberán ofrecer un mecanismo de comunicación para presentar sugerencias y quejas.","La primera revisión de accesibilidad deberá haberse realizado en el caso de los sitios web antes de dos años desde la entrada en vigor de este real decreto.","La primera revisión de accesibilidad deberá haberse realizado en el caso de las aplicaciones móviles, antes de dos años desde la entrada en vigor de este real decreto.","La entidad obligada deberá responder a la persona interesada sobre las solicitudes de información accesible y quejas, en el plazo de veinte días hábiles."],answer:2,explanation:"El RD 1112/2018 establece plazos distintos: sitios web debían cumplir en 2 años, pero para apps móviles el plazo fue de 3 años. La opción c dice incorrectamente que también es 2 años.",expOpts:["Correcto: las entidades deben ofrecer mecanismo de comunicación. No es la INCORRECTA.","Correcto: 2 años para sitios web. No es la INCORRECTA.","INCORRECTA: para apps móviles el plazo fue de 3 años, no 2 años.","Correcto: el plazo de respuesta es de 20 días hábiles. No es la INCORRECTA."]},
{id:54,year:2019,section:"Primera parte",anulada:false,q:"Según las Pautas de Accesibilidad para el Contenido Web (WCAG) 2.1, ¿cuál es el objetivo de que un contenido sea Distinguible?",opts:["Crear contenido que pueda presentarse de diferentes formas (por ejemplo, con una disposición más simple) sin perder información o estructura.","Facilitar a los usuarios ver y oír el contenido, incluyendo la separación entre el primer plano y el fondo.","Proporcionar alternativas textuales para todo contenido no textual de modo que se pueda convertir a otros formatos que las personas necesiten, tales como textos ampliados, braille, voz, símbolos o en un lenguaje más simple.","Proporcionar alternativas para los medios tempodependientes."],answer:1,explanation:"El principio 'Distinguible' de las WCAG facilita que los usuarios vean y escuchen el contenido, separando el primer plano del fondo. Incluye contraste de color y control del audio.",expOpts:["Eso describe el principio 'Adaptable'.","Correcto: 'Distinguible' facilita ver y oír el contenido con adecuada separación fondo/primer plano.","Eso describe el criterio 1.1.1 (Contenido no textual) del principio Perceptible.","Eso describe los criterios de medios tempodependientes."]},
{id:55,year:2019,section:"Primera parte",anulada:false,q:"Según Métrica v3, ¿qué tipo de pruebas consiste en determinar que los tiempos de respuesta están dentro de los intervalos establecidos en las especificaciones del sistema?",opts:["Pruebas de respuesta.","Pruebas de sobrecarga.","Pruebas de rendimiento.","Pruebas de tiempo."],answer:2,explanation:"Las pruebas de rendimiento verifican que el sistema responde dentro de los tiempos especificados bajo condiciones de carga normales.",expOpts:["'Pruebas de respuesta' no es categoría estándar en Métrica v3.","Las pruebas de sobrecarga evalúan el comportamiento bajo carga extrema.","Correcto: las pruebas de rendimiento verifican que los tiempos están dentro de los parámetros.","'Pruebas de tiempo' no es la terminología de Métrica v3."]},
{id:56,year:2019,section:"Primera parte",anulada:false,q:"En el software para control de versiones GIT, hacer un 'commit' es:",opts:["La acción de introducir comentarios iterativos entre versiones.","La acción de establecer un compromiso de uso (commitment) entre ambas partes.","La acción de descargar la rama de trabajo del repositorio central.","La acción de almacenar una nueva instantánea (snapshot) del estado del proyecto en el historial de GIT."],answer:3,explanation:"Un commit en Git crea una instantánea del estado actual del proyecto y la añade al historial del repositorio.",expOpts:["Falso: los comentarios se añaden como mensaje del commit pero no es solo eso.","Falso: esa es la acepción en inglés de 'commitment', no el término técnico de Git.","Falso: descargar el repositorio se hace con git pull o git fetch.","Correcto: un commit es una instantánea del estado del proyecto en un momento dado."]},
{id:57,year:2019,section:"Primera parte",anulada:false,q:"Señale cuál de las siguientes herramientas de software libre se utiliza para realizar pruebas de carga y de estrés, permitiendo simular escenarios de concurrencia de usuarios:",opts:["Cactus","Mockito","JMeter","Foglight"],answer:2,explanation:"Apache JMeter es la herramienta de código abierto estándar para pruebas de carga, estrés y rendimiento. Simula múltiples usuarios concurrentes.",expOpts:["Cactus es un framework de pruebas para componentes Java EE, no de carga.","Mockito es un framework de mocking para pruebas unitarias.","Correcto: Apache JMeter es la herramienta para pruebas de carga y estrés.","Foglight es una herramienta de monitorización, no de pruebas de carga."]},
{id:58,year:2019,section:"Primera parte",anulada:false,q:"En Linux, ¿cuál de las siguientes opciones utilizaría para conocer qué puertos tiene abiertos un servidor?",opts:["ntpq","ntport","nmap","traceroute"],answer:2,explanation:"Nmap (Network Mapper) es la herramienta estándar para escanear puertos y descubrir qué servicios están activos en un sistema.",expOpts:["ntpq consulta el estado del protocolo NTP (sincronización horaria).","ntport no es una herramienta reconocida.","Correcto: nmap (Network Mapper) escanea puertos abiertos en un sistema.","traceroute muestra la ruta que siguen los paquetes IP, no los puertos abiertos."]},
{id:59,year:2019,section:"Primera parte",anulada:false,q:"En sistemas Debian, ¿cuál de los siguientes comandos permitiría descargar la información de los paquetes desde todas las fuentes configuradas?",opts:["apt update","apt upgrade","apt full-upgrade","apt list"],answer:0,explanation:"apt update descarga la lista actualizada de paquetes disponibles desde los repositorios. No instala ni actualiza paquetes.",expOpts:["Correcto: apt update actualiza la lista de paquetes disponibles desde los repositorios.","apt upgrade instala las versiones más nuevas de los paquetes instalados.","apt full-upgrade también puede eliminar paquetes si es necesario.","apt list muestra una lista de paquetes, no descarga información."]},
{id:60,year:2019,section:"Primera parte",anulada:false,q:"En el contexto de la administración del almacenamiento, ¿qué es el “Thin Provisioning”?",opts:["Es un mecanismo de despliegue de discos en red para clientes ligeros.","Es método de virtualización de almacenamiento que permite que el espacio se asigne de forma justa y puntual.","Es una tecnología que permite agregar discos físicos en caliente a las cabinas de la SAN de forma ligera.","Es un método por el que se asigna todo el espacio virtualizado disponible y se va a reduciendo (shrinking) a medida que el cliente lo descarta."],answer:1,explanation:"Thin Provisioning (aprovisionamiento ligero) asigna espacio de almacenamiento solo cuando realmente se necesita, en lugar de reservar todo desde el principio.",expOpts:["Falso: no tiene relación con clientes ligeros.","Correcto: Thin Provisioning asigna espacio bajo demanda, de forma justa y puntual.","Falso: agregar discos en caliente es 'hot-swapping'.","Falso: eso describe el proceso contrario (Thick Provisioning)."]},
{id:61,year:2019,section:"Primera parte",anulada:false,q:"En relación a los sistemas RAID, indique qué configuración permite acceso independiente con paridad distribuida:",opts:["RAID 1","RAID 3","RAID 4","RAID 5"],answer:3,explanation:"RAID 5 distribuye los datos y la paridad entre todos los discos del array, permitiendo acceso independiente a cada disco.",expOpts:["RAID 1 es espejado (mirroring): copia exacta sin paridad.","RAID 3 usa paridad en un disco dedicado con striping a nivel de byte.","RAID 4 usa un disco de paridad dedicado; la paridad no está distribuida.","Correcto: RAID 5 distribuye tanto los datos como la paridad entre todos los discos."]},
{id:62,year:2019,section:"Primera parte",anulada:false,q:"Considerando que tanto en el punto de origen como en el punto de destino disponemos de un ordenador de usuario con un cliente de correo electrónico instalado y un servidor de correo electrónico, ¿qué papel juegan los protocolos SMTP, POP3 e IMAP durante el envío de uno de estos correos electrónicos?",opts:["SMTP se usa desde el ordenador del usuario de origen al servidor de correo electrónico en el origen. POP3 o IMAP se usan entre el servidor de correo en el origen y el servidor de correo en el destino. SMTP se usa de nuevo entre el servidor de correo de destino y el destinatario, para enviarle el mensaje cuando se conecte.","POP3 se usa desde el ordenador del usuario de origen al servidor de correo electrónico en el origen. IMAP se usa entre el servidor de correo en el origen y el servidor de correo en el destino. SMTP se usa entre el servidor de correo de destino y el destinatario, para enviarle el mensaje cuando se conecte.","SMTP se usa desde el ordenador del usuario de origen al servidor de correo electrónico en el origen, así como desde el servidor de origen al servidor de destino. POP3 o IMAP se usan desde el servidor de correo en el destino hasta el ordenador del destinatario, para enviarle el mensaje cuando se conecte.","POP3 o IMAP se usan desde el ordenador del usuario de origen al servidor de correo electrónico en el origen, así como desde el servidor de origen al servidor de destino. SMTP se usa desde el servidor de correo en el destino hasta el ordenador del destinatario, para enviarle el mensaje cuando se conecte."],answer:2,explanation:"SMTP es el protocolo de envío. POP3/IMAP son de recepción: el destinatario los usa para descargar o acceder a sus mensajes desde el servidor.",expOpts:["Falso: POP3/IMAP no se usan entre servidores; la comunicación inter-servidor es siempre SMTP.","Falso: POP3 no se usa para enviar correo.","Correcto: SMTP para envío (cliente→origen, origen→destino). POP3/IMAP para recepción (destino→cliente).","Falso: POP3/IMAP son solo protocolos de recepción."]},
{id:63,year:2019,section:"Primera parte",anulada:false,q:"En las arquitecturas de microservicios las funcionalidades se implementan mediante la composición de distintos microservicios. Existen dos estrategias para gestionar esta composición, que son:",opts:["Coreografía y orquestación.","Coreografía y coordinación.","Coordinación y orquestación.","Gestión y orquestación."],answer:0,explanation:"Orquestación: un controlador central coordina las interacciones. Coreografía: cada servicio reacciona a eventos de otros sin coordinador central.",expOpts:["Correcto: Coreografía (descentralizada) y Orquestación (centralizada).","Falso: 'coordinación' no es una de las dos estrategias estándar.","Falso: las dos estrategias son coreografía y orquestación.","Falso: 'gestión' no es una de las dos estrategias estándar."]},
{id:64,year:2019,section:"Primera parte",anulada:false,q:"¿Qué comando se debe ejecutar para mostrar un listado de los servicios en ejecución en un ordenador con sistema operativo Windows 10?",opts:["Net view services","Net start process","Net start","Net start all"],answer:2,explanation:"El comando 'net start' en Windows muestra la lista de servicios que están actualmente en ejecución.",expOpts:["Falso: 'net view services' no es un comando válido.","Falso: 'net start process' no es un comando válido.","Correcto: 'net start' sin argumentos muestra la lista de servicios activos en Windows.","Falso: 'net start all' no es un comando válido."]},
{id:65,year:2019,section:"Primera parte",anulada:false,q:"¿Cuál es la última versión del protocolo de administración de red SNMP?",opts:["SNMP v2","SNMP v3","SNMP v4","SNMP v5"],answer:1,explanation:"SNMP v3 es la versión más reciente del protocolo SNMP, estandarizado en 2002. Añade autenticación y cifrado.",expOpts:["SNMP v2 existe pero no es la última versión.","Correcto: SNMP v3 es la versión más reciente, con autenticación y privacidad.","SNMP v4 no existe.","SNMP v5 no existe."]},
{id:66,year:2019,section:"Primera parte",anulada:false,q:"¿Indique la afirmación FALSA con respecto al proceso de firma digital?",opts:["La aplicación o dispositivo digital utilizados para la firma digital crea un resumen del documento a firmar utilizando una función hash.","La aplicación cifra el documento a firmar asegurando la confidencialidad.","La aplicación cifra el resumen del documento a firmar obteniendo a su vez otro documento electrónico que corresponde con la firma electrónica.","Para cifrar el resumen, la aplicación utiliza la clave privada."],answer:1,explanation:"La firma digital cifra el RESUMEN (hash) del documento, NO el documento completo. El cifrado del documento para confidencialidad es una operación diferente e independiente.",expOpts:["Correcto: la función hash genera el resumen. No es la falsa.","FALSA: en la firma digital se cifra el hash, no el documento completo.","Correcto: la firma electrónica es el hash cifrado con la clave privada. No es la falsa.","Correcto: se usa la clave privada para cifrar el hash. No es la falsa."]},
{id:67,year:2019,section:"Primera parte",anulada:false,q:"Indique cuál de las siguientes opciones se corresponde con el concepto de ITIL:",opts:["Su origen proviene de la metodología Kaizen y ofrece a las organizaciones un instrumento útil para la sistematización de las actividades que dan soporte al ciclo de vida del software.","Es una librería java, referida a la seguridad, que forma parte de la plataforma de Jakarta EE.","Es una colección de mejores prácticas de gestión de servicios de tecnologías de la información.","Es una metodología de análisis y gestión de riesgos de los sistemas de información."],answer:2,explanation:"ITIL (Information Technology Infrastructure Library) es un conjunto de mejores prácticas para la gestión de servicios de TI, que alinea los servicios TI con las necesidades del negocio.",expOpts:["Falso: ITIL no proviene de Kaizen; son marcos distintos.","Falso: ITIL no es una librería Java.","Correcto: ITIL es una biblioteca de mejores prácticas para la gestión de servicios TI.","Falso: la metodología de análisis y gestión de riesgos sería MAGERIT u otras como ISO 27005."]},
{id:68,year:2019,section:"Primera parte",anulada:false,q:"¿Cuál es la última versión estable del protocolo TLS?",opts:["TLS 1.2","TLS 1.3","TLS 1.4","SSL 3.0"],answer:1,explanation:"TLS 1.3 fue estandarizado en agosto de 2018 (RFC 8446) y es la versión más reciente. SSL 3.0 está completamente obsoleto.",expOpts:["TLS 1.2 existe y es ampliamente usado, pero no es la última versión.","Correcto: TLS 1.3 (RFC 8446, 2018) es la versión más reciente y recomendada.","TLS 1.4 no existe.","SSL 3.0 es obsoleto y tiene vulnerabilidades conocidas."]},
{id:69,year:2019,section:"Primera parte",anulada:false,q:"Señale cuál de los siguientes NO es un algoritmo asimétrico:",opts:["RSA","GOST","ECDSA","ElGamal"],answer:1,explanation:"GOST es un estándar ruso que incluye algoritmos simétricos de cifrado y de hash. RSA, ECDSA y ElGamal son algoritmos de criptografía asimétrica.",expOpts:["RSA es un algoritmo asimétrico ampliamente usado.","Correcto: GOST incluye algoritmos simétricos y de hash; no es específicamente asimétrico.","ECDSA es un algoritmo de firma asimétrico.","ElGamal es un algoritmo de cifrado asimétrico."]},
{id:70,year:2019,section:"Primera parte",anulada:false,q:"Sobre redes inalámbricas, indique cuál de las siguientes afirmaciones es INCORRECTA:",opts:["La frecuencia de 2,4 GHz presenta interferencias con algunas versiones de Bluetooth.","La seguridad del protocolo WEP es superior a la del protocolo WPA2.","El protocolo WPA3 surge, entre otros, a raiz del ataque KRACK, mejorando la modalidad de cifrado WPA2-PSK (AES).","La frecuencia de 5 GHz tiene menor alcance que la de 2,4 GHz."],answer:1,explanation:"WEP es extremadamente inseguro y se rompe en segundos. WPA2 es muy superior en seguridad. Afirmar que WEP es superior es completamente falso.",expOpts:["Correcto: 2,4 GHz tiene interferencias con Bluetooth. No es la incorrecta.","INCORRECTA: WEP es mucho menos seguro que WPA2. WEP tiene vulnerabilidades graves conocidas.","Correcto: WPA3 surgió como respuesta al ataque KRACK. No es la incorrecta.","Correcto: 5 GHz tiene menor alcance pero mayor velocidad. No es la incorrecta."]},
