{id:99,year:2024,section:"Supuesto I",anulada:false,q:"¿Qué nivel de aislamiento configuraría para que no se produzcan lecturas sucias ni lecturas no repetibles, pero sí lecturas fantasmas?",opts:["Serializable.","Read committed.","Read uncommitted.","Repeatable read."],answer:3,explanation:"Niveles de aislamiento: Read Uncommitted (permite sucias), Read Committed (evita sucias), Repeatable Read (evita sucias y no repetibles, pero permite fantasmas), Serializable (evita todo).",expOpts:["Serializable: evita sucias, no repetibles Y fantasmas. Demasiado restrictivo.","Read Committed: evita lecturas sucias, pero permite no repetibles y fantasmas.","Read Uncommitted: el nivel más bajo; permite todos los problemas.","Correcto: Repeatable Read evita sucias y no repetibles, pero permite fantasmas."]},
{id:100,year:2024,section:"Supuesto I",anulada:false,q:"Se integra con GEISER, cuyos servicios web son SOAP. ¿Con qué firmará las peticiones?",opts:["WS-Security.","SAML.","JWT.","XML-Encryption."],answer:0,explanation:"WS-Security es el estándar para añadir seguridad a mensajes SOAP. SAML federa identidades. JWT es para APIs REST. XML-Encryption cifra XML pero WS-Security es el estándar completo.",expOpts:["Correcto: WS-Security es el estándar para firmar y cifrar mensajes SOAP.","SAML es un estándar de federación de identidades (SSO), no para firmar SOAP.","JWT se usa en APIs REST, no en servicios SOAP.","XML-Encryption cifra partes de un XML, pero WS-Security es el estándar completo."]},
{id:101,year:2024,section:"Supuesto I",anulada:false,q:"Se quiere usar la librería iText de .NET para generar un PDF. ¿Con qué comando instalaría el paquete NuGet?",opts:["dotnet add package iText.","dotnet install package iText.","dotnet add iText.","dotnet install iText."],answer:0,explanation:"En .NET, los paquetes NuGet se instalan con 'dotnet add package NombrePaquete'.",expOpts:["Correcto: 'dotnet add package iText' es la sintaxis correcta.","'dotnet install package' no es un comando válido de la CLI de .NET.","'dotnet add iText' sin la palabra 'package' no es sintaxis válida.","'dotnet install iText' no es un comando válido de la CLI de .NET."]},
{id:102,year:2024,section:"Supuesto I",anulada:false,q:"Según Métrica v3, para optimizar el modelo físico reduciendo el número de accesos a la BD, ¿qué acción se aplicaría?",opts:["Combinar entidades si los accesos son frecuentes en transacciones distintas.","Eliminar entidades.","Introducir elementos redundantes.","Normalizar las tablas en Forma Normal de Boyce-Codd (FNBC)."],answer:2,explanation:"Métrica v3 contempla la desnormalización: introducir redundancia controlada para reducir el número de accesos (joins). Es una técnica de optimización física.",expOpts:["Combinar entidades reduce accesos cuando son frecuentes en la misma transacción, no en distintas.","Eliminar entidades no es una técnica de optimización de accesos.","Correcto: introducir redundancia (desnormalizar) reduce el número de accesos al evitar joins.","Normalizar mejora integridad pero generalmente aumenta el número de accesos."]},
{id:103,year:2024,section:"Supuesto I",anulada:false,q:"En SCRUM, si durante un sprint detecta una mala práctica, ¿en qué reunión la comentaría para buscar mejora continua?",opts:["En la Daily Scrum.","En la Sprint Retrospective.","En la Sprint Planning.","En la Sprint Review."],answer:1,explanation:"La Sprint Retrospective es la reunión al final del sprint donde el equipo reflexiona sobre el proceso: qué fue bien, qué fue mal y cómo mejorar.",expOpts:["La Daily Scrum es la reunión diaria de 15 minutos para sincronizar el trabajo del día.","Correcto: la Sprint Retrospective es la reunión de mejora continua del proceso de trabajo.","La Sprint Planning es la reunión de planificación al inicio del sprint.","La Sprint Review muestra el incremento al cliente; no es sobre procesos internos."]},
{id:104,year:2024,section:"Supuesto I",anulada:false,q:"El sistema se integrará con la PID (arquitectura SOA). ¿Cuáles son los componentes principales de SOA?",opts:["Servicio, Proveedor, Consumidor y Orquestador de servicios.","Servicio, Proveedor, Consumidor y Depurador de servicios.","Servicio, Proveedor, Consumidor y Comparador de servicios.","Servicio, Proveedor, Consumidor y Registro de servicios."],answer:3,explanation:"En SOA los componentes son: Servicio, Proveedor (quien lo publica), Consumidor (quien lo usa) y Registro de servicios (directorio donde se publican y descubren).",expOpts:["Un orquestador es un componente de un ESB, no básico de SOA.","Un 'depurador de servicios' no es un componente de SOA.","Un 'comparador de servicios' no es un componente de SOA.","Correcto: Servicio, Proveedor, Consumidor y Registro son los componentes básicos de SOA."]},
{id:105,year:2024,section:"Supuesto I",anulada:false,q:"Se ha decidido usar .NET con C# para el backend. ¿Cómo puede indicar la opcionalidad de un tipo de dato?",opts:["int? Telefono","int|null Telefono","int:null Telefono","int ?? Telefono"],answer:0,explanation:"En C#, para hacer un tipo de valor nullable se añade '?' después del tipo: int? significa 'int que puede ser null'.",expOpts:["Correcto: int? es la sintaxis de C# para declarar un tipo de valor nullable.","int|null es sintaxis de TypeScript, no de C#.","int:null no es sintaxis válida en C#.","?? es el operador de fusión de nulos (null coalescing), no para declarar tipos."]},
{id:106,year:2024,section:"Reserva SI",anulada:false,q:"Se usará el selector CSS 'input:required'. ¿Cuál es su especificidad?",opts:["1-1-0.","0-1-1.","1-0-1.","1-0-0."],answer:1,explanation:"La especificidad CSS se calcula como (ID, clases/pseudoclases, elementos). 'input' aporta 0-0-1 (elemento) y ':required' aporta 0-1-0 (pseudoclase). Total: 0-1-1.",expOpts:["1-1-0 correspondería a un selector de ID más una clase, sin elemento.","Correcto: 'input' da 0-0-1 y ':required' da 0-1-0. Total: 0-1-1.","1-0-1 correspondería a un selector de ID más un elemento.","1-0-0 correspondería solo a un selector de ID."]},
{id:107,year:2024,section:"Reserva SI",anulada:false,q:"¿Qué atributo ARIA utilizaría para indicar que un elemento se actualizará?",opts:["aria-live.","aria-checked.","aria-flowto.","aria-valuenow."],answer:0,explanation:"aria-live indica a los lectores de pantalla que el contenido puede actualizarse dinámicamente y cómo deben anunciarse esos cambios.",expOpts:["Correcto: aria-live indica que la región puede actualizarse y cómo anunciar los cambios.","aria-checked indica el estado de selección de un elemento (checkbox), no si se actualiza.","aria-flowto define el orden de lectura alternativo.","aria-valuenow indica el valor actual de un control deslizante."]},
{id:108,year:2024,section:"Reserva SI",anulada:false,q:"¿Cómo obtendría los ficheros adjuntos que no son PDF de la solicitud del interesado con DNI 00000000T para 2024?",opts:["SELECT * FROM FicheroAdjunto WHERE Denominacion LIKE '%.pdf' AND IdSolicitudBeca = (SELECT IdSolicitudBeca FROM SolicitudBeca WHERE AñoConvocatoria = 2024 AND IdInteresado = (SELECT IdInteresado WHERE DocumentoIdentidad = '00000000T'));","SELECT * FROM FicheroAdjunto WHERE Denominacion NOT LIKE '%.pdf' AND IdSolicitudBeca = (SELECT IdSolicitudBeca FROM SolicitudBeca WHERE AñoConvocatoria = 2024 AND IdInteresado = (SELECT IdInteresado FROM Interesado));","SELECT * FROM FicheroAdjunto WHERE Denominacion NOT LIKE '%.pdf' AND IdSolicitudBeca = (SELECT IdSolicitudBeca FROM SolicitudBeca WHERE AñoConvocatoria = 2024 AND IdInteresado = (SELECT IdInteresado FROM Interesado WHERE DocumentoIdentidad = '00000000T'))","SELECT * FROM FicheroAdjunto WHERE Denominacion NOT LIKE 'pdf' AND IdSolicitudBeca = (SELECT IdSolicitudBeca FROM SolicitudBeca WHERE AñoConvocatoria = 2024 AND IdInteresado = (SELECT IdInteresado FROM Interesado WHERE DocumentoIdentidad = '00000000T'));"],answer:2,explanation:"Para ficheros que NO son PDF: NOT LIKE '%.pdf'. La subconsulta debe incluir la tabla Interesado con su condición WHERE completa.",expOpts:["Usa LIKE en lugar de NOT LIKE; devolvería los PDF, no los que no lo son.","Falta la condición WHERE DocumentoIdentidad en la subconsulta de Interesado.","Correcto: NOT LIKE '%.pdf' y subconsultas bien encadenadas con todas las condiciones.","NOT LIKE 'pdf' sin el comodín % y el punto no capturaría correctamente la extensión .pdf."]},
{id:109,year:2024,section:"Reserva SI",anulada:false,q:"¿Qué configurar en el backend para restringir que solo las peticiones del frontend sean aceptadas en origen cruzado?",opts:["HSTS.","CSP.","TLS.","CORS."],answer:3,explanation:"CORS (Cross-Origin Resource Sharing) controla qué orígenes externos pueden hacer peticiones al servidor desde scripts del navegador.",expOpts:["HSTS fuerza el uso de HTTPS, no controla orígenes cruzados.","CSP controla qué recursos puede cargar el navegador, no el origen de peticiones al backend.","TLS es el protocolo de cifrado de transporte. No controla orígenes cruzados.","Correcto: CORS controla qué orígenes pueden hacer peticiones HTTP al backend."]},
{id:110,year:2024,section:"Reserva SI",anulada:false,q:"¿En qué fichero del repositorio incluiría el propósito del proyecto y cómo arrancarlo localmente?",opts:["CODEOWNERS.","README.MD.","LICENSE.","CITATION."],answer:1,explanation:"El fichero README.md es el documento estándar en repositorios para explicar el propósito, instalación y uso del proyecto.",expOpts:["CODEOWNERS define quién revisa cambios en partes del código.","Correcto: README.md es el fichero estándar de documentación introductoria.","LICENSE contiene la licencia de uso del código.","CITATION define cómo citar el proyecto académicamente."]},
{id:111,year:2024,section:"Supuesto II",anulada:false,q:"¿Cuántas direcciones hay disponibles para hosts en la subred del organismo?",opts:["4094","65534","4096","65536"],answer:0,explanation:"Con máscara /20: 4096 direcciones totales - 2 (red y broadcast) = 4094 hosts.",expOpts:["Correcto: con /20 hay 4096 - 2 = 4094 hosts disponibles.","65534 corresponde a una máscara /16 (65536 - 2).","4096 es el total de direcciones con /20, sin restar red y broadcast.","65536 es el total de direcciones con /16, sin restar nada."]},
{id:112,year:2024,section:"Supuesto II",anulada:false,q:"Al arrancar el servidor aparecen errores en la partición sda8. ¿Qué comando repara automáticamente los errores?",opts:["mount -T /dev/sda8","fsck -y /dev/sda8","fsck -m /dev/sda8","checkdisk /dev/sda8"],answer:1,explanation:"fsck (File System Check) verifica y repara sistemas de ficheros en Linux. La opción -y responde 'sí' automáticamente a las preguntas de reparación.",expOpts:["mount -T no es válido para reparar; mount monta sistemas de ficheros.","Correcto: fsck -y /dev/sda8 verifica y repara automáticamente el sistema de ficheros.","fsck -m evitaría ejecutarse si el sistema está montado; no sirve con respuesta automática.","checkdisk es un comando de Windows (chkdsk), no de Linux."]},
{id:113,year:2024,section:"Supuesto II",anulada:false,q:"Respecto a si abrir el puerto 80 en un servidor HTTPS, el CCN recomienda:",opts:["Exhibir una web estática en el puerto 80 indicando que esa no es la web actual.","Cambiar el puerto HTTPS al 8892.","Utilizar un analizador de peticiones en las cabeceras HTTP en el puerto 80.","Disponer del puerto TCP/80, configurando el servidor web para redirigir automáticamente de HTTP a HTTPS."],answer:3,explanation:"La recomendación del CCN es tener el puerto 80 activo pero con redirección automática de HTTP a HTTPS.",expOpts:["Mostrar una web estática no es la recomendación del CCN.","Cambiar el puerto HTTPS estándar es mala práctica.","Analizar cabeceras no es la recomendación para este caso.","Correcto: el CCN recomienda el 80 activo con redirección automática a HTTPS."]},
{id:114,year:2024,section:"Supuesto II",anulada:false,q:"Alguien no autorizado entró al CPD esperando a que alguien autorizado abriera la puerta para colarse detrás. Este incidente de ingeniería social se conoce como:",opts:["Tailgating o piggybacking.","Quid pro quo.","Pretexto.","Disrupción."],answer:0,explanation:"Tailgating (o piggybacking) es colarse en una zona restringida aprovechando que alguien autorizado abre la puerta.",expOpts:["Correcto: tailgating/piggybacking es colarse detrás de alguien autorizado.","Quid pro quo: se ofrece algo a cambio de información o acceso.","Pretexto: el atacante fabrica una historia falsa; no es físico.","Disrupción no es un término estándar de ingeniería social."]},
{id:115,year:2024,section:"Supuesto II",anulada:false,q:"El CPD tiene un CCTV con red coaxial que hay que interconectar a la red Ethernet. ¿Con qué dispositivo?",opts:["Un cortafuegos (firewall).","Una pasarela (gateway).","Un conmutador (switch).","Un repetidor (repeater)."],answer:1,explanation:"Una pasarela (gateway) interconecta redes con tecnologías o protocolos diferentes, como coaxial y Ethernet.",expOpts:["Un firewall filtra el tráfico por reglas de seguridad; no interconecta tecnologías distintas.","Correcto: una pasarela interconecta redes con tecnologías o protocolos diferentes.","Un switch conecta dispositivos dentro de la misma tecnología de red.","Un repetidor amplifica la señal en la misma red; no interconecta tecnologías distintas."]},
{id:116,year:2024,section:"Supuesto II",anulada:false,q:"Se usan DNS y FTP seguro. Según el modelo TCP/IP, se diferencian en que:",opts:["DNS es un protocolo de usuario y FTP es un protocolo de soporte.","DNS es siempre orientado a la conexión mientras que FTP no.","No existe diferencia, ambos son protocolos de soporte.","FTP es un protocolo de usuario y DNS es un protocolo de soporte."],answer:3,explanation:"En el modelo TCP/IP, FTP es protocolo de usuario (usado directamente por usuarios) y DNS es protocolo de soporte (da soporte a los servicios).",expOpts:["Falso: es al revés; DNS es de soporte y FTP es de usuario.","Falso: DNS puede usar UDP o TCP según la operación. No es siempre orientado a conexión.","Falso: sí existe diferencia; FTP es de usuario y DNS es de soporte.","Correcto: FTP es protocolo de usuario y DNS es protocolo de soporte."]},
{id:117,year:2024,section:"Supuesto II",anulada:false,q:"En un switch Cisco se ejecuta 'switchport access vlan 1'. ¿Qué permite?",opts:["Asignar un puerto a la VLAN 1.","Asignar el puerto 1 del switch a la VLAN donde estamos en la consola.","Visualizar todos los hosts asignados a la VLAN 1.","Asignar todos los hosts conectados a cualquier puerto del switch a la VLAN 1."],answer:0,explanation:"El comando 'switchport access vlan 1' asigna el puerto actualmente configurado a la VLAN 1 en modo acceso.",expOpts:["Correcto: asigna el puerto actualmente configurado a la VLAN 1 en modo acceso.","Falso: el '1' de la VLAN no se refiere al número de puerto físico.","Falso: para ver hosts se usaría 'show mac address-table vlan 1'.","Falso: el comando solo afecta al puerto en el que se está configurando."]},
{id:118,year:2024,section:"Supuesto II",anulada:false,q:"La BD se ha corrompido y los usuarios no pueden acceder. Se sabe cómo ocurrió y quién lo causó. ¿A qué dimensiones de seguridad afecta?",opts:["A la disponibilidad porque no está accesible la BD y la integridad porque el fichero está corrupto.","A la confidencialidad porque los datos dañados pueden ser accesibles por cualquiera.","Sólo a la disponibilidad porque la BD está temporalmente fuera de servicio.","A la trazabilidad, porque no podremos averiguar lo que ha pasado."],answer:0,explanation:"Las dimensiones afectadas son: Disponibilidad (usuarios no pueden acceder) e Integridad (datos corruptos). La trazabilidad no se ve afectada porque se sabe quién lo causó.",expOpts:["Correcto: disponibilidad (no accesible) e integridad (datos corruptos) son las dimensiones afectadas.","Falso: la corrupción no implica acceso no autorizado. Confidencialidad no afectada.","Falso: la integridad también está afectada porque los datos están corruptos.","Falso: la trazabilidad no está afectada; se sabe exactamente quién lo causó."]},
{id:119,year:2024,section:"Supuesto II",anulada:false,q:"La red es Gigabit Ethernet y al conectar un dispositivo parpadea una luz naranja en la tarjeta. ¿A qué puede deberse?",opts:["A que está mal configurada la VLAN.","A que la tarjeta transmite a menor velocidad de la que permite la red.","A que la tarjeta está estropeada y no hay conexión.","A que el cable del dispositivo es coaxial y no Ethernet."],answer:1,explanation:"En adaptadores Ethernet, el LED naranja indica conexión a velocidad inferior a la máxima. Si la red es Gigabit pero la tarjeta es Fast Ethernet (100 Mbps), el LED naranja indica esa diferencia.",expOpts:["La configuración de VLAN no afecta al color del LED de velocidad.","Correcto: el LED naranja indica conexión a velocidad reducida.","Si la tarjeta estuviera estropeada, no habría LED o habría error diferente.","Un cable coaxial no conectaría con un puerto Ethernet RJ-45."]},
{id:120,year:2024,section:"Supuesto II",anulada:false,q:"¿Con qué comando se puede saber qué versión del kernel tiene Ubuntu?",opts:["sudo dpkg -i linux*.deb","uname -r","uname -o","kexec -l"],answer:1,explanation:"El comando 'uname -r' muestra la versión del kernel en Linux (por ejemplo, 6.5.0-14-generic).",expOpts:["sudo dpkg -i linux*.deb instala paquetes de kernel, no muestra la versión actual.","Correcto: uname -r muestra la versión del kernel en ejecución.","uname -o muestra el nombre del sistema operativo (GNU/Linux), no la versión del kernel.","kexec -l carga un nuevo kernel para rearranque; no muestra la versión actual."]},
{id:121,year:2024,section:"Supuesto II",anulada:false,q:"Sobre SFTP y FTPS, indique la afirmación INCORRECTA:",opts:["SFTP usa el puerto 22 de SSH mientras que FTPS usa el puerto definido para SSL/TLS.","SFTP usa autenticación con certificado (clave pública) mientras que FTPS usa usuario y contraseña.","FTPS usa dos puertos mientras que SFTP usa el mismo puerto para comandos y datos.","FTPS no contiene comandos estandarizados para manipular directorios, mientras que SFTP sí."],answer:1,explanation:"Tanto SFTP como FTPS admiten múltiples métodos de autenticación, incluidas claves públicas y usuario/contraseña. No son exclusivos de cada protocolo.",expOpts:["Correcto: SFTP usa el puerto 22 y FTPS usa los puertos configurados para FTP con TLS.","INCORRECTA: tanto SFTP como FTPS pueden usar usuario/contraseña y/o certificados.","Correcto: FTPS usa dos canales; SFTP usa un solo canal.","Correcto: SFTP tiene comandos ricos; FTPS hereda los de FTP que son más limitados."]},
{id:122,year:2024,section:"Supuesto II",anulada:false,q:"Se instaló CLAUDIA del CCN para detectar APTs. ¿Cómo define el CCN una APT?",opts:["Es un tipo de ransomware como WannaCry que cifra archivos a cambio de un rescate.","Es un ataque de suplantación de identidad para obtener credenciales de altos cargos mediante escalada de privilegios.","Es un ataque selectivo de ciberespionaje o cibersabotaje bajo el auspicio de un país u organización adversaria, más allá de motivaciones financieras.","Es un ataque masivo a una organización por un fallo no advertido previamente (zero-day)."],answer:2,explanation:"El CCN define las APT como ataques selectivos de ciberespionaje o cibersabotaje patrocinados por estados o grandes organizaciones, con motivaciones geopolíticas.",expOpts:["Eso describe ransomware, no una APT según el CCN.","Eso describe escalada de privilegios, no la definición de APT.","Correcto: ataque selectivo de ciberespionaje/sabotaje patrocinado por estado o entidad adversaria.","Eso describe un ataque de día cero (zero-day), no una APT."]},
{id:123,year:2024,section:"Supuesto II",anulada:false,q:"¿Qué protocolos para servicios pueden utilizarse con Kubernetes?",opts:["SCTP, TCP (por defecto) y UDP.","HTTP (por defecto), HTTPS y FTP.","SSH, SFTP (por defecto) y UDP.","UDP (por defecto) y TCP."],answer:0,explanation:"Kubernetes soporta tres protocolos de capa de transporte: TCP (el predeterminado), UDP y SCTP.",expOpts:["Correcto: Kubernetes soporta SCTP, TCP (por defecto) y UDP.","HTTP, HTTPS y FTP son protocolos de aplicación; Kubernetes trabaja en capa de transporte.","SSH y SFTP son protocolos de aplicación; SFTP no es el protocolo por defecto.","Falso: el protocolo por defecto es TCP, no UDP."]},
{id:124,year:2024,section:"Supuesto II",anulada:false,q:"Le piden realizar el enrolamiento de veinte móviles. ¿En qué consiste esta tarea?",opts:["Emparejar, en el sistema MDM de la organización, a cada usuario con su móvil.","Dar de alta en una base de datos todos los dispositivos móviles.","Insertar la tarjeta SIM correspondiente a cada móvil.","Formatear a fábrica todos los dispositivos móviles."],answer:0,explanation:"El enrolamiento (enrollment) en MDM es registrar el dispositivo en la plataforma de gestión y asociarlo a su usuario, aplicando políticas de seguridad.",expOpts:["Correcto: el enrolamiento MDM empareja el dispositivo con el usuario y lo registra en la plataforma.","Dar de alta en una BD es parte del proceso pero no define el enrolamiento MDM.","Insertar la SIM es una tarea física previa, no el enrolamiento.","Formatear es el proceso contrario (borrar); no es el enrolamiento."]},
{id:125,year:2024,section:"Supuesto II",anulada:true,q:"Se plantea usar una toma derivada de la climatización del edificio para el CPD. ¿Por qué NO se aconseja?",opts:["Porque la humedad recomendada para un CPD es mucho menor que la recomendada para las personas.","Porque la temperatura recomendada para un CPD es mucho mayor que la recomendada para las personas.","Porque el filtro de impurezas para las personas es mucho más sensible que el recomendado para un CPD.","Porque el aire para un CPD siempre debe provenir del techo y para las personas puede provenir lateralmente."],answer:0,explanation:"Pregunta anulada. Los requisitos de temperatura y humedad de un CPD son distintos. La temperatura en un CPD es más baja (18-27°C), no más alta. La ambigüedad de las opciones causó la anulación.",expOpts:["Fue la opción marcada provisionalmente. La humedad en un CPD debe controlarse con precisión.","Falso: la temperatura en un CPD no es mayor que la de personas; es similar o algo menor.","Los filtros de un CPD necesitan ser más sensibles para proteger el hardware del polvo.","No hay una regla universal sobre la dirección del flujo de aire en los CPD."]},
{id:126,year:2024,section:"Supuesto II",anulada:false,q:"Se descarga una herramienta del CCN-CERT y aparece un hash de comprobación. ¿Qué medida de seguridad es?",opts:["Una medida antimalware que sanitiza el fichero descargado.","Una medida para asegurar la integridad del fichero: si el hash calculado no coincide con el publicado, el fichero no es válido.","El hash es la firma del CCN como autoridad de certificación para sistemas de nivel ALTO.","El hash es la firma del CCN de la página web donde se presenta la herramienta."],answer:1,explanation:"Un hash de verificación (checksum) sirve para comprobar la integridad: si coincide con el publicado, el fichero no ha sido modificado.",expOpts:["Falso: un hash no sanitiza ni elimina malware. Solo verifica integridad.","Correcto: el hash permite verificar que el fichero descargado es íntegro (no modificado).","Falso: el hash no es una firma de certificación de nivel ENS.","Falso: el hash es del fichero descargable, no de la página web."]},
{id:127,year:2024,section:"Supuesto II",anulada:false,q:"Con VoIP y SIP, las llamadas con usuarios externos se cortan y reconectan. Con usuarios internos no pasa. ¿Por qué?",opts:["Se están usando incorrectamente los códecs.","La salida a Internet está empleando NAT.","El tráfico está interceptado en el cortafuegos.","La CPU es insuficiente y provoca estos problemas."],answer:1,explanation:"NAT es problemático para SIP porque SIP incrusta direcciones IP en el cuerpo del mensaje. Al pasar por NAT, la IP interna queda en el cuerpo SIP sin traducir, causando problemas con usuarios externos.",expOpts:["Los códecs afectan a la calidad pero no causarían cortes que se restablecen solo con externos.","Correcto: NAT modifica la cabecera IP pero no el cuerpo SIP, causando problemas con externos.","Un cortafuegos bloquearía completamente la llamada, no causaría cortes intermitentes.","Un problema de CPU afectaría igualmente a llamadas internas y externas."]},
{id:128,year:2024,section:"Supuesto II",anulada:false,q:"Con Postfix se decide entre POP3 o IMAP. ¿Cuál de las siguientes opciones es INCORRECTA?",opts:["Con IMAP, los mensajes se almacenan en el servidor y los usuarios pueden leerlos desde varios clientes.","POP3 solo admite sincronización unidireccional, descargando correos del servidor al cliente.","Con IMAP, el correo se almacena en el servidor hasta que el usuario lo elimina permanentemente.","Con POP3, si un usuario organiza correos en carpetas en un dispositivo, se replica en el resto."],answer:3,explanation:"POP3 descarga los correos al cliente local. La organización en carpetas es local a cada cliente y NO se replica entre dispositivos.",expOpts:["Correcto: IMAP mantiene mensajes en el servidor accesibles desde múltiples clientes.","Correcto: POP3 es unidireccional; descarga del servidor al cliente.","Correcto: con IMAP los mensajes permanecen en el servidor.","INCORRECTA: con POP3 las carpetas son locales; no se replican entre dispositivos."]},
{id:129,year:2024,section:"Supuesto II",anulada:false,q:"Se necesita saber los usuarios que acceden a la BD y desde qué host. ¿Qué comando ejecutaría en MySQL?",opts:["SELECT * FROM all_users","mysql> SELECT user FROM mysql.user","mysql> SELECT user,host FROM mysql.user","sudo mysql -u root -p"],answer:2,explanation:"Para ver usuarios de MySQL Y el host, la consulta correcta es 'SELECT user,host FROM mysql.user'.",expOpts:["all_users es una vista de Oracle, no de MySQL.","SELECT user FROM mysql.user muestra los usuarios pero no el host.","Correcto: SELECT user,host FROM mysql.user muestra usuarios y hosts permitidos.","sudo mysql -u root -p es el comando para conectarse a MySQL, no para consultar usuarios."]},
{id:130,year:2024,section:"Supuesto II",anulada:false,q:"Se quieren aplicar GPOs al grupo de usuarios Profesores en Directorio Activo. Una buena práctica es definir primero:",opts:["Una Unidad Organizativa (OU) para el grupo de usuarios Profesores.","Las ACLs que tendrán las GPOs.","Un nuevo bosque de Directorio Activo.","Relaciones de confianza entre el DA actual y el dominio del grupo Profesores."],answer:0,explanation:"En Active Directory, las GPO se vinculan a Unidades Organizativas (OU). Crear la OU primero permite aplicar GPOs de forma organizada.",expOpts:["Correcto: crear una OU para los Profesores permite aplicar GPOs de forma organizada y granular.","Las ACLs de las GPO se configuran después de crear la OU y la GPO.","Crear un nuevo bosque sería extremo e innecesario.","Las relaciones de confianza son para federar dominios distintos; no es lo necesario aquí."]},
{id:131,year:2024,section:"Reserva SII",anulada:false,q:"¿Cómo cambiaría el mensaje HELO de Postfix para que muestre 'CORREOBIBLIOTECA' en todos los servidores SMTP?",opts:["Editando $client en /etc/postfix/main.cf y reiniciando Postfix.","Accediendo al servidor SMTP y ejecutando EHLO -name CORREOBIBLIOTECA.","Editando smtp_helo en /etc/postfix/master.cf y reiniciando Postfix.","Editando $helo_name en /etc/postfix/main.cf y reiniciando Postfix."],answer:3,explanation:"En Postfix, el parámetro que controla el nombre HELO/EHLO es '$helo_name' en /etc/postfix/main.cf.",expOpts:["$client no es el parámetro correcto de Postfix para el nombre HELO.","EHLO es un comando del protocolo SMTP, no un parámetro de configuración.","master.cf configura los procesos de Postfix, no los parámetros como el nombre HELO.","Correcto: $helo_name en /etc/postfix/main.cf controla el nombre HELO de Postfix."]},
{id:132,year:2024,section:"Reserva SII",anulada:false,q:"Se instalará WiFi con WPA3-Enterprise. ¿Qué se necesita para acceder?",opts:["Una contraseña de 64 bits.","Una contraseña de 128 bits.","Un servidor RADIUS o cualquier solución que permita EAP-TLS.","Una contraseña de 192 bits usando el algoritmo GMCP-256."],answer:2,explanation:"WPA3-Enterprise usa autenticación mediante 802.1X con servidor RADIUS y métodos EAP. No usa contraseñas compartidas (PSK), que son de WPA3-Personal.",expOpts:["WPA3-Personal usa PSK, no WPA3-Enterprise.","Una contraseña de 128 bits no es la autenticación de WPA3-Enterprise.","Correcto: WPA3-Enterprise requiere servidor RADIUS y autenticación 802.1X/EAP.","GMCP-256 no es un algoritmo real."]},
{id:133,year:2024,section:"Reserva SII",anulada:false,q:"En MySQL de Profesores, hay que añadir la tabla 'ProfesoresIngles' con nombres y apellidos. ¿Qué comando?",opts:["CREATE TABLE ProfesoresIngles (id INT NOT NULL PRIMARY KEY AUTO_INCREMENT, nombre VARCHAR(30), apellido1 VARCHAR(30), apellido2 VARCHAR(30));","CREATE TABLE ProfesoresIngles KEY id, nombre, apellidos;","CREAR TABLA ProfesoresIngles KEY apellidos, nombre;","CREATE TABLE ProfesoresIngles (nombre, apellido);"],answer:0,explanation:"La sintaxis correcta en MySQL incluye CREATE TABLE con clave primaria autoincremental y columnas VARCHAR.",expOpts:["Correcto: CREATE TABLE con clave primaria, AUTO_INCREMENT y tipos de datos correctos.","Falso: la sintaxis 'KEY id, nombre, apellidos' no es SQL válido.","CREAR TABLA no es SQL estándar; SQL usa CREATE TABLE.","Falso: no se especifican los tipos de datos, lo cual es obligatorio."]},
{id:134,year:2024,section:"Reserva SII",anulada:false,q:"Ha instalado Nagios y quiere comprobar que la configuración es correcta. ¿Qué comando usa?",opts:["nagios -v /usr/local/nagios/etc/nagios.cfg","/mnt/nagios -check","systemctl status nagios","https://profesores.es nagios"],answer:0,explanation:"El comando 'nagios -v archivo.cfg' verifica la sintaxis y configuración de Nagios sin iniciar el servicio.",expOpts:["Correcto: nagios -v verifica la configuración de Nagios (sintaxis y coherencia de los .cfg).","'/mnt/nagios -check' no es un comando de Nagios válido.","'systemctl status nagios' muestra si el servicio está activo, no verifica la configuración.","La opción d no es un comando válido."]},
{id:135,year:2024,section:"Reserva SII",anulada:false,q:"Según las recomendaciones del CCN, ¿cuál es la versión mínima y la recomendada de TLS?",opts:["Versión mínima 1.1 y recomendada la 1.1","Versión mínima 1.0 y recomendada 1.1","Versión mínima 1.2 y recomendada la 1.3","Versión mínima 1.1 y recomendada la 1.3"],answer:2,explanation:"El CCN recomienda como versión mínima aceptable TLS 1.2 y como versión recomendada TLS 1.3. TLS 1.0 y 1.1 están obsoletas.",expOpts:["TLS 1.1 está obsoleta; el CCN no la acepta como versión mínima.","TLS 1.0 está obsoleta y no es aceptable según el CCN.","Correcto: mínimo TLS 1.2, recomendado TLS 1.3.","TLS 1.1 como mínimo no cumple las recomendaciones del CCN."]}];

<p>Dada la envergadura del proyecto, y para aprovechar las aplicaciones ya implantadas en la Subdirección y la experiencia profesional del personal, van a convivir diferentes lenguajes de programación, entre otros, Java, C# o Python, así como distintos gestores de Bases de Datos. Como repositorio de código se utiliza Git.</p>
<p><strong>A continuación se muestra un diagrama simplificado de clases que describe parte del sistema:</strong></p>

<p>Salvo que el enunciado diga lo contrario, se asume que aquellas preguntas que contengan un fragmento de código tendrán declaradas correctamente todas las clases, librerías y variables que no aparezcan explícitamente. Del mismo modo si se trata de lenguaje HTML, se da por supuesto que éste será HTML5 y será ejecutado en navegadores que soporten dicha versión. Las sentencias SQL que aparecen se encuentran dentro del estándar ANSI SQL. Como metodología de base el organismo aplica Métrica v3.</p>`

  S2_2019:{
    titulo:'Supuesto II · 2019 — Integración DCM y CHT (teletrabajo COVID-19)',
    html:`<p>Debido a la pandemia ocasionada por el SARS-CoV-2, más conocido como Coronavirus, las Administraciones Públicas se han visto obligadas a impulsar el teletrabajo y a cambiar su estrategia en el ámbito de las TIC.</p>
<p>En este sentido ha sido asignado en la integración de dos organismos en su departamento, los cuales no tienen capacidad para asumir las nuevas demandas de servicios y conexiones.</p>
<p>Uno de los centros es la <strong>Demarcación de Carreteras de Madrid (DCM)</strong> y el otro es la <strong>Confederación Hidrográfica del Tajo (CHT)</strong>.</p>
<p>La DCM tiene máquinas físicas <strong>RedHat Enterprise Linux (RHEL)</strong>. Su estructura consiste en tres áreas y en cada una de ellas trabajan 20 personas.</p>
<p>La CHT tiene máquinas físicas <strong>Solaris</strong>. Su estructura consiste en 5 áreas y en cada una de ellas trabajan 50 personas.</p>
<p>Ambos organismos tienen bastantes máquinas Windows 10, además de equipamiento específico, para el desarrollo de sus actividades, que tendrá que ser trasladado a su CPD.</p>
<p>Es crucial la salvaguarda de los datos, la pérdida o inconsistencia de los mismos durante el proceso es algo inasumible.</p>
<p>Salvo que el enunciado de la propia pregunta diga lo contrario, debe suponer que dispone de los permisos adecuados, tanto a nivel de sistema operativo como de conexión de red.</p>`
  },
  S1_2022:{
    titulo:'Supuesto I · 2022 — Sistema de representación ante la Administración (Cl@ve PIN)',
    html:`<p>Se va a desarrollar un sistema que permitirá a una persona (interesado) otorgar permiso a otra (representante) para que actúe en su nombre ante la Administración en un determinado trámite. El sistema contará con los siguientes módulos:</p>
<ul>
<li>Un frontal web (Punto de Acceso General) que recoge todos los trámites de la Administración y donde el interesado puede otorgar la representación.</li>
<li>Un proceso que tramita las peticiones de representación, envía notificaciones PUSH a los representantes y recaba los consentimientos producidos.</li>
<li>Un módulo de gestión para el personal funcionario de atención al público.</li>
</ul>
<p>Cuando el interesado pulse el botón <em>Otorgar representación</em> en un trámite, el sistema generará un enlace único con caducidad, que será enviado por notificación PUSH al representante.</p>
<p>En el momento en que el representante acceda al enlace tendrá disponible la acción <em>Obtener PIN</em> y deberá usar la aplicación móvil <strong>Cl@ve PIN</strong> para obtener un PIN válido.</p>
<p>El funcionario, en el módulo de gestión, podrá comparar el PIN generado para la operación con el que le ofrece el representante, permitiendo el trámite si estos coinciden.</p>
<p>Un interesado podrá solicitar representación para tantos trámites como considere y cada trámite podrá ser solicitado por un número cualquiera de interesados, pero <strong>una representación solo es válida para un trámite a la vez</strong>. Asimismo, cada representante podrá obtener permisos en cualquier número de trámites.</p>
<p><strong>Diagrama de clases:</strong></p>
<div class="uml-wrap">
<div>
<div class="uml-class"><div class="uml-name">SolicitudRepresentación</div><div class="uml-attr">+ idSolicitud : string</div><div class="uml-attr">+ idRepresentante : string</div><div class="uml-attr">+ idInteresado : string</div><div class="uml-attr">+ PIN : string = null</div><div class="uml-attr">+ fechaCaducidad : datetime = null</div><div class="uml-attr">+ fechaAceptacion : datetime = null</div><div class="uml-attr">+ idTramite : string</div></div>
<div class="uml-rel">▼ 1 : 0..1 ▼</div>
<div class="uml-class"><div class="uml-name">Notificación</div><div class="uml-attr">+ idSolicitud : string</div><div class="uml-attr">+ fechaEnvio : datetime = null</div></div>
</div>
<div>
<div class="uml-class"><div class="uml-name">Trámite</div><div class="uml-attr">+ idTramite : string</div><div class="uml-attr">+ nombre : string</div></div>
<div class="uml-rel">Relación SR↔T: multiplicidades a determinar (recuadros SR&gt;T y T&gt;SR)</div>
</div>
</div>`
  },
  S2_2022:{
    titulo:'Supuesto II · 2022 — Segmentación de red de la Subdirección General de Informática',
    html:`<p>La Subdirección General de Informática del Organismo en el que recientemente Vd. ha tomado posesión y a través de su departamento de Sistemas, Comunicaciones y Seguridad, ha decidido acometer un cambio de diseño en la infraestructura de la red informática del departamento y Vd. debe colaborar en su implantación.</p>
<p>Se parte de la situación inicial donde hay una única red con el siguiente direccionamiento IP <strong>10.20.30.0/24</strong> donde residen:</p>
<ul>
<li>Los equipos informáticos de los usuarios</li>
<li>Las aplicaciones informáticas</li>
<li>Las Bases de Datos Oracle y MySql</li>
<li>La conexión a Internet del departamento</li>
</ul>
<p>Todo reside en la misma red según el modelo que llamaremos <strong>Modelo A</strong>:</p>
<div class="net-box"><strong>MODELO A</strong> — Red única 10.20.30.0 / 24<br>Internet ← Router ← [misma red] → PCs Usuarios · Aplicaciones · Bases de Datos</div>
<p>Después de varios estudios se concluye que se debe realizar una segmentación de la red actual en cuatro subredes:</p>
<ul>
<li>Primera Subred para los PCs de usuario</li>
<li>Segunda Subred para las Bases de Datos</li>
<li>Tercera Subred para las Aplicaciones</li>
<li>Cuarta Subred para utilizarla como DMZ</li>
</ul>
<p>Se instalará una pareja de Firewalls o Cortafuegos formando un clúster donde se implementarán las reglas necesarias para las conectividades y encaminamientos entre Subredes. El modelo al que llamaremos <strong>Modelo B</strong> pasa a ser el siguiente:</p>
<div class="net-box"><strong>MODELO B</strong> — Red segmentada<br>Internet ← Router ← <strong>Clúster Firewalls</strong><br>↓ Subred DMZ &nbsp;&nbsp; ↓ Subred PCs de Usuario<br>↓ Subred Aplicaciones &nbsp;&nbsp; ↓ Subred Bases de Datos</div>
<p><strong>Nota aclaratoria:</strong> los PCs de Usuario tienen sistema operativo <strong>Windows 10</strong> y tanto los servidores para Aplicaciones, Base de Datos y DMZ tienen sistema operativo <strong>Linux RedHat RHEL 7.4</strong>.</p>`
  },
  S1_2024:{
    titulo:'Supuesto I · 2024 — Sistema de gestión de becas para personas opositoras',
    html:`<p>El organismo en el que usted presta servicios es el órgano competente para la concesión de unas becas para personas opositoras y, por tanto, ha surgido la necesidad de desarrollar un sistema de información que cubra todas las fases que se producen en la concesión de las becas.</p>
<p>A continuación, se expone parte del modelo de datos del sistema, donde los atributos señalados en negrita son claves primarias y los señalados en cursiva, claves foráneas:</p>
<div class="uml-wrap">
<div>
<div class="uml-class"><div class="uml-name">Interesado</div><div class="uml-attr"><strong>IdInteresado</strong> - bigint</div><div class="uml-attr">DocumentoIdentidad - varchar(9)</div><div class="uml-attr">Nombre - varchar(100)</div><div class="uml-attr">Apellido1 - varchar(100)</div><div class="uml-attr">Apellido2 - varchar(100)</div><div class="uml-attr">Email - varchar(100)</div></div>
</div>
<div>
<div class="uml-class"><div class="uml-name">SolicitudBeca</div><div class="uml-attr"><strong>IdSolicitudBeca</strong> - bigint</div><div class="uml-attr"><em>IdInteresado</em> - bigint</div><div class="uml-attr"><em>IdCuerpoBecado</em> - bigint</div><div class="uml-attr">FechaPresentacion - datetime</div><div class="uml-attr"><em>IdEstado</em> - bigint</div><div class="uml-attr">AnoConvocatoria - int</div></div>
</div>
<div>
<div class="uml-class"><div class="uml-name">FicheroAdjunto</div><div class="uml-attr"><strong>IdFicheroAdjunto</strong> - bigint</div><div class="uml-attr"><em>IdSolicitudBeca</em> - bigint</div><div class="uml-attr">Denominacion - varchar(100)</div></div>
</div>
<div>
<div class="uml-class"><div class="uml-name">CuerpoBecado</div><div class="uml-attr"><strong>IdCuerpoBecado</strong> - bigint</div><div class="uml-attr">Codigo - varchar(10)</div><div class="uml-attr">Denominacion - varchar(100)</div></div>
<div class="uml-class" style="margin-top:8px"><div class="uml-name">Estado</div><div class="uml-attr"><strong>IdEstado</strong> - bigint</div><div class="uml-attr">Codigo - varchar(10)</div><div class="uml-attr">Denominacion - varchar(100)</div></div>
</div>
</div>
<p>El sistema, en su parte <strong>frontend</strong>, permitirá la firma y presentación de solicitudes, subsanaciones y alegaciones por parte de los interesados una vez se autentiquen. También permitirá la descarga de los distintos listados que se publiquen por parte de los empleados públicos del organismo que tramita estas becas.</p>
<p>Por otra parte, el <strong>backend</strong> dará el servicio necesario al frontend y, además, permitirá a los empleados públicos del organismo, desde una aplicación de gestión, visualizar la información y documentación de las solicitudes, subsanaciones y alegaciones presentadas, así como la publicación de los listados mencionados anteriormente.</p>
<p>Para el desarrollo del frontend se utilizará un framework de desarrollo web con <strong>JavaScript, HTML5 y CSS3</strong>, mientras que el backend podrá desarrollarse con <strong>.NET o Java</strong>, dependiendo de la experiencia y conocimientos de los desarrolladores del organismo.</p>
<p>También se ha decidido usar <strong>GitHub</strong> (plataforma de desarrollo colaborativo para alojar proyectos utilizando el sistema de control de versiones Git) para poder compartir el trabajo entre los desarrolladores en la cual se puede almacenar, compartir y trabajar de forma conjunta en el código. De esta forma se permite seguir y administrar los cambios en el código a lo largo del tiempo.</p>
<p>Adicionalmente, se utilizará un <strong>gestor documental</strong> para la gestión de la documentación aportada en cada uno de los trámites por los interesados, así como los respectivos servicios del <strong>Catálogo de Servicios de Administración Digital</strong> que puedan reutilizarse.</p>`
  },
  S2_2024:{
    titulo:'Supuesto II · 2024 — Infraestructura de red del organismo OEOF',
    html:`<p>El Ministerio de Educación, Formación Profesional y Deportes tiene una red asignada en el Plan de Direccionamiento de la AGE <strong>10.9.0.0/16</strong> y ha creado un organismo para la enseñanza online de formadores, <strong>OEOF</strong> (en adelante nos referiremos en este supuesto sólo como "organismo"), al que le ha correspondido la <strong>última de las subredes de las 16</strong> en las que se ha dividido la red ministerial.</p>
<p>El sistema de enseñanza online de formadores se fundamenta en un servidor de formación accesible también desde Internet en la URL <strong>https://www.profesores.es</strong>. Los servidores de este sistema (web, http, DNS, DHCP, LDAP), se van a instalar con sistema operativo <strong>Linux Ubuntu</strong>. El portal web está montado usando <strong>Apache Tomcat</strong>.</p>
<p>El certificado del portal (SSL) estará asociado al dominio <strong>profesores.es</strong>. Para poder gestionar el correo de los profesores, se ha instalado un servidor de correo con tecnología <strong>Postfix</strong>.</p>
<p>Los DNS se han instalado usando el software <strong>BIND</strong> así como la asignación dinámica de direcciones IP mediante <strong>DHCP</strong>.</p>
<p>Hay un servidor llamado <strong>BIBLIOTECA</strong> que contiene un compendio de documentos e información de utilidad para los profesores. El acceso está permitido por <strong>RDP</strong>. En los elementos de configuración está permitido el acceso remoto para todos los usuarios que en el Directorio Activo estén en el <strong>Grupo de Profesores</strong>. El resto no podrán conectarse. No hay elementos de red que impidan la conexión libre por el <strong>puerto RDP 389</strong> a dicho servidor, desde su misma VLAN.</p>
<p>La base de datos de la biblioteca es <strong>MySQL</strong>.</p>
<p>Además, sobre servidores Ubuntu, se han instalado herramientas de detección de vulnerabilidades (<strong>Tenable Nessus</strong> y <strong>Nmap</strong>) y de monitorización de sistemas y de aplicaciones web (<strong>Nagios</strong>).</p>
<p>Los usuarios de la red (profesores) usan <strong>escritorios virtuales</strong>.</p>
<p>Los switches para configurar las VLANs son <strong>CISCO</strong> (usan sistema operativo <strong>Cisco IOS</strong>).</p>
<p>El CPD principal del organismo tiene un respaldo en un CPD secundario, pero no está configurado como activo-activo y los cambios de los servicios tienen que pasarse manualmente. Tiene redundancia de componentes y de suministro eléctrico y de red. El CPD es <strong>TIER III</strong>.</p>
<p>Salvo que se indique lo contrario en el enunciado, se supone que usted posee <strong>permisos de administrador</strong>.</p>`

// ── STATE ─────────────────────────────────────────────────────────────────────
let questions=[], currentIndex=0, answered=false, score=0, total=0;
let wrongIds=[], mode='all', filterYear='all', filterSection='all';
let savedSession=null, deferredPrompt=null, installDismissed=false;
let saberMasCache={};
let currentShuffled=[0,1,2,3];
let activeContextKey=null;

// ── PERSISTENCE ───────────────────────────────────────────────────────────────
function save(){
  try{
    localStorage.setItem('tai_v2',JSON.stringify({score,total,wrongIds,mode,filterYear,filterSection}));
    if(answered===false && currentIndex>0){
      localStorage.setItem('tai_session',JSON.stringify({
        qIds:questions.map(q=>q.id+'_'+q.year),
        idx:currentIndex,score,total,mode,filterYear,filterSection,activeContextKey
      }));
    }
  }catch(e){}
}

function loadState(){
  try{
    const d=JSON.parse(localStorage.getItem('tai_v2')||'null');
    if(d){score=d.score||0;total=d.total||0;wrongIds=d.wrongIds||[];mode=d.mode||'all';filterYear=d.filterYear||'all';filterSection=d.filterSection||'all';}
    const s=JSON.parse(localStorage.getItem('tai_session')||'null');
    if(s && s.idx>0 && s.idx<(s.qIds||[]).length){savedSession=s;}
  }catch(e){}
}

function clearSession(){try{localStorage.removeItem('tai_session');}catch(e){}}

// ── PWA ───────────────────────────────────────────────────────────────────────
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault(); deferredPrompt=e;
  if(!installDismissed) showInstallBanner();
});

function showInstallBanner(){
  if(document.getElementById('inst')) return;
  const b=document.createElement('div');
  b.id='inst'; b.className='inst-ban';
  b.innerHTML=`<div class="inst-t">Instala <strong>TAI-LI Quiz</strong> como app para usarlo sin conexión</div>
    <button class="inst-btn" onclick="doInstall()">Instalar</button>
    <button class="inst-x" onclick="dismissInst()">✕</button>`;
  document.getElementById('main').prepend(b);
}

function doInstall(){if(!deferredPrompt)return;deferredPrompt.prompt();deferredPrompt.userChoice.then(()=>{deferredPrompt=null;dismissInst();});}
function dismissInst(){installDismissed=true;const b=document.getElementById('inst');if(b)b.remove();}

// ── QUESTION SELECTION ────────────────────────────────────────────────────────
function buildQuestions(){
  let pool=[...ALL_Q];
  if(filterYear!=='all') pool=pool.filter(q=>q.year==filterYear);
  if(filterSection==='wrong') return ALL_Q.filter(q=>wrongIds.find(w=>w.id===q.id&&w.year===q.year));
  if(filterSection==='p1') pool=pool.filter(q=>q.section==='Primera parte'||q.section==='Reserva P1');
  else if(filterSection==='s1') pool=pool.filter(q=>q.section==='Supuesto I'||q.section==='Reserva SI');
  else if(filterSection==='s2') pool=pool.filter(q=>q.section==='Supuesto II'||q.section==='Reserva SII');
  return shuffle(pool);
}

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

function sectionCount(sec,yr){
  let pool=[...ALL_Q];
  if(yr!=='all') pool=pool.filter(q=>q.year==yr);
  if(sec==='p1') return pool.filter(q=>q.section==='Primera parte'||q.section==='Reserva P1').length;
  if(sec==='s1') return pool.filter(q=>q.section==='Supuesto I'||q.section==='Reserva SI').length;
  if(sec==='s2') return pool.filter(q=>q.section==='Supuesto II'||q.section==='Reserva SII').length;
  return pool.length;
}

// ── RENDER HOME ───────────────────────────────────────────────────────────────

  document.getElementById('main').innerHTML=`

      <div class="sc"><div class="sn b">${total-score}</div><div class="sl">Falladas</div></div>
      <div class="sc"><div class="sn p">${pct}%</div><div class="sl">Acierto</div></div>
    </div>`:''}
    <div class="lbl fu fu2">Año</div>
    <div class="ytabs fu fu2">
      <button class="ytab ${filterYear==='all'?'on':''}" onclick="setYear('all')">Todos</button>
      <button class="ytab ${filterYear==='2019'?'on':''}" onclick="setYear('2019')">2019</button>
      <button class="ytab ${filterYear==='2022'?'on':''}" onclick="setYear('2022')">2022</button>
      <button class="ytab ${filterYear==='2024'?'on':''}" onclick="setYear('2024')">2024</button>
    </div>
    <div class="lbl fu fu2">Primera parte</div>
    <div class="sgrid fu fu2" style="grid-template-columns:1fr">
      <button class="sbtn" onclick="startP1()">
        <div class="sbtn-n">Primera parte${filterYear!=='all'?' · '+filterYear:''}</div>
        <div class="sbtn-c">${sectionCount('p1',filterYear)} preguntas</div>
      </button>
    </div>
    <div class="lbl fu fu3">Supuestos prácticos</div>
    <div class="sgrid fu fu3" style="grid-template-columns:1fr">
      ${(()=>{
        const todos=[
          {key:'S1_2019',yr:'2019',sec:'s1',n:'Supuesto I · 2019',d:'Gestión de procesos selectivos'},
          {key:'S2_2019',yr:'2019',sec:'s2',n:'Supuesto II · 2019',d:'Integración DCM y CHT'},
          {key:'S1_2022',yr:'2022',sec:'s1',n:'Supuesto I · 2022',d:'Representación con Cl@ve PIN'},
          {key:'S2_2022',yr:'2022',sec:'s2',n:'Supuesto II · 2022',d:'Segmentación de red'},
          {key:'S1_2024',yr:'2024',sec:'s1',n:'Supuesto I · 2024',d:'Sistema de gestión de becas'},
          {key:'S2_2024',yr:'2024',sec:'s2',n:'Supuesto II · 2024',d:'Infraestructura OEOF'}

        const lista=filterYear==='all'?todos:todos.filter(s=>s.yr===filterYear);

          <div class="tem-btn-n">Temario</div>

function setYear(y){filterYear=y;renderHome();}
function setSec(s){filterSection=s;renderHome();}
function startP1(){filterSection='p1';activeContextKey=null;startQuiz();}
function startWrong(){filterSection='wrong';activeContextKey=null;startQuiz();}
function startSupuesto(key){
  const map={S1_2019:['s1','2019'],S2_2019:['s2','2019'],S1_2022:['s1','2022'],S2_2022:['s2','2022'],S1_2024:['s1','2024'],S2_2024:['s2','2024']};
  [filterSection,filterYear]=map[key];
  activeContextKey=key;
  startQuiz();
}
function toggleCtx(){
  const body=document.getElementById('ctx-body');
  const arr=document.getElementById('ctx-arr');
  if(!body)return;
  const open=body.classList.toggle('open');
  arr.textContent=open?'▲':'▼';
}

// ── START / RESUME ────────────────────────────────────────────────────────────
function startQuiz(){
  questions=buildQuestions();
  if(!questions.length){alert('No hay preguntas con los filtros seleccionados.');return;}
  currentIndex=0;answered=false;score=0;total=0;
  clearSession();renderQuestion();
}

function resumeSession(){
  if(!savedSession)return;
  const map=Object.fromEntries(ALL_Q.map(q=>[q.id+'_'+q.year,q]));
  const qs=savedSession.qIds.map(k=>map[k]).filter(Boolean);
  if(!qs.length){discardSession();return;}
  questions=qs;currentIndex=savedSession.idx;
  score=savedSession.score||0;total=savedSession.idx;
  mode=savedSession.mode||'all';filterYear=savedSession.filterYear||'all';filterSection=savedSession.filterSection||'all';
  activeContextKey=savedSession.activeContextKey||null;
  savedSession=null;answered=false;
  renderQuestion();
}

function discardSession(){savedSession=null;clearSession();renderHome();}

// ── RENDER QUESTION ───────────────────────────────────────────────────────────
function renderQuestion(){
  if(currentIndex>=questions.length){renderResults();return;}
  const q=questions[currentIndex];
  const pct=Math.round((currentIndex/questions.length)*100);
  const lets=['a','b','c','d'];
  currentShuffled=q.anulada?[0,1,2,3]:shuffle([0,1,2,3]);
  const ctxHtml=activeContextKey&&CONTEXTOS[activeContextKey]?`<div class="ctx-panel fu"><div class="ctx-hdr" onclick="toggleCtx()"><span class="ctx-title">📋 ${CONTEXTOS[activeContextKey].titulo}</span><span class="ctx-arrow" id="ctx-arr">▼</span></div><div class="ctx-body" id="ctx-body">${CONTEXTOS[activeContextKey].html}</div></div>`:'';
  document.getElementById('main').innerHTML=`${ctxHtml}
    <div class="qprog fu">
      <div class="pmeta"><span class="pctr">${currentIndex+1} / ${questions.length}</span><span class="psco">${score} correctas</span></div>
      <div class="ptrack"><div class="pfill" style="width:${pct}%"></div></div>
    </div>
    <div class="fu fu1">
      ${q.anulada?'<span class="achip">Pregunta anulada</span>':''}<span class="schip">${q.section}</span><span class="schip ychip">${q.year}</span>
    </div>
    <div class="qnum fu fu1">Pregunta ${q.id}</div>
    <p class="qtext fu fu2">${q.q}</p>
    <div class="opts fu fu3" id="opts">
      ${currentShuffled.map((origIdx,visualPos)=>`<div class="opt" id="o${visualPos}" onclick="pick(${visualPos})"><span class="ol">${lets[visualPos]}</span><span class="otxt">${q.opts[origIdx]}</span></div>`).join('')}
    </div>
    <div id="fb"></div>
    <div class="nav fu fu4" id="nav">
      <button class="btn2" onclick="renderHome()">Inicio</button>
      <button class="skip" onclick="skipQ()">Saltar</button>
    </div>`;
  answered=false;
  save();updateHdr();
}

function pick(i){
  if(answered)return;
  answered=true;total++;
  const q=questions[currentIndex];
  const lets=['a','b','c','d'];
  document.querySelectorAll('.opt').forEach(o=>o.classList.add('dis'));
  const origIdx=currentShuffled[i];
  const ok=origIdx===q.answer;
  const correctVisualPos=currentShuffled.indexOf(q.answer);
  if(ok)score++;
  else if(!wrongIds.find(w=>w.id===q.id&&w.year===q.year)) wrongIds.push({id:q.id,year:q.year});
  document.getElementById('o'+correctVisualPos).classList.add('ok');
  if(!ok)document.getElementById('o'+i).classList.add('no');
  document.querySelectorAll('.opt').forEach((o,j)=>{if(j!==i&&j!==correctVisualPos)o.classList.add('dim');});

  const rows=currentShuffled.map((origJ,visualJ)=>{
    const cls=origJ===q.answer?'cok':visualJ===i&&!ok?'cno':'';
    const mk=origJ===q.answer?'✓':'✗';
    return `<div class="fbor ${cls}"><span class="fbol">${lets[visualJ]})</span><span class="fbom">${mk}</span><span>${q.expOpts[origJ]}</span></div>`;
  }).join('');

  document.getElementById('fb').innerHTML=`<div class="fb ${ok?'ok':'no'} fu">
    <div class="fbv">${ok?'✓ Correcto':'✗ Incorrecto — respuesta correcta: opción '+lets[correctVisualPos]}</div>
    <div class="fbe">${q.explanation}</div>
    <div class="fbo">${rows}</div>
  </div>
  <button class="smbtn" id="smbtn" onclick="saberMas()">✦ Saber más sobre este tema</button>
  <div id="smbox"></div>`;

  document.getElementById('nav').innerHTML=`
    <button class="btn2" onclick="renderHome()">Inicio</button>
    <button class="btn1" onclick="nextQ()">Siguiente →</button>`;
  save();updateHdr();
}

function nextQ(){currentIndex++;renderQuestion();}
function skipQ(){currentIndex++;renderQuestion();}

// ── SABER MÁS (Gemini API) ───────────────────────────────────────────────────
async function saberMas(){
  const q=questions[currentIndex];
  const key=q.year+'_'+q.id;
  const btn=document.getElementById('smbtn');
  const box=document.getElementById('smbox');
  if(!btn||!box)return;

  if(saberMasCache[key]){box.innerHTML=saberMasCache[key];return;}

  btn.disabled=true;
  box.innerHTML=`<div class="smbox"><div class="sml"><div class="dp"><span></span><span></span><span></span></div>Consultando a Gemini...</div></div>`;

  const prompt=`Eres un profesor preparando a un estudiante para el examen TAI-LI (Técnicos Auxiliares de Informática de la Administración General del Estado española). El estudiante no tiene formación previa en informática.

La pregunta del examen era:
"${q.q}"

La respuesta correcta es: ${['a','b','c','d'][q.answer]}) ${q.opts[q.answer]}

Por favor, explica el tema de fondo de esta pregunta en unos 3-4 párrafos claros y didácticos, apropiados para alguien sin formación técnica previa. Incluye:
1. Qué es el concepto o sistema al que hace referencia la pregunta
2. Para qué sirve o por qué es importante
3. Cómo se relaciona con el trabajo de un TAI en la Administración Pública española

Responde en español. Sé claro, concreto y usa analogías si ayudan. No más de 300 palabras.`;

  try{
    const resp=await fetch('https://tai-proxy.kevinfisic.workers.dev',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({prompt})
    });
    const data=await resp.json();
    if(data.error){box.innerHTML=`<div class="smbox"><p style="color:var(--no)">Error: ${data.error}</p></div>`;btn.disabled=false;return;}
    const text=data.text||'No se pudo obtener la explicación.';
    const formatted=text.split('\n\n').map(p=>`<p>${p}</p>`).join('');
    const html=`<div class="smbox"><h4>✦ Saber más</h4>${formatted}</div>`;
    saberMasCache[key]=html;
    box.innerHTML=html;
    btn.disabled=false;
    btn.textContent='✦ Actualizar explicación';
  }catch(e){
    box.innerHTML=`<div class="smbox"><p style="color:var(--no)">No se pudo conectar. Comprueba tu conexión a internet.</p></div>`;
    btn.disabled=false;
  }
}

// ── RESULTS ───────────────────────────────────────────────────────────────────
function renderResults(){
  clearSession();
  const pct=total>0?Math.round(score/total*100):0;
  document.getElementById('main').innerHTML=`
    <div class="rh fu"><div class="rpct">${pct}%</div><div class="rl">de acierto en esta sesión</div></div>
    <div class="stats-row fu fu1">
      <div class="sc"><div class="sn g">${score}</div><div class="sl">Correctas</div></div>
      <div class="sc"><div class="sn b">${total-score}</div><div class="sl">Falladas</div></div>
      <div class="sc"><div class="sn">${total}</div><div class="sl">Respondidas</div></div>
    </div>
    <div class="rnav fu fu2">
      <button class="start-btn" onclick="startQuiz()">Repetir</button>
      ${wrongIds.length?`<button class="btn2" style="width:100%;padding:13px;font-size:13px" onclick="setSec('wrong');startQuiz()">Repasar falladas (${wrongIds.length})</button>`:''}
      <button class="btn2" style="width:100%;padding:13px;font-size:13px" onclick="renderHome()">Volver al inicio</button>
    </div>`;
  save();updateHdr();
}

// ── HEADER ─────────────────────────────────────────────────────────────────────
function updateHdr(){
  document.getElementById('hstats').innerHTML=total>0?`<span class="hchip">${Math.round(score/total*100)}%</span>`:'';
}

loadState();
renderHome();
