{id:38,year:2022,section:"Primera parte",anulada:false,q:"Cuál de las siguientes afirmaciones es FALSA:",opts:["Un intérprete es un programa que ejecuta directamente las instrucciones escritas en un lenguaje de programación dado.","Un compilador es un programa que transforma el código fuente de un programa a su equivalente en otro lenguaje de programación de más bajo nivel.","Un transpilador es un programa que hace de intérprete y de compilador al mismo tiempo.","Un compilador cruzado o cross compiler es un compilador capaz de crear código ejecutable para otra plataforma distinta a aquélla en la que se ejecuta."],answer:2,explanation:"Un transpilador (source-to-source compiler) traduce código de un lenguaje de alto nivel a otro lenguaje de alto nivel. No es una mezcla de intérprete y compilador.",expOpts:["Correcto: un intérprete ejecuta el código directamente. No es falsa.","Correcto: un compilador traduce a un lenguaje de más bajo nivel. No es falsa.","FALSA: un transpilador traduce entre lenguajes de alto nivel, no mezcla intérprete y compilador.","Correcto: un compilador cruzado genera código para otra plataforma. No es falsa."]},
{id:39,year:2022,section:"Primera parte",anulada:false,q:"C++ permite especificar más de una función con el mismo nombre en el mismo ámbito. ¿Cómo se denominan estas funciones?",opts:["Funciones dobles.","Funciones repetidas.","Funciones sobrecargadas.","En C++ no se puede nombrar más de una función con el mismo nombre."],answer:2,explanation:"La sobrecarga de funciones (function overloading) permite definir múltiples funciones con el mismo nombre pero distintos parámetros.",expOpts:["'Funciones dobles' no es la terminología correcta.","'Funciones repetidas' no es la terminología correcta.","Correcto: se denominan funciones sobrecargadas (function overloading).","Falso: C++ sí permite la sobrecarga de funciones."]},
{id:40,year:2022,section:"Primera parte",anulada:false,q:"Indica, de las siguientes afirmaciones, cuál es verdadera:",opts:["Un array o vector es un tipo de dato estructurado que permite almacenar un conjunto de datos homogéneo donde cada elemento se almacena de forma consecutiva en memoria.","Bytecode es el código binario obtenido tras el proceso de compilación (Java).","C++ es un lenguaje de segunda generación.","En C++ la declaración del array: «int vector2[] = {1,2,3,4,10,9,80,70,19};», es incorrecta."],answer:0,explanation:"Un array almacena elementos del mismo tipo de forma contigua en memoria, permitiendo acceso directo mediante índice en O(1).",expOpts:["Correcto: los arrays almacenan datos homogéneos de forma consecutiva en memoria.","Falso: el bytecode de Java es código intermedio para la JVM, no código binario nativo final.","Falso: C++ es un lenguaje de alto nivel (tercera generación).","Falso: esa declaración de array en C++ es perfectamente correcta."]},
{id:41,year:2022,section:"Primera parte",anulada:false,q:"Señale la respuesta correcta sobre los tipos de controladores (drivers) JDBC:",opts:["Los drivers tipo 1 utilizan Java puro para implementar un protocolo de red de proveedores del Sistema Gestor de Base de Datos.","Los drivers tipo 3 utilizan un protocolo de red y middleware para comunicarse con un servidor.","Según la tecnología utilizada para conectarse a la base de datos, los drivers JDBC se categorizan en 3 tipos diferentes.","Los drivers tipo 2 son controladores \"puente\", que utilizan otra tecnología (por ejemplo ODBC) para comunicarse con la base de datos."],answer:1,explanation:"Los drivers JDBC tipo 3 usan un servidor intermedio (middleware) que traduce las peticiones al protocolo del SGBD. Los hay de 4 tipos, no 3.",expOpts:["Falso: los tipo 1 son puentes JDBC-ODBC. Los tipo 4 son Java puro con protocolo nativo.","Correcto: los drivers JDBC tipo 3 utilizan middleware para comunicarse con el SGBD.","Falso: los drivers JDBC se categorizan en 4 tipos, no 3.","Falso: los drivers tipo 1 son los puentes (JDBC-ODBC), no los tipo 2."]},
{id:42,year:2022,section:"Primera parte",anulada:false,q:"Señale la respuesta INCORRECTA. Los tipos más corrientes de anomalías de base de datos son:",opts:["Lecturas no repetibles.","Lecturas hundidas.","Lecturas sucias.","Lecturas fantasma."],answer:1,explanation:"Las anomalías de concurrencia son: lecturas sucias (dirty reads), lecturas no repetibles y lecturas fantasma. 'Lecturas hundidas' no es un término reconocido.",expOpts:["Las lecturas no repetibles sí son una anomalía de concurrencia reconocida.","INCORRECTA: 'Lecturas hundidas' no es un tipo de anomalía de BD reconocido.","Las lecturas sucias sí son una anomalía de concurrencia reconocida.","Las lecturas fantasma sí son una anomalía de concurrencia reconocida."]},
{id:43,year:2022,section:"Primera parte",anulada:false,q:"En SQL, ¿cómo se pueden eliminar los datos en una tabla, pero no la propia definición de la tabla?",opts:["DROP TABLE","DELETE","REMOVE","ERASE"],answer:1,explanation:"DELETE elimina filas de datos manteniendo la estructura. DROP TABLE elimina la estructura y los datos.",expOpts:["DROP TABLE elimina la tabla completa (estructura y datos).","Correcto: DELETE elimina los datos (filas) pero mantiene la definición.","REMOVE no es un comando SQL estándar.","ERASE no es un comando SQL estándar."]},
{id:44,year:2022,section:"Primera parte",anulada:false,q:"¿Cuál de los siguientes términos hace referencia a patrones generales de software para asignación de responsabilidades en el diseño orientado a objetos?",opts:["OOD","GRASP","Booch","Fan-In & Fan-Out"],answer:1,explanation:"GRASP (General Responsibility Assignment Software Patterns) son principios para asignar responsabilidades a clases y objetos en el diseño OO, propuestos por Craig Larman.",expOpts:["OOD es la disciplina de diseño OO, no un conjunto de patrones específicos.","Correcto: GRASP son los patrones de asignación de responsabilidades en diseño OO.","Booch es una notación/metodología OO, no patrones de asignación.","Fan-In y Fan-Out son métricas de acoplamiento, no patrones de asignación."]},
{id:45,year:2022,section:"Primera parte",anulada:true,q:"Según METRICA v3, la relación jerárquica entre un objeto que representa la totalidad de ese objeto y las partes que lo componen, es una relación entre clases de tipo:",opts:["Herencia.","Composición.","Asociación.","Agregación."],answer:3,explanation:"Pregunta anulada. Tanto la composición como la agregación pueden describir relaciones todo-parte. La ambigüedad causó la anulación.",expOpts:["Herencia es una relación 'es-un', no 'todo-parte'.","La composición es una relación todo-parte fuerte (ciclo de vida dependiente).","La asociación es una relación general entre clases.","La agregación es una relación todo-parte débil (ciclo de vida independiente)."]},
{id:46,year:2022,section:"Primera parte",anulada:false,q:"Según METRICA v3, ¿cuál es diagrama que describe en detalle un determinado escenario de un caso de uso?",opts:["Diagrama de Interacción.","Diagrama de representación.","Diagrama de flujo de datos.","Diagrama de casos de uso."],answer:0,explanation:"El Diagrama de Interacción (que engloba los de secuencia y colaboración de UML) describe los escenarios detallados de los casos de uso.",expOpts:["Correcto: el Diagrama de Interacción describe los escenarios detallados de los casos de uso.","'Diagrama de representación' no es terminología estándar en Métrica v3.","El DFD representa el flujo de información, no escenarios de casos de uso.","El Diagrama de Casos de Uso muestra la funcionalidad, no el detalle de un escenario."]},
{id:47,year:2022,section:"Primera parte",anulada:false,q:"Indique cuál de las siguientes NO es una librería de Java proporcionada por la Apache Foundation:",opts:["Log4J","httpclient","commons-io","Mockete"],answer:3,explanation:"Log4J, Apache HttpClient y Apache Commons IO son librerías reales de Apache. 'Mockete' no existe; el framework de mocking es Mockito.",expOpts:["Log4J es una librería de logging de Apache.","Apache HttpClient es una librería HTTP de Apache.","Apache Commons IO es una librería de utilidades IO de Apache.","Correcto: 'Mockete' no existe. El framework de mocking es Mockito (no de Apache)."]},
{id:48,year:2022,section:"Primera parte",anulada:false,q:"Seleccione la respuesta correcta sobre .NET:",opts:[".NET es un marco multiplataforma gratuito de Google para compilar aplicaciones y servicios en la nube.",".NET es un proyecto de código abierto.",".NET sirve exclusivamente para desarrollar aplicaciones móviles.",".NET admite un amplio rango de lenguajes de programación, a excepción de C#."],answer:1,explanation:".NET (desde .NET Core) es un proyecto de código abierto mantenido principalmente por Microsoft.",expOpts:["Falso: .NET es de Microsoft, no de Google.","Correcto: .NET (desde .NET Core) es de código abierto en GitHub.","Falso: .NET soporta web, escritorio, móvil, cloud, IoT, etc.","Falso: C# es el lenguaje principal de .NET."]},
{id:49,year:2022,section:"Primera parte",anulada:false,q:"Señale la respuesta INCORRECTA referente al objeto POCO en .NET:",opts:["Es una estructura de datos de .NET que solo contiene propiedades o campos públicos.","Es el acrónimo de Plain Old CLR Object.","No hereda de otra clase o implementa una interfaz.","Podrá contener miembros como: métodos. eventos y delegados."],answer:3,explanation:"Un POCO es precisamente un objeto simple sin métodos de negocio complejos, eventos ni delegados. Solo tiene propiedades para transportar datos.",expOpts:["Correcto: un POCO solo contiene propiedades o campos públicos.","Correcto: POCO significa Plain Old CLR Object.","Correcto: un POCO no hereda de clases base del framework.","INCORRECTA: los POCO no deben contener métodos de negocio, eventos ni delegados."]},
{id:50,year:2022,section:"Primera parte",anulada:true,q:"Cuál de las siguientes afirmaciones sobre REST es FALSA:",opts:["REST es el acrónimo de Representational State Transfer.","Los objetos en REST siempre se manipulan a partir de la URI.","URI son las siglas de Unique Resource Identifier.","Utiliza un protocolo cliente/servidor sin estado."],answer:2,explanation:"Pregunta anulada. URI significa Uniform Resource Identifier (no Unique). La opción c contiene un error factual claro.",expOpts:["Correcto: REST = Representational State Transfer.","Correcto: en REST los recursos se identifican y manipulan a través de sus URIs.","FALSA: URI = Uniform Resource Identifier, no Unique Resource Identifier.","Correcto: REST es stateless (sin estado entre peticiones)."]},
{id:51,year:2022,section:"Primera parte",anulada:false,q:"Señale cuál es un estándar OASIS que define los mecanismos para establecer y compartir contextos de seguridad, y para obtener claves de contextos de seguridad:",opts:["WS-Addressing","WS-Federation","WS-SecureConversation","WS-Policy"],answer:2,explanation:"WS-SecureConversation define cómo establecer, actualizar y cancelar contextos de seguridad (Security Context Tokens) entre partes en una conversación SOAP.",expOpts:["WS-Addressing define cómo direccionar mensajes de servicios web.","WS-Federation define la federación de identidades entre dominios.","Correcto: WS-SecureConversation define los mecanismos para establecer y compartir contextos de seguridad.","WS-Policy define cómo especificar las políticas de los servicios web."]},
{id:52,year:2022,section:"Primera parte",anulada:false,q:"Señale la afirmación correcta con respecto a WSIL:",opts:["Es un método alternativo al descubrimiento de servicios Web.","Define el modelo de programación y la arquitectura de ejecución para desplegar y buscar servicios Web en el entorno Java EE.","Define un modo de publicar y encontrar información sobre servicios Web.","Es una organización diseñada para promover la interoperatividad de servicios Web entre plataformas, sistemas operativos y lenguajes de programación."],answer:0,explanation:"WSIL (Web Services Inspection Language) es un mecanismo para el descubrimiento de servicios web, complementario a UDDI.",expOpts:["Correcto: WSIL es un método alternativo (o complementario) al descubrimiento mediante UDDI.","Eso describe JAX-WS de Java EE, no WSIL.","Eso describe UDDI, el registro estándar de servicios web.","Eso describe el WS-I (Web Services Interoperability), no WSIL."]},
{id:53,year:2022,section:"Primera parte",anulada:false,q:"¿Cuál es el motor web desarrollado por The Mozilla Foundation?",opts:["WebKit","Firefox","Gecko","Edge"],answer:2,explanation:"Gecko es el motor de renderizado web desarrollado por Mozilla y usado en Firefox. WebKit es el motor de Safari (Apple).",expOpts:["WebKit es el motor de renderizado de Apple (Safari).","Firefox es el navegador de Mozilla, no el motor (el motor es Gecko).","Correcto: Gecko es el motor de renderizado web desarrollado por Mozilla Foundation.","Edge es el navegador de Microsoft; usa el motor Blink (Chromium)."]},
{id:54,year:2022,section:"Primera parte",anulada:false,q:"¿Qué término está relacionado con XML-binary Optimized Packaging (XOP)?",opts:["Reconstituted XML Infoset","XOP Header","XOP Package","Optimized Document"],answer:2,explanation:"XOP empaqueta mensajes XML con datos binarios de forma eficiente. El resultado es un 'XOP Package'.",expOpts:["'Reconstituted XML Infoset' es el proceso de reconstrucción desde un XOP Package.","'XOP Header' no es el término principal.","Correcto: un 'XOP Package' es el resultado del proceso de empaquetado XOP.","'Optimized Document' no es la terminología específica de XOP."]},
{id:55,year:2022,section:"Primera parte",anulada:false,q:"¿Cuál de los siguientes NO es un framework para javascript?",opts:["Angular","Bootstrap","React","JDBC"],answer:3,explanation:"Angular y React son frameworks/librerías de JavaScript. Bootstrap es un framework CSS/HTML. JDBC es una API de Java para bases de datos, sin relación con JavaScript.",expOpts:["Angular es un framework JavaScript de Google.","Bootstrap es un framework CSS/HTML para diseño responsivo.","React es una librería JavaScript de Meta.","Correcto: JDBC es una API de Java para bases de datos, no tiene nada que ver con JavaScript."]},
{id:56,year:2022,section:"Primera parte",anulada:false,q:"Para detectar, eliminar y/o mitigar las debilidades de una aplicación se pueden realizar diferentes análisis de seguridad durante el ciclo de vida del desarrollo de software, entre los que NO se encuentra:",opts:["SAST (Static Application Security Testing).","S-SDLC (Secure Software Development Liability Control).","DAST (Dynamic Application Security Testing).","SCA (Software Composition Analysis)."],answer:1,explanation:"SAST, DAST y SCA son tipos reales de análisis de seguridad. 'S-SDLC (Secure Software Development Liability Control)' no es un término estándar reconocido.",expOpts:["SAST analiza el código fuente estáticamente sin ejecutarlo.","Correcto: S-SDLC con esa definición no es un tipo estándar de análisis de seguridad de aplicaciones.","DAST prueba la aplicación en ejecución buscando vulnerabilidades.","SCA analiza las dependencias y componentes de terceros buscando vulnerabilidades."]},
{id:57,year:2022,section:"Primera parte",anulada:false,q:"El principio de la accesibilidad web que exige que los componentes y la navegación de la interfaz de usuario se puedan utilizar por cualquier persona usuaria es:",opts:["La perceptibilidad.","La comprensibilidad.","La robustez.","La operabilidad."],answer:3,explanation:"Los cuatro principios de las WCAG son: Perceptible, Operable, Comprensible y Robusto.",expOpts:["Perceptibilidad: que el contenido pueda ser percibido por todos los sentidos disponibles.","Comprensibilidad: que el contenido y la interfaz sean comprensibles.","Robustez: que el contenido sea interpretable por tecnologías de asistencia.","Correcto: Operabilidad es el principio que exige que la interfaz y la navegación se puedan usar."]},
{id:58,year:2022,section:"Primera parte",anulada:false,q:"Según METRICA v3, ¿qué tipo de pruebas son las que tienen como objetivo verificar el correcto ensamblaje entre los distintos componentes para comprobar que interactúan correctamente a través de sus interfaces, cubren la funcionalidad establecida y se ajustan a los requisitos no funcionales especificados?",opts:["Pruebas del sistema.","Pruebas de implantación.","Pruebas de regresión.","Pruebas de integración."],answer:3,explanation:"Las pruebas de integración verifican que los componentes funcionan correctamente cuando se conectan entre sí.",expOpts:["Las pruebas del sistema verifican el sistema completo.","Las pruebas de implantación verifican el funcionamiento en producción.","Las pruebas de regresión verifican que cambios no rompen funcionalidad existente.","Correcto: las pruebas de integración verifican el ensamblaje e interacción entre componentes."]},
{id:59,year:2022,section:"Primera parte",anulada:false,q:"Según establece METRICA v3, ¿qué participantes están presentes en la tarea de “Elaboración de los Manuales de Usuario”?",opts:["Usuarios Expertos.","Consultor de Sistemas de Información.","Equipo de Formación.","Equipo de Proyecto."],answer:3,explanation:"La elaboración de los Manuales de Usuario es responsabilidad del Equipo de Proyecto en Métrica v3.",expOpts:["Los Usuarios Expertos participan en otras tareas como validación.","El Consultor de Sistemas supervisa el proceso global.","El Equipo de Formación se encarga de la formación, no de elaborar manuales.","Correcto: el Equipo de Proyecto es el responsable de elaborar los Manuales de Usuario."]},
{id:60,year:2022,section:"Primera parte",anulada:false,q:"¿Cuál de las siguientes herramientas NO es un software para el control de versiones?",opts:["JMeter","Subversion","Mercurial","GIT"],answer:0,explanation:"JMeter es una herramienta de pruebas de carga y rendimiento, no de control de versiones. Subversion, Mercurial y GIT sí son sistemas de control de versiones.",expOpts:["Correcto: JMeter es una herramienta de pruebas de carga, no de control de versiones.","Subversion (SVN) sí es un sistema de control de versiones centralizado.","Mercurial sí es un sistema de control de versiones distribuido.","GIT sí es el sistema de control de versiones distribuido más usado."]},
{id:61,year:2022,section:"Primera parte",anulada:false,q:"Señale la respuesta INCORRECTA sobre el kernel de un Sistema Operativo:",opts:["Controla todas las funciones importantes del hardware.","Se encarga del procesamiento paralelo de tareas (multitasking).","Es el núcleo del procesador.","Recibe peticiones de servicio de los procesos y los comunica con el hardware."],answer:2,explanation:"El kernel es el núcleo del sistema operativo, no del procesador. El procesador (CPU) es hardware.",expOpts:["Correcto: el kernel controla el acceso al hardware. No es incorrecta.","Correcto: el kernel gestiona el multitasking. No es incorrecta.","INCORRECTA: el kernel es el núcleo del SISTEMA OPERATIVO, no del procesador.","Correcto: el kernel recibe llamadas al sistema y las gestiona. No es incorrecta."]},
{id:62,year:2022,section:"Primera parte",anulada:false,q:"En un sistema UNIX, cuál es la respuesta INCORRECTA:",opts:["El GID es el número de identificación de grupo.","El UID es el número de identificación de usuario.","El administrador del sistema se denomina root.","El proceso init se refiere al proceso de arranque de un usuario."],answer:3,explanation:"El proceso init (PID 1) es el primer proceso que arranca el kernel al iniciar el sistema. No es el proceso de arranque de un usuario.",expOpts:["Correcto: GID (Group IDentifier) es el identificador numérico de grupo.","Correcto: UID (User IDentifier) es el identificador numérico de usuario.","Correcto: el administrador en Unix/Linux se llama root y tiene UID=0.","INCORRECTA: init es el primer proceso del sistema (PID 1), no el proceso de arranque de un usuario."]},
{id:63,year:2022,section:"Primera parte",anulada:false,q:"Respecto a la virtualización de máquinas, indique la opción FALSA:",opts:["Facilita el despliegue de entornos.","Requiere aumentar la inversión en hardware específico para la virtualización.","Posibilita la ejecución de varios sistemas operativos en una única máquina física.","Permite un aprovechamiento mayor de la capacidad del hardware."],answer:1,explanation:"La virtualización generalmente REDUCE la necesidad de hardware al consolidar servidores, no la aumenta.",expOpts:["Correcto: facilita el despliegue de entornos. No es falsa.","FALSA: la virtualización REDUCE la inversión en hardware al consolidar servidores.","Correcto: se pueden ejecutar múltiples SO en una sola máquina física. No es falsa.","Correcto: la virtualización mejora el aprovechamiento del hardware. No es falsa."]},
{id:64,year:2022,section:"Primera parte",anulada:false,q:"Una copia de seguridad (backup) diferencial:",opts:["Realiza una copia fiel de los datos, lo que implica que un archivo eliminado en el origen, también se eliminará en la copia de seguridad.","Partiendo de una copia de backup completa, realiza una copia de todos los datos modificados desde que se hizo ese backup completo.","Realiza una copia sólo de los datos modificados desde el último backup (sea completo o incremental).","Realiza una copia integral de los datos, copiando todos los contenidos de los sistemas a mantener."],answer:1,explanation:"El backup diferencial copia todo lo que ha cambiado desde el último backup COMPLETO. El incremental copia lo que cambió desde el último backup de cualquier tipo.",expOpts:["Eso describe una copia espejo (mirror backup).","Correcto: el backup diferencial copia todo lo modificado desde el último backup completo.","Eso describe el backup incremental.","Eso describe el backup completo (full backup)."]},
{id:65,year:2022,section:"Primera parte",anulada:false,q:"¿En qué campo del objeto de Kubernetes hay que incluir los valores que permiten identificar unívocamente al objeto?",opts:["kind","spec","apiVersion","metadata"],answer:3,explanation:"En Kubernetes, el campo 'metadata' contiene los datos de identificación: nombre, namespace, etiquetas (labels), anotaciones, UID, etc.",expOpts:["'kind' especifica el tipo de objeto (Pod, Service, Deployment...).","'spec' define el estado deseado del objeto.","'apiVersion' especifica la versión de la API a usar.","Correcto: 'metadata' contiene los datos de identificación única del objeto."]},
{id:66,year:2022,section:"Primera parte",anulada:false,q:"¿Cuál de los siguientes NO es un protocolo de correo electrónico?",opts:["IMAP","SMTP","Outlook","POP3"],answer:2,explanation:"IMAP, SMTP y POP3 son protocolos estándar de correo. Outlook es el cliente de correo de Microsoft (una aplicación), no un protocolo.",expOpts:["IMAP sí es un protocolo de correo electrónico (recepción).","SMTP sí es un protocolo de correo (envío).","Correcto: Outlook es un cliente de correo (aplicación) de Microsoft, no un protocolo.","POP3 sí es un protocolo de correo electrónico (recepción)."]},
{id:67,year:2022,section:"Primera parte",anulada:false,q:"De los siguientes protocolos, ¿cuál se utiliza para administrar dispositivos de una red?",opts:["SMTP","DNS","FTP","CMIP"],answer:3,explanation:"CMIP (Common Management Information Protocol) es el protocolo estándar ISO para la gestión de redes. SMTP es correo, DNS es resolución de nombres, FTP es transferencia de ficheros.",expOpts:["SMTP es el protocolo de envío de correo.","DNS es para resolución de nombres de dominio.","FTP es para transferencia de ficheros.","Correcto: CMIP es el protocolo estándar ISO para administración de dispositivos de red."]},
{id:68,year:2022,section:"Primera parte",anulada:false,q:"¿Cuál es el comando usado por el administrador SNMP que se utiliza para recuperar datos voluminosos de una tabla MIB grande?",opts:["GET","GET BULK","GET NEXT","GET RESPONSE"],answer:1,explanation:"GET BULK es la operación de SNMP v2c/v3 para recuperar grandes bloques de datos de una MIB de forma eficiente.",expOpts:["GET recupera el valor de un único objeto de la MIB.","Correcto: GET BULK recupera grandes cantidades de datos de una tabla MIB eficientemente.","GET NEXT recupera el siguiente objeto en la tabla MIB.","GET RESPONSE es la respuesta del agente SNMP, no un comando del administrador."]},
{id:69,year:2022,section:"Primera parte",anulada:false,q:"¿Qué es ECDSA?",opts:["Un algoritmo de firma.","Un estándar estadounidense de cableado.","Un organismo regulador internacional.","Un protocolo de nivel de enlace."],answer:0,explanation:"ECDSA (Elliptic Curve Digital Signature Algorithm) es un algoritmo de firma digital basado en criptografía de curva elíptica.",expOpts:["Correcto: ECDSA es un algoritmo de firma digital basado en curvas elípticas.","Falso: ECDSA no tiene relación con el cableado.","Falso: ECDSA no es un organismo regulador.","Falso: ECDSA no es un protocolo de nivel de enlace."]},
{id:70,year:2022,section:"Primera parte",anulada:false,q:"Seleccione la respuesta INCORRECTA sobre la firma electrónica:",opts:["Se llama Co-firma a la firma múltiple en la que todos los firmantes están al mismo nivel y en la que no importa el orden en el que se firma.","Cuando se firma en formato XAdES (XML Avanzado), el resultado es un fichero de texto XML.","En el formato XAdES se habla de firmas despegadas (detached), envolventes (enveloping) y envueltas (enveloped) según en qué sitio del propio fichero de firma se guarde el documento original.","El formato PAdES (Propietario Avanzado) es el formato propio utilizado por Microsoft Office, si bien existe una implementación abierta que se aplica en Open Office."],answer:3,explanation:"PAdES es el formato de firma para documentos PDF, no para Microsoft Office. Microsoft Office usa su propio formato OPC/XML.",expOpts:["Correcto: la co-firma es la firma múltiple al mismo nivel.","Correcto: XAdES genera un fichero XML.","Correcto: XAdES tiene modalidades despegada, envolvente y envuelta.","INCORRECTA: PAdES es para PDF, no para Microsoft Office."]},
{id:71,year:2022,section:"Primera parte",anulada:false,q:"¿Cuál de estos equipos de interconexión trabaja a nivel de red (nivel 3 del modelo OSI)?",opts:["Enrutadores (Routers).","Puentes (Bridges).","Conmutadores (Switches).","Concentradores (Hubs)."],answer:0,explanation:"Los routers operan en la capa 3 (red) y se encargan del enrutamiento de paquetes entre redes. Bridges y Switches en capa 2. Hubs en capa 1.",expOpts:["Correcto: los routers operan en capa 3 (red) y enrutan paquetes IP entre redes.","Bridges operan en capa 2 (enlace de datos).","Switches operan principalmente en capa 2.","Hubs operan en capa 1 (física)."]},
{id:72,year:2022,section:"Primera parte",anulada:false,q:"Cuál es la respuesta INCORRECTA acerca de la fibra óptica plástica (POF):",opts:["Está hecha esencialmente de plástico, construida de polimetilmetacrilato envuelto en polímeros fluoruros.","Permite aprovechar todo el ancho de banda y hacerlo sin pérdidas.","Ofrece un núcleo conductor menor que el de la fibra tradicional.","Es muy flexible, lo que hace que se pueda usar sin problema en instalaciones donde los tubos son antiguos."],answer:2,explanation:"La fibra óptica plástica (POF) tiene un núcleo MAYOR que la fibra de vidrio tradicional (monomodo). Su núcleo de 1mm es mucho más grande que los ~9µm de fibra monomodo.",expOpts:["Correcto: la POF está hecha de PMMA con cubierta de polímeros fluoruros.","Correcto: en cortas distancias aprovecha bien el ancho de banda.","INCORRECTA: la POF tiene un núcleo MAYOR (típicamente 1mm) que la fibra de vidrio.","Correcto: la POF es muy flexible y fácil de instalar."]},
{id:73,year:2022,section:"Primera parte",anulada:false,q:"¿Cuál es el prefijo de dirección de Multicast en IPv6?",opts:["::1/128","224.0.0.0/4","FF00::/8","FC00::/7"],answer:2,explanation:"En IPv6, todas las direcciones multicast empiezan con FF00::/8. ::1/128 es el loopback, 224.0.0.0/4 es multicast en IPv4, FC00::/7 son las ULA.",expOpts:["::1/128 es la dirección de loopback IPv6.","224.0.0.0/4 es el rango de multicast en IPv4.","Correcto: FF00::/8 es el prefijo de todas las direcciones multicast en IPv6.","FC00::/7 son las direcciones locales únicas (ULA) en IPv6."]},
{id:74,year:2022,section:"Primera parte",anulada:false,q:"Seleccione la respuesta correcta sobre los niveles y servicios del modelo OSI:",opts:["El modelo OSI se compone de 7 niveles, pero se pude asimilar a un modelo de referencia simplificado de solamente 2 niveles: TCP (Niveles 1 a 4) e IP (Niveles 5, 6 y 7).","Las entidades en un nivel N+1 ofrecen servicios que son utilizados por las entidades del nivel N.","Un servicio confirmado utiliza las 4 primitivas de comunicación entre capas: Request, Indication, Response, Confirm.","Un servicio no confirmado utiliza 3 de las 4 primitivas: Request, Indication, Response."],answer:2,explanation:"Un servicio confirmado en el modelo OSI usa las 4 primitivas: Request, Indication, Response y Confirm. Un servicio no confirmado solo usa Request e Indication.",expOpts:["Falso: la simplificación TCP/IP tiene sus propias capas, no esa descripción.","Falso: es al revés. Las entidades del nivel N+1 USAN los servicios del nivel N.","Correcto: un servicio confirmado usa las 4 primitivas.","Falso: un servicio no confirmado solo usa 2 primitivas (Request e Indication)."]},
{id:75,year:2022,section:"Primera parte",anulada:false,q:"¿Cuál de los siguientes organismos está especializado en telecomunicaciones de la Organización de las Naciones Unidas (ONU), encargado de regular las telecomunicaciones a nivel internacional entre las distintas administraciones y empresas operadoras?",opts:["ICANN","ITU","IEEE","TIA"],answer:1,explanation:"La ITU (International Telecommunication Union) es el organismo especializado de la ONU que regula las telecomunicaciones a nivel internacional.",expOpts:["ICANN gestiona nombres de dominio y asignación de IPs; no es de la ONU.","Correcto: la ITU es el organismo especializado de la ONU para telecomunicaciones.","IEEE es una organización de ingenieros que define estándares técnicos.","TIA es una organización de la industria estadounidense."]},
{id:76,year:2022,section:"Primera parte",anulada:false,q:"¿Qué parte de un certificado de sitio web necesita un navegador para establecer una conexión segura HTTPS?",opts:["La clave pública del certificado del sitio web, para que el navegador descifre los mensajes enviados por ese sitio web.","La clave privada del certificado del sitio web, para que el navegador cifre los mensajes que envía al sitio web.","Las claves pública y privada del certificado del sitio web, para poder cifrar y descifrar los mensajes que se intercambia con el sitio web.","Ninguna. Es el sitio web el que debe recibir las claves pública y privada del certificado de la persona que navega."],answer:0,explanation:"En HTTPS, el servidor envía su certificado con la clave pública al cliente. El navegador usa esa clave pública para cifrar datos enviados al servidor.",expOpts:["Correcto: el navegador necesita la clave pública del certificado del servidor.","Falso: la clave privada la mantiene únicamente el servidor, nunca se comparte.","Falso: el navegador no necesita la clave privada del servidor.","Falso: el servidor necesita su certificado, no el del cliente (salvo autenticación mutua TLS)."]},
{id:77,year:2022,section:"Primera parte",anulada:false,q:"¿Qué es un portal cautivo?",opts:["Un sitio web bloqueado por un ransomware, cuyo acceso no se recupera hasta que se paga un rescate.","Una página o aplicación web con acceso limitado, generalmente en fase de pruebas como paso previo a ponerse en producción.","Un sitio web que no cumple los criterios del nivel AA de WCAG.","Una página web que gestiona el acceso de los usuarios a una red, generalmente inalámbrica."],answer:3,explanation:"Un portal cautivo es una página web que aparece cuando un usuario intenta conectarse a una red (WiFi pública). Obliga a autenticarse o aceptar condiciones antes de obtener acceso.",expOpts:["Eso describe el resultado de un ataque de ransomware.","Eso describe un entorno de staging o preproducción.","Eso describe un sitio inaccesible según WCAG.","Correcto: un portal cautivo gestiona el acceso de usuarios a una red (típicamente WiFi pública)."]},
{id:78,year:2022,section:"Primera parte",anulada:false,q:"Entre los protocolos que puede usar una VPN para proporcionar cifrado NO se encuentra:",opts:["PPTP/MPPE","IPSec","L2TP/IPSec","KSEC 1.1"],answer:3,explanation:"PPTP/MPPE, IPSec y L2TP/IPSec son protocolos VPN reales con cifrado. 'KSEC 1.1' no es un protocolo VPN real.",expOpts:["PPTP con MPPE sí proporciona cifrado en VPN.","IPSec sí es un protocolo estándar de cifrado para VPN.","L2TP/IPSec combina L2TP (tunelado) con IPSec (cifrado).","Correcto: KSEC 1.1 no existe como protocolo VPN real."]},
{id:79,year:2022,section:"Primera parte",anulada:false,q:"¿Qué significa CSMA/CD?",opts:["Acceso múltiple por servicio de portadora y múltiples colisiones.","Acceso múltiple con detección de portadora y detección de colisiones.","Acceso único con múltiples colisiones y detección de portadora.","Acceso único de múltiples portadoras y detección de colisiones."],answer:1,explanation:"CSMA/CD (Carrier Sense Multiple Access with Collision Detection) es el protocolo de control de acceso al medio de Ethernet.",expOpts:["Falso: CSMA/CD no significa 'múltiples colisiones'.","Correcto: CSMA/CD = Carrier Sense Multiple Access / Collision Detection.","Falso: es acceso MÚLTIPLE, no único.","Falso: es acceso múltiple, no único."]},
{id:80,year:2022,section:"Primera parte",anulada:true,q:"¿Qué dispositivo tiene como objetivo principal filtrar el tráfico de una LAN para que el trafico local continúe siendo local pero permitiendo conectividad a otros segmentos?",opts:["Switch","Hub","Router","Gateway"],answer:3,explanation:"Pregunta anulada. Un router dirige tráfico entre redes, pero la descripción también podría aplicar a un switch con VLANs o un gateway. La ambigüedad causó la anulación.",expOpts:["Un switch conmuta dentro de la misma red local.","Un hub es un repetidor sin capacidad de filtrado.","Un router sí filtra y dirige tráfico entre redes. Era la respuesta provisional.","Un gateway interconecta redes con protocolos distintos."]},
{id:81,year:2022,section:"Reserva P1",anulada:false,q:"¿A qué se corresponden las siglas de Red SOHO?",opts:["Small Own, Home Own.","Small Office, Home Own.","Small Office, Home Office.","Small Office, House Office."],answer:2,explanation:"SOHO significa Small Office/Home Office, término para entornos de trabajo pequeños o domésticos con necesidades de red específicas.",expOpts:["Falso: Own no forma parte del acrónimo SOHO.","Falso: Home Own no es correcto.","Correcto: SOHO = Small Office, Home Office.","Falso: House Office no es la denominación correcta."]},
{id:82,year:2022,section:"Reserva P1",anulada:false,q:"Dentro de los dispositivos Android, señale cuál NO es una capa de personalización:",opts:["MIUI","PenPoint OS","One UI","OriginOS"],answer:1,explanation:"MIUI (Xiaomi), One UI (Samsung) y OriginOS (vivo) son capas de personalización de Android. PenPoint OS era un SO de los años 90, no una capa de Android.",expOpts:["MIUI es la capa de personalización de Xiaomi.","Correcto: PenPoint OS era un SO de principios de los 90, no una capa de Android.","One UI es la capa de personalización de Samsung.","OriginOS es la capa de personalización de vivo."]},
{id:83,year:2022,section:"Reserva P1",anulada:false,q:"¿Qué paquete R en SQL Server Machine Learning Services permite realizar transformaciones, estadísticas y modelado?",opts:["Revoscalepy","Microsoftml","Revoscaler","SqlRutils"],answer:2,explanation:"RevoScaleR (Revoscaler) es el paquete R de Microsoft para análisis estadístico, transformaciones y modelado predictivo en SQL Server.",expOpts:["Revoscalepy es el equivalente de RevoScaleR para Python.","Microsoftml proporciona algoritmos de ML de Microsoft.","Correcto: RevoScaleR (revoscaler) permite transformaciones, estadísticas y modelado en R.","SqlRutils crea procedimientos almacenados de SQL Server a partir de código R."]},
{id:84,year:2022,section:"Reserva P1",anulada:false,q:"¿Cuál de los siguientes lenguajes está relacionado con el desarrollo en backend?",opts:["GO","SASS","XML","ANGULAR"],answer:0,explanation:"Go (Golang) es un lenguaje de programación de Google usado para desarrollo backend. SASS es CSS, XML es formato de datos y Angular es frontend.",expOpts:["Correcto: Go (Golang) es un lenguaje de programación backend.","SASS es un preprocesador de CSS, usado en el frontend.","XML es un formato de intercambio de datos.","Angular es un framework de JavaScript para el frontend."]},
{id:85,year:2022,section:"Reserva P1",anulada:false,q:"Indique cuáles son los diferentes tipos de configuración contemplados para WPS:",opts:["PIN, PBC, USB","PIN, NFC, USB","PIN, USB","PIN, PBC, NFC, USB"],answer:3,explanation:"WPS tiene cuatro métodos: PIN (código numérico), PBC (Push Button Configuration), NFC (Near Field Communication) y USB (mediante pendrive).",expOpts:["Falso: falta NFC.","Falso: falta PBC.","Falso: solo lista PIN y USB; faltan PBC y NFC.","Correcto: WPS tiene cuatro tipos: PIN, PBC, NFC y USB."]},
{id:86,year:2022,section:"Supuesto I",anulada:false,q:"En el diagrama de clases, la relación entre 'Solicitud Representación' y 'Trámite' (una SR es válida para un trámite; un trámite puede tener muchas SR), ¿qué multiplicidades serían compatibles?",opts:["'1' en SR>T y '1' en T>SR.","'1' en SR>T y '0..N' en T>SR.","'0..N' en SR>T y '1' en T>SR.","'1..N' en SR>T y '0..N' en T>SR."],answer:2,explanation:"Una SR va a UN trámite (SR→T: 1). Un trámite puede tener MÚLTIPLES SR (T→SR: 0..N). Desde la perspectiva de SR: 0..N SR pueden ir a 1 trámite.",expOpts:["Falso: un trámite puede tener múltiples solicitudes.","Falso: la multiplicidad está invertida.","Correcto: 0..N solicitudes pueden ir a 1 trámite.","Falso: una SR va a exactamente 1 trámite."]},
{id:87,year:2022,section:"Supuesto I",anulada:false,q:"En Java SE 17, ¿con qué visibilidad se deben generar los atributos de la clase DAO si se quiere tener acceso directo desde cualquier otro objeto?",opts:["Se usará el modificador 'public'.","Se usará el modificador 'protected'.","No se usará ningún modificador.","Se usará el modificador 'private'."],answer:0,explanation:"Para que cualquier objeto acceda directamente a un atributo sin getters/setters, ese atributo debe ser 'public'.",expOpts:["Correcto: 'public' permite acceso directo desde cualquier clase u objeto.","'protected' solo permite acceso desde la misma clase, subclases o clases del mismo paquete.","Sin modificador (package-private) solo permite acceso desde clases del mismo paquete.","'private' solo permite acceso desde la misma clase."]},
{id:88,year:2022,section:"Supuesto I",anulada:false,q:"En Java SE 17, ¿cuál de los siguientes tipos de colección no admite duplicados?",opts:["List","Stack","Collection","Set"],answer:3,explanation:"En Java, la interfaz Set no admite elementos duplicados. List y Stack permiten duplicados.",expOpts:["List permite elementos duplicados y mantiene el orden.","Stack (pila) permite duplicados.","Collection es la interfaz raíz; no especifica si admite o no duplicados.","Correcto: Set no admite duplicados."]},
{id:89,year:2022,section:"Supuesto I",anulada:false,q:"Para crear una tabla llamada Usuario, ¿qué sentencia SQL debemos ejecutar?",opts:["ALTER TABLE Usuario (idUsuario bigint PRIMARY KEY, nombre varchar(255));","INSERT TABLE Usuario (idUsuario bigint PRIMARY KEY, nombre varchar(255));","CREATE TABLE Usuario (idUsuario bigint PRIMARY KEY, nombre varchar(255));","DROP TABLE Usuario (idUsuario bigint PRIMARY KEY, nombre varchar(255));"],answer:2,explanation:"CREATE TABLE es el comando DDL para crear una nueva tabla. ALTER modifica existentes, INSERT añade datos, DROP elimina tablas.",expOpts:["ALTER TABLE modifica la estructura de una tabla existente.","INSERT TABLE no es una sentencia SQL válida.","Correcto: CREATE TABLE crea una nueva tabla con la estructura especificada.","DROP TABLE elimina una tabla existente."]},
{id:90,year:2022,section:"Supuesto I",anulada:false,q:"En Oracle, ¿cuál es el lenguaje de procedimiento cuya sintaxis permite insertar sentencias SQL y se almacena compilado dentro de la base de datos?",opts:["TRANSACT SQL","PL/SQL","FORTRAN","COBOL"],answer:1,explanation:"PL/SQL (Procedural Language/SQL) es el lenguaje procedimental de Oracle que extiende SQL con estructuras de control y subprogramas. Se almacena compilado.",expOpts:["TRANSACT-SQL (T-SQL) es el lenguaje procedimental de Microsoft SQL Server.","Correcto: PL/SQL es el lenguaje procedimental de Oracle, compilado en la BD.","FORTRAN es un lenguaje científico; no es el lenguaje de Oracle.","COBOL es un lenguaje empresarial; no es el lenguaje de Oracle."]},
{id:91,year:2022,section:"Supuesto I",anulada:false,q:"Se ha heredado una librería compilada que realiza la conexión a un servicio de Cl@ve PIN. ¿Qué patrón de diseño permite reutilizarla?",opts:["Adaptador (Adapter)","Singleton","Chain of responsibility","Iterador (Iterator)"],answer:0,explanation:"El patrón Adapter permite que una interfaz incompatible sea usada a través de una interfaz compatible. Ideal para integrar código heredado sin modificarlo.",expOpts:["Correcto: el Adapter permite reutilizar la librería heredada adaptando su interfaz.","Singleton garantiza una única instancia; no resuelve incompatibilidades de interfaz.","Chain of Responsibility pasa solicitudes por una cadena de manejadores.","Iterator proporciona una forma de recorrer colecciones."]},
{id:92,year:2022,section:"Supuesto I",anulada:false,q:"La última versión del estándar de UML es:",opts:["2.5","2.4.1","2.4","3.0"],answer:0,explanation:"La versión más reciente del estándar UML publicada por el OMG es UML 2.5 (2015) y su revisión UML 2.5.1 (2017).",expOpts:["Correcto: UML 2.5 (o 2.5.1) es la versión más reciente del estándar.","UML 2.4.1 es una versión anterior.","UML 2.4 es una versión anterior.","UML 3.0 no existe como estándar publicado."]},
{id:93,year:2022,section:"Supuesto I",anulada:false,q:"En UML, un diagrama de componentes:",opts:["Describe la estructura del sistema mostrando las clases, sus atributos y relaciones.","Describe cómo un sistema se divide en componentes y muestra las dependencias entre ellos.","Sirve para modelar el hardware utilizado en las implementaciones del sistema.","Muestra una vista de la estructura de un sistema en un momento específico."],answer:1,explanation:"El diagrama de componentes UML muestra cómo el sistema se divide en componentes de software y las dependencias entre ellos.",expOpts:["Eso describe el diagrama de clases.","Correcto: el diagrama de componentes muestra la organización del sistema en componentes y sus dependencias.","Eso describe el diagrama de despliegue.","Eso describe el diagrama de objetos."]},
{id:94,year:2022,section:"Supuesto I",anulada:false,q:"¿Qué framework se puede usar para aplicaciones de escritorio nativas .NET?",opts:[".NET MAUI","Blazor Hybrid","JavaFX","WebView"],answer:0,explanation:".NET MAUI (Multi-platform App UI) es el framework de Microsoft para crear aplicaciones nativas de escritorio y móviles.",expOpts:["Correcto: .NET MAUI permite crear aplicaciones de escritorio nativas (y móviles) en .NET.","Blazor Hybrid permite ejecutar componentes Blazor en apps nativas, pero depende de .NET MAUI.","JavaFX es un framework de escritorio para Java, no para .NET.","WebView es un componente para mostrar contenido web, no un framework completo."]},
{id:95,year:2022,section:"Supuesto I",anulada:false,q:"¿Cuál es la normativa que define los requisitos de accesibilidad de los sitios web del sector público?",opts:["Orden Ministerial 1112/2018.","Ley Orgánica 1112/2018.","Ley 1112/2018.","Real Decreto 1112/2018, de 7 de septiembre."],answer:3,explanation:"La normativa de accesibilidad de los sitios web del sector público es el Real Decreto 1112/2018, de 7 de septiembre.",expOpts:["Falso: no es una Orden Ministerial; es un Real Decreto.","Falso: no es una Ley Orgánica; es un Real Decreto.","Falso: no es una Ley; es un Real Decreto.","Correcto: Real Decreto 1112/2018, de 7 de septiembre."]},
{id:96,year:2022,section:"Supuesto I",anulada:false,q:"En nuestra aplicación Java, ¿qué paquetes usaríamos para establecer la conexión a la base de datos de NOTIFICACION?",opts:["java.database","javax.naming y javax.sql","javax.io y javax.servlet","javax.servlet"],answer:1,explanation:"Para conectarse a bases de datos en Java se usan javax.sql (DataSource, Connection) y javax.naming (JNDI, para localizar el DataSource).",expOpts:["java.database no es un paquete estándar de Java.","Correcto: javax.naming para localizar el DataSource mediante JNDI y javax.sql para la conexión.","javax.io no existe y javax.servlet es para web, no BD.","javax.servlet es para servlets web, no para conexión a bases de datos."]},
{id:97,year:2022,section:"Supuesto I",anulada:false,q:"¿Qué especificación, alineada con Jakarta EE Core Profile, es la indicada para desarrollar un microservicio?",opts:["Jakarta Authentication","Jakarta Batch","Microprofile","Jakarta Connectors"],answer:2,explanation:"MicroProfile es la especificación de la comunidad Eclipse Foundation para el desarrollo de microservicios Java, complementando Jakarta EE.",expOpts:["Jakarta Authentication es para autenticación, no específica de microservicios.","Jakarta Batch es para procesamiento por lotes, no microservicios.","Correcto: MicroProfile está diseñado específicamente para microservicios Java.","Jakarta Connectors (JCA) es para integración con sistemas empresariales."]},
{id:98,year:2022,section:"Supuesto I",anulada:false,q:"En el equipo de desarrollo se ha decidido usar Selenium WebDriver para:",opts:["Mejorar la accesibilidad de las páginas web facilitando audios.","Automatizar la ejecución de pruebas en el navegador.","Minimizar el tiempo de carga de la página web.","Diseñar páginas web adaptables."],answer:1,explanation:"Selenium WebDriver es el estándar de facto para la automatización de pruebas funcionales en navegadores web.",expOpts:["Falso: Selenium no mejora accesibilidad ni genera audios.","Correcto: Selenium WebDriver automatiza la ejecución de pruebas funcionales en el navegador.","Falso: Selenium no optimiza el rendimiento.","Falso: el diseño responsive se hace con CSS."]},
{id:99,year:2022,section:"Supuesto I",anulada:false,q:"¿Cuál es una herramienta de análisis de seguridad y calidad de código?",opts:["SonarQube","SonarCode","SonarCuality","SonarSrc"],answer:0,explanation:"SonarQube es la plataforma real de análisis estático de código para detectar vulnerabilidades, bugs y medir la calidad.",expOpts:["Correcto: SonarQube es la herramienta real de análisis de seguridad y calidad de código.","SonarCode no es una herramienta real.","SonarCuality no es una herramienta real.","SonarSrc no es una herramienta real."]},
{id:100,year:2022,section:"Supuesto I",anulada:true,q:"¿Cuál de los siguientes es un protocolo de seguridad usado en las comunicaciones HTTP?",opts:["TLS","SSL","STARTTLS","WPA2"],answer:0,explanation:"TLS (Transport Layer Security) es el protocolo de seguridad estándar actual para HTTPS. SSL está obsoleto.",expOpts:["Correcto: TLS es el protocolo de seguridad estándar para HTTPS.","SSL está obsoleto con vulnerabilidades graves.","STARTTLS es un mecanismo para upgrading de conexiones no cifradas, usado en SMTP e IMAP.","WPA2 es un protocolo para redes WiFi, no para HTTP."]},
{id:101,year:2022,section:"Supuesto I",anulada:false,q:"¿Qué tecnología es adecuada para implementar la recepción de notificaciones nativas en los teléfonos del representante?",opts:["WebView","Mobile push","CDMA","Wi-Fi"],answer:1,explanation:"Las notificaciones push móviles permiten enviar mensajes a dispositivos móviles aunque la aplicación no esté en primer plano. Se implementan mediante FCM de Google o APNs de Apple.",expOpts:["WebView es un componente para mostrar contenido web, no para notificaciones.","Correcto: Mobile push (notificaciones push) es la tecnología para recibir notificaciones nativas.","CDMA es un protocolo de acceso múltiple de las redes de telefonía.","Wi-Fi es la tecnología de red inalámbrica; no es la tecnología específica para notificaciones push."]},
{id:102,year:2022,section:"Supuesto I",anulada:false,q:"¿Cuál de los siguientes lenguajes de estilos emplearía si le piden modificar el color de un botón en el frontal web?",opts:["XML","SGML","XSL","CSS"],answer:3,explanation:"CSS (Cascading Style Sheets) es el lenguaje estándar para el diseño y presentación de páginas web.",expOpts:["XML es un lenguaje de marcado para estructurar datos, no para estilos visuales.","SGML es el metalenguaje del que deriva HTML; no es un lenguaje de estilos.","XSL es para transformar documentos XML, no páginas web convencionales.","Correcto: CSS es el lenguaje de estilos para páginas web."]},
{id:103,year:2022,section:"Supuesto I",anulada:false,q:"¿Cómo se conoce el conjunto de pautas, componentes y herramientas de diseño de interfaz de usuario de Google?",opts:["WCAG 2.1","WAI-ARIA","Material Design","Inclusive Design"],answer:2,explanation:"Material Design es el sistema de diseño de Google que proporciona directrices y componentes para interfaces de usuario en Android y web.",expOpts:["WCAG 2.1 son las pautas de accesibilidad web del W3C.","WAI-ARIA es una especificación del W3C para mejorar la accesibilidad.","Correcto: Material Design es el sistema de diseño de Google.","Inclusive Design es un enfoque de diseño para todos, no un sistema específico de Google."]},
{id:104,year:2022,section:"Supuesto I",anulada:false,q:"¿A qué corresponde el acrónimo CSRF, que permite al atacante forzar al usuario a ejecutar acciones no deseadas en la aplicación?",opts:["Cross Site Request Forgery","Cross Site Repeat Forgery","Cross Site Reduction Forgery","Cross Send Request Forgery"],answer:0,explanation:"CSRF (Cross-Site Request Forgery): el atacante engaña al navegador del usuario autenticado para que envíe peticiones no intencionadas a una aplicación web.",expOpts:["Correcto: CSRF = Cross-Site Request Forgery.","Falso: 'Repeat Forgery' no es la expansión correcta.","Falso: 'Reduction Forgery' no es la expansión correcta.","Falso: 'Cross Send Request' no es la expansión correcta."]},
{id:105,year:2022,section:"Supuesto I",anulada:false,q:"Señale el software que permite automatizar la construcción y despliegue de un proyecto utilizando el concepto de pipelines:",opts:["Jenkins","RabbitMQ","Apache Kafka","Subversion"],answer:0,explanation:"Jenkins es el servidor de integración y entrega continua (CI/CD) más usado. Permite automatizar construcción, pruebas y despliegue mediante pipelines.",expOpts:["Correcto: Jenkins es el servidor CI/CD estándar que automatiza construcción y despliegue.","RabbitMQ es un broker de mensajería, no una herramienta CI/CD.","Apache Kafka es una plataforma de streaming de eventos, no CI/CD.","Subversion (SVN) es un sistema de control de versiones, no CI/CD."]},
{id:106,year:2022,section:"Reserva SI",anulada:true,q:"En JSON, ¿qué valor mostraría la consola si ejecutamos: console.log(4 * 3 ** 2)?",opts:["36","-1","24","Null"],answer:0,explanation:"Pregunta anulada. El operador ** es potenciación en JavaScript. 3**2=9, luego 4*9=36. La respuesta es 36.",expOpts:["36 = 4 * (3**2) = 4 * 9 = 36. Esta sería la respuesta correcta.","−1 no es el resultado correcto.","24 no es el resultado correcto.","Null no es el resultado correcto."]},
{id:107,year:2022,section:"Reserva SI",anulada:false,q:"¿Qué característica de las cookies permite que el navegador solo envíe la cookie al servidor si se originó en el mismo sitio web?",opts:["Domain","SameSite","Secure","HttpOnly"],answer:1,explanation:"El atributo 'SameSite' controla cuándo se envía la cookie en peticiones cross-site. Ayuda a prevenir ataques CSRF.",expOpts:["Domain especifica qué dominios pueden recibir la cookie.","Correcto: SameSite restringe el envío de cookies a peticiones del mismo sitio.","Secure indica que la cookie solo se envía sobre HTTPS.","HttpOnly impide el acceso a la cookie desde JavaScript."]},
{id:108,year:2022,section:"Reserva SI",anulada:false,q:"En PHP, ¿qué variable de entorno se puede usar para almacenar datos del inicio de sesión de un usuario?",opts:["$_SESSION","$SESSION","$_GLOBAL","$GLOBAL"],answer:0,explanation:"En PHP, $_SESSION es la superglobal que permite almacenar datos de sesión del usuario entre peticiones.",expOpts:["Correcto: $_SESSION es la superglobal de PHP para gestionar datos de sesión.","$SESSION (sin guion bajo) no es una variable superglobal válida.","$_GLOBAL no existe; la superglobal de variables globales es $_GLOBALS.","$GLOBAL no es una superglobal válida en PHP."]},
{id:109,year:2022,section:"Reserva SI",anulada:false,q:"¿Qué conjunto de herramientas ofrece componentes para trabajar en la parte dinámica del frontal web HTML?",opts:["NumPy","ActiveMQ","Bootstrap","TensorFlow"],answer:2,explanation:"Bootstrap proporciona componentes de UI (botones, formularios, modales, navegación) listos para usar en el frontal web.",expOpts:["NumPy es una librería de computación científica para Python.","ActiveMQ es un broker de mensajería.","Correcto: Bootstrap proporciona componentes de interfaz de usuario para el frontend web.","TensorFlow es una librería de Machine Learning."]},
{id:110,year:2022,section:"Reserva SI",anulada:false,q:"¿Qué método estático usaría para convertir una cadena JSON en un valor u objeto JavaScript?",opts:["JSON.parse()","JSON.stringify()","let obj = JSON","let obj = New JSON"],answer:0,explanation:"JSON.parse() convierte una cadena JSON en un valor u objeto JavaScript. JSON.stringify() hace lo contrario.",expOpts:["Correcto: JSON.parse(cadenaJSON) convierte una cadena JSON en un objeto JavaScript.","JSON.stringify(objeto) convierte un objeto JavaScript en una cadena JSON.","'let obj = JSON' asigna el objeto JSON global, no parsea nada.","'let obj = New JSON' no es sintaxis JavaScript válida."]},
{id:111,year:2022,section:"Supuesto II",anulada:false,q:"En los PCs hay que purgar la memoria caché de resolución DNS. ¿Cuál de los siguientes comandos habría que lanzar desde PowerShell?",opts:["ipconfig /dnsflush","ipconfig /flushdns","ifconifg --erase dnscache","ifconifg --clean dnscache"],answer:1,explanation:"'ipconfig /flushdns' vacía la caché DNS en Windows. 'ifconfig' es un comando de Linux/Unix.",expOpts:["Falso: '/dnsflush' no es un parámetro válido de ipconfig.","Correcto: ipconfig /flushdns vacía la caché DNS en Windows.","Falso: ifconfig es de Linux/Unix.","Falso: ifconfig es de Linux/Unix."]},
{id:112,year:2022,section:"Supuesto II",anulada:false,q:"¿Qué comando utilizaríamos desde PowerShell para ver más información sobre el usuario local 'Infocentro'?",opts:["net user Infocentro","netuser Infocentro","info user Infocentro","infouser Infocentro"],answer:0,explanation:"El comando 'net user nombre' muestra información detallada sobre un usuario local en Windows.",expOpts:["Correcto: 'net user Infocentro' muestra información detallada del usuario local.","'netuser' no es un comando válido.","'info user' no es un comando válido.","'infouser' no es un comando válido."]},
{id:113,year:2022,section:"Supuesto II",anulada:false,q:"En el contexto de la administración del almacenamiento, ¿qué es el 'Thin Provisioning'?",opts:["Es un mecanismo de despliegue de discos en red para clientes ligeros.","Es una tecnología que permite agregar discos físicos en caliente a las cabinas de la SAN.","Es un método de virtualización de almacenamiento que permite asignar el espacio de almacenamiento de una manera flexible bajo demanda.","Es un método por el que se asigna todo el espacio virtualizado y se va reduciendo a medida que el cliente lo descarta."],answer:2,explanation:"Thin Provisioning asigna espacio de almacenamiento bajo demanda en lugar de reservar todo el espacio desde el principio.",expOpts:["Falso: no tiene relación con clientes ligeros.","Falso: agregar discos en caliente es 'hot-swapping'.","Correcto: Thin Provisioning asigna espacio de forma flexible y bajo demanda.","Falso: eso describe el proceso contrario (Thick Provisioning)."]},
{id:114,year:2022,section:"Supuesto II",anulada:false,q:"En uno de los servidores se va a instalar un software de monitorización para Linux. ¿Cuál de los siguientes cumpliría esa función?",opts:["Check_MK","Reddis","Jenkins","Nagstamon"],answer:0,explanation:"Check_MK es una plataforma de monitorización de sistemas e infraestructura IT para Linux.",expOpts:["Correcto: Check_MK es una plataforma real de monitorización de sistemas IT.","Redis es una base de datos en memoria; no es software de monitorización.","Jenkins es una herramienta CI/CD, no de monitorización.","Nagstamon es un cliente de escritorio para ver alertas, no una plataforma completa."]},
{id:115,year:2022,section:"Supuesto II",anulada:false,q:"¿Qué máscara deberá tener la red 10.20.30.0 del modelo A para que haya cuatro subredes?",opts:["255.255.255.194","255.255.255.192","255.255.255.196","255.255.255.190"],answer:1,explanation:"Para dividir en 4 subredes se necesitan 2 bits adicionales: 2^2=4. La máscara /24 más 2 bits = /26 = 255.255.255.192. Cada subred tiene 64 IPs.",expOpts:["255.255.255.194 no es una máscara válida.","Correcto: 255.255.255.192 = /26, que da exactamente 4 subredes de 64 IPs.","255.255.255.196 no es una máscara válida.","255.255.255.190 no es una máscara válida."]},
{id:116,year:2022,section:"Supuesto II",anulada:false,q:"Necesitamos borrar la caché de direcciones físicas (MAC Address) en un servidor Linux. ¿Cuál de los siguientes comandos utilizaría?",opts:["ip delete cache","arp -d","iptables -d mac","ip flush"],answer:1,explanation:"El comando 'arp -d' elimina entradas de la tabla ARP (caché de direcciones MAC) en Linux.",expOpts:["'ip delete cache' no es un comando válido.","Correcto: 'arp -d' elimina entradas de la caché ARP en Linux.","'iptables -d mac' no es un comando válido para la caché ARP.","'ip flush' sin parámetros adicionales no es el comando correcto."]},
{id:117,year:2022,section:"Supuesto II",anulada:false,q:"Si la primera subred del Modelo B es la 10.20.30.0/26, ¿cuáles son las direcciones de Red y Broadcast?",opts:["10.20.30.0 y 10.20.30.255","10.20.30.1 y 10.20.30.62","10.20.30.0 y 10.20.30.63","10.20.30.64 y 10.20.30.127"],answer:2,explanation:"La red 10.20.30.0/26 tiene 64 direcciones: de .0 (red) a .63 (broadcast). Los hosts válidos son .1 a .62.",expOpts:["Falso: .255 sería el broadcast de una /24.","Falso: .1 y .62 son hosts válidos, no red y broadcast.","Correcto: 10.20.30.0 es la dirección de red y 10.20.30.63 es el broadcast de una /26.","Falso: esas son red y broadcast de la segunda subred /26."]},
{id:118,year:2022,section:"Supuesto II",anulada:false,q:"Para instalar un servidor proxy-caché que soporte HTTP, HTTP/2, HTTPS, ¿cuál de las siguientes soluciones puede realizar esa función?",opts:["INFLUXDB","GRAFANA","CHECK_MK","SQUID"],answer:3,explanation:"Squid es el proxy-caché de código abierto más popular. Soporta HTTP, HTTPS y funciona como caché web.",expOpts:["InfluxDB es una base de datos de series temporales, no un proxy-caché.","Grafana es una plataforma de visualización, no un proxy-caché.","Check_MK es una plataforma de monitorización, no un proxy-caché.","Correcto: Squid es el servidor proxy-caché estándar que soporta HTTP, HTTPS."]},
{id:119,year:2022,section:"Supuesto II",anulada:false,q:"Una vez implementado el teletrabajo mediante VPN, se quiere añadir un código por SMS para mayor seguridad. ¿Cómo se denomina esta validación?",opts:["Factor electrónico de autenticación.","Autenticación electrónica de usuarios.","Doble factor de autenticación.","Factor único de autenticación."],answer:2,explanation:"El Doble Factor de Autenticación (2FA) combina algo que sabes (contraseña VPN) + algo que tienes (código SMS).",expOpts:["'Factor electrónico de autenticación' no es la terminología estándar.","'Autenticación electrónica de usuarios' es demasiado genérico.","Correcto: contraseña + código SMS = Doble Factor de Autenticación (2FA).","El factor único sería solo la contraseña."]},
{id:120,year:2022,section:"Supuesto II",anulada:false,q:"En la subred DMZ se quiere implementar un servicio de correo seguro. ¿Cuáles son los puertos seguros para POP, SMTP e IMAP?",opts:["POP:993 / SMTP:465 / IMAP:995","POP:995 / SMTP:495 / IMAP:963","POP:995 / SMTP:465 / IMAP:993","POP:965 / SMTP:495 / IMAP:993"],answer:2,explanation:"Los puertos seguros estándar son: POP3S=995, SMTPS=465, IMAPS=993.",expOpts:["Falso: POP seguro es el 995, no el 993; IMAP seguro es el 993, no el 995 (invertidos).","Falso: SMTP seguro es el 465, no el 495.","Correcto: POP3S=995, SMTPS=465, IMAPS=993.","Falso: POP seguro es el 995, no el 965."]},
{id:121,year:2022,section:"Supuesto II",anulada:false,q:"Para la aplicación AutoFirma 1.8.2, ¿qué algoritmo de huella para la firma se permite?",opts:["ECDSA","MD5","SHA384","DSA"],answer:2,explanation:"AutoFirma soporta SHA256, SHA384 y SHA512. MD5 está obsoleto. ECDSA y DSA son algoritmos de firma, no de hash.",expOpts:["ECDSA es un algoritmo de firma digital, no de hash.","MD5 está obsoleto; no se usa en AutoFirma.","Correcto: SHA384 es un algoritmo de hash seguro soportado por AutoFirma.","DSA es un algoritmo de firma digital, no de hash."]},
{id:122,year:2022,section:"Supuesto II",anulada:false,q:"Se están planteando instalar puntos de acceso WiFi. ¿Cuál de estos estándares puede funcionar a 2,4 GHz, 5 GHz y 6 GHz?",opts:["No existe la banda de los 6 GHz","802.11ax","802.11ac","802.11be"],answer:3,explanation:"IEEE 802.11be (Wi-Fi 7) opera en las tres bandas: 2,4 GHz, 5 GHz y 6 GHz.",expOpts:["Falso: la banda de 6 GHz existe.","802.11ax (Wi-Fi 6) opera en 2,4 y 5 GHz principalmente.","802.11ac (Wi-Fi 5) solo opera en la banda de 5 GHz.","Correcto: 802.11be (Wi-Fi 7) opera en 2,4, 5 y 6 GHz."]},
{id:123,year:2022,section:"Supuesto II",anulada:false,q:"Para conectarse mediante SSH y SCP desde un PC, ¿qué puerto o puertos deberían estar abiertos en el firewall?",opts:["Puerto 21 para SSH y 22 para SCP.","Puerto 22 para SSH y 21 para SCP.","Puerto 21 tanto para SSH como SCP.","Puerto 22 tanto para SSH como SCP."],answer:3,explanation:"SSH usa el puerto 22. SCP trabaja sobre SSH, por lo que también usa el puerto 22. El puerto 21 es FTP.",expOpts:["Falso: SSH usa el puerto 22, no el 21.","Falso: SCP también usa el puerto 22 (trabaja sobre SSH).","Falso: el puerto 21 es para FTP.","Correcto: tanto SSH como SCP usan el puerto 22."]},
{id:124,year:2022,section:"Supuesto II",anulada:false,q:"Si hubiese instalado un IIS, ¿qué comando utilizaría para reiniciarlo?",opts:["IIS RESET","IISRESET","RESET IIS","RESETIIS"],answer:1,explanation:"IISRESET es el comando de Windows para reiniciar el servicio IIS. Se ejecuta desde la línea de comandos con privilegios de administrador.",expOpts:["'IIS RESET' (con espacio) no es el comando correcto.","Correcto: IISRESET es el comando estándar para reiniciar IIS en Windows.","'RESET IIS' no es el comando correcto.","'RESETIIS' no es el comando correcto."]},
{id:125,year:2022,section:"Supuesto II",anulada:false,q:"Se necesita capturar el tráfico de la interfaz eth1 y guardarlo en fichero.out. ¿Cuál es la sentencia correcta?",opts:["snoop -d eth1 -w fichero.out","tcpdump -i any -o fichero.out","tcpdump -i eth1 -w fichero.out","snoop -d any -o fichero.out"],answer:2,explanation:"tcpdump es la herramienta de captura de paquetes en Linux. -i especifica la interfaz y -w escribe la captura en un fichero.",expOpts:["snoop es la herramienta equivalente en Solaris, no en Linux con eth1.","Falso: '-o' no es el parámetro para escribir fichero en tcpdump; es '-w'.","Correcto: tcpdump -i eth1 -w fichero.out captura el tráfico de eth1 y lo guarda.","snoop es para Solaris, no para Linux."]},
{id:126,year:2022,section:"Supuesto II",anulada:false,q:"En el servidor Apache 2.4, ¿cuál de las siguientes directivas debe usar para servir páginas de otros dominios?",opts:["VirtualMachine","VirtualDomain","VirtualHost","VirtualIp"],answer:2,explanation:"VirtualHost es la directiva de Apache que permite configurar múltiples sitios web (dominios) en un mismo servidor.",expOpts:["VirtualMachine no es una directiva de Apache.","VirtualDomain no es una directiva de Apache.","Correcto: <VirtualHost> es la directiva de Apache para alojar múltiples dominios.","VirtualIp no es una directiva de Apache."]},
{id:127,year:2022,section:"Supuesto II",anulada:false,q:"¿Qué opción de las VLAN hace que las tramas Ethernet incorporen la etiqueta 'VLAN ID'?",opts:["untagged","tagged","id","trunk"],answer:1,explanation:"Las tramas 'tagged' (etiquetadas) llevan el campo de VLAN ID incorporado en la cabecera Ethernet (IEEE 802.1Q).",expOpts:["'untagged' son las tramas sin etiqueta VLAN; pertenecen a la VLAN nativa.","Correcto: 'tagged' hace que las tramas Ethernet incorporen la etiqueta VLAN ID.","'id' no es la opción que hace que las tramas lleven etiqueta.","'trunk' es el tipo de puerto que transporta múltiples VLANs."]},
{id:128,year:2022,section:"Supuesto II",anulada:false,q:"Indique qué herramienta desarrollada por el CCN-CERT es una plataforma de análisis avanzado de malware:",opts:["NADA","CADA","ADA","SADA"],answer:2,explanation:"ADA (Advanced Dynamic Analysis) del CCN-CERT es la plataforma de análisis dinámico avanzado de malware mediante sandboxing.",expOpts:["NADA no es una herramienta conocida del CCN-CERT.","CADA no es una herramienta conocida del CCN-CERT.","Correcto: ADA es la plataforma de análisis avanzado de malware del CCN-CERT.","SADA no es una herramienta conocida del CCN-CERT."]},
{id:129,year:2022,section:"Supuesto II",anulada:false,q:"En el clúster de Firewalls se quiere filtrar el tráfico HTTP desde Internet a los servidores WEB. ¿Cuál módulo implementar?",opts:["WAT - Web Administration Tool","WAF - Web Application Firewall","VFN - Virtual Firewall Network","WFL7 - Web Firewall Layer 7"],answer:1,explanation:"Un WAF (Web Application Firewall) inspecciona el tráfico HTTP/HTTPS y protege las aplicaciones web de ataques como SQL injection, XSS, etc.",expOpts:["WAT no es un tipo estándar de módulo de seguridad web.","Correcto: WAF (Web Application Firewall) filtra y monitorea el tráfico HTTP hacia servidores web.","VFN no es un tipo estándar de módulo de seguridad.","WFL7 no es un término estándar de la industria."]},
{id:130,year:2022,section:"Supuesto II",anulada:false,q:"Los PCs tienen Windows 10. ¿Cuál de los siguientes comandos permite ver la tabla de enrutamiento?",opts:["route show","ip route ls","route print","ip route print"],answer:2,explanation:"En Windows, el comando 'route print' muestra la tabla de enrutamiento. 'ip route' con sus variantes son comandos de Linux.",expOpts:["'route show' es sintaxis de Linux, no de Windows.","'ip route ls' es un comando de Linux.","Correcto: 'route print' es el comando de Windows para ver la tabla de enrutamiento.","'ip route print' combina sintaxis de Linux."]},
{id:131,year:2022,section:"Reserva SII",anulada:false,q:"¿Qué comando muestra información del conjunto resultante de directivas (RSoP) en Windows 10?",opts:["gpshow","gpprint","gpresult","gplist"],answer:2,explanation:"gpresult muestra el Conjunto de Directivas Resultante (RSoP) en Windows, indicando qué políticas de grupo se aplican al usuario y equipo.",expOpts:["'gpshow' no es un comando válido.","'gpprint' no es un comando válido.","Correcto: 'gpresult' muestra el RSoP (conjunto resultante de directivas de grupo).","'gplist' no es un comando válido."]},
{id:132,year:2022,section:"Reserva SII",anulada:false,q:"Una vez implementado el teletrabajo mediante VPN, ¿en qué RFC está definido el protocolo PPTP?",opts:["RFC 2661","RFC 2637","RFC 1661","RFC 2472"],answer:1,explanation:"PPTP (Point-to-Point Tunneling Protocol) está definido en el RFC 2637. L2TP está en el RFC 2661. PPP está en el RFC 1661.",expOpts:["RFC 2661 define L2TP, no PPTP.","Correcto: RFC 2637 define PPTP.","RFC 1661 define PPP (Point-to-Point Protocol).","RFC 2472 define PPP over IPv6."]},
{id:133,year:2022,section:"Reserva SII",anulada:false,q:"Los dispositivos son compatibles con PoE++. Señale la afirmación correcta:",opts:["Las siglas corresponden a Power-of-Ethernet.","Como estándar, recibe la denominación IEEE 802.3at.","La alimentación real recibida es de 25,50 Watts.","Se subdivide en dos tipos: Tipo 3 y Tipo 4."],answer:3,explanation:"PoE++ (IEEE 802.3bt) se subdivide en Tipo 3 (hasta 51W recibidos) y Tipo 4 (hasta 71,3W recibidos). IEEE 802.3at es PoE+ (no PoE++).",expOpts:["Falso: PoE significa Power over Ethernet.","Falso: IEEE 802.3at es PoE+ (hasta 30W). PoE++ es IEEE 802.3bt.","Falso: 25,50W es la potencia de PoE+ (IEEE 802.3at), no de PoE++.","Correcto: PoE++ (IEEE 802.3bt) tiene Tipo 3 y Tipo 4."]},
{id:134,year:2022,section:"Reserva SII",anulada:false,q:"Si fuese el motor de Base de Datos ORACLE, ¿cuál de los siguientes comandos utilizaría para crear una copia de seguridad?",opts:["RMAN","DUMPALL","ORACLE_BCK","COPYDB"],answer:0,explanation:"RMAN (Recovery Manager) es la herramienta oficial de Oracle para backups y recuperación.",expOpts:["Correcto: RMAN (Recovery Manager) es la herramienta estándar de Oracle para backups.","DUMPALL es un comando de PostgreSQL, no de Oracle.","ORACLE_BCK no es un comando real.","COPYDB no es un comando real de Oracle."]},
{id:135,year:2022,section:"Reserva SII",anulada:false,q:"La última IP válida de la Subred de Aplicaciones (10.20.30.128/26) se considera la Puerta de Enlace. ¿Cuál es?",opts:["10.20.30.191","10.20.30.190","10.20.30.193","10.20.30.192"],answer:1,explanation:"La red 10.20.30.128/26 tiene 64 direcciones: de .128 (red) a .191 (broadcast). La última IP de host válida es .190.",expOpts:["10.20.30.191 es la dirección de broadcast, no un host válido.","Correcto: 10.20.30.190 es la última dirección de host válida (.191 broadcast - 1 = .190).","10.20.30.193 está fuera del rango.","10.20.30.192 es la dirección de red de la siguiente subred /26."]}];
const Q2024=[{id:1,year:2024,section:"Primera parte",anulada:false,q:"¿Cuál de los siguientes derechos recogidos en el Capítulo Segundo del Título I de la Constitución Española NO forma parte de los Derechos Fundamentales y Libertades Públicas (Artículos 15 a 29)?",opts:["Derecho a sindicarse libremente.","Derecho a la propiedad privada.","Derecho a la producción y creación literaria, artística, científica y técnica.","Derecho a elegir libremente su residencia."],answer:1,explanation:"El Capítulo Segundo del Título I se divide en dos secciones. La Sección 1ª (arts. 15-29) contiene los Derechos Fundamentales y Libertades Públicas, con máxima protección. La Sección 2ª (arts. 30-38) contiene derechos de menor protección.",expOpts:["El derecho a sindicarse (art. 28) sí está en la Sección 1ª, luego SÍ es un derecho fundamental.","El derecho a la propiedad privada está en el art. 33, dentro de la Sección 2ª, por lo que NO es un derecho fundamental. Esta es la correcta.","El derecho a la producción artística y científica (art. 20) sí está en la Sección 1ª.","El derecho a elegir residencia (art. 19) sí está en la Sección 1ª."]},
{id:2,year:2024,section:"Primera parte",anulada:false,q:"Según el Título I, Capítulo Cuarto, “De las garantías de las libertades y derechos fundamentales” de la Constitución Española de 1978, señale la opción correcta:",opts:["Los derechos y libertades reconocidos no vinculan a todas las Administraciones Públicas.","Sólo por ley orgánica podrá regularse el ejercicio de tales derechos y libertades.","Una ley orgánica regulará la institución del Defensor del Pueblo.","El reconocimiento, el respeto y la protección de los principios reconocidos en el Capítulo tercero, informará la judicialización positiva, la práctica legislativa y la actuación de los poderes públicos."],answer:2,explanation:"El art. 54 CE establece que una ley orgánica regulará la institución del Defensor del Pueblo como alto comisionado de las Cortes Generales.",expOpts:["Falso: el art. 53 CE establece que estos derechos vinculan a todos los poderes públicos.","Incompleto y engañoso: el art. 81 CE exige ley orgánica para desarrollar derechos fundamentales, pero no todos los derechos del Capítulo II la requieren.","Correcto: el art. 54 CE prevé expresamente una ley orgánica para el Defensor del Pueblo.","La redacción mezcla conceptos erróneos; el art. 53.3 habla de que estos principios informarán la legislación positiva, no la 'judicialización positiva'."]},
{id:3,year:2024,section:"Primera parte",anulada:false,q:"Señale la respuesta INCORRECTA de acuerdo con el Título II, artículo 62 de la Constitución Española de 1978. Corresponde al Rey:",opts:["Convocar a referéndum en los casos previstos en la Constitución, previa autorización de las Cortes Generales.","Convocar y disolver las Cortes Generales y convocar elecciones en los términos previstos en la Constitución.","Proponer el candidato a Presidente de Gobierno y, en su caso, nombrarlo, así como poner fin a sus funciones en los términos previstos en la Constitución.","Nombrar y separar a los miembros del Gobierno, a propuesta de su Presidente."],answer:0,explanation:"El art. 62 CE enumera las funciones del Rey. La convocatoria de referéndum sí aparece, pero en el art. 62 se dice 'previa autorización del Congreso', no de las Cortes Generales (Congreso y Senado). Esa es la imprecisión que la hace incorrecta.",expOpts:["INCORRECTA: el art. 62.c) dice que la autorización la da el Congreso, no las Cortes Generales (ambas cámaras). Esta es la respuesta que pide la pregunta.","Correcta según art. 62.b) CE.","Correcta según art. 62.d) CE.","Correcta según art. 62.e) CE."]},
{id:4,year:2024,section:"Primera parte",anulada:false,q:"¿Quién puede ser elegido Defensor del Pueblo, según la Ley Orgánica 3/1981, de 6 de abril?",opts:["Cualquier Magistrado elegido por las Cortes Generales.","Cualquier Senador elegido por las Cortes Generales.","Cualquier persona que se encuentre en el pleno disfrute de sus derechos civiles.","Cualquier español mayor de edad que se encuentre en el pleno disfrute de sus derechos civiles y políticos."],answer:3,explanation:"El art. 3 de la LO 3/1981 exige ser español, mayor de edad, y estar en pleno disfrute de los derechos civiles y políticos. No se requiere ser magistrado ni senador.",expOpts:["Falso: no se exige ser magistrado ni ninguna condición profesional específica.","Falso: no se exige ser senador.","Incompleto: falta la condición de ser español, mayor de edad, y también deben estar en pleno disfrute de los derechos políticos, no solo civiles.","Correcto: recoge todos los requisitos del art. 3 de la LO 3/1981."]},
{id:5,year:2024,section:"Primera parte",anulada:false,q:"Según el artículo 71 de la Constitución Española de 1978, ¿quién es el competente en las causas contra Diputados y Senadores?",opts:["Sala de lo Penal del Tribunal Constitucional.","Sala de lo Contencioso Administrativo del Tribunal Supremo.","Sala de lo Penal del Tribunal Supremo.","Sala de lo Civil del Tribunal Supremo."],answer:2,explanation:"El art. 71.3 CE establece que en las causas contra Diputados y Senadores será competente la Sala de lo Penal del Tribunal Supremo. Este privilegio procesal se llama 'aforamiento'.",expOpts:["Falso: el Tribunal Constitucional no juzga causas penales ordinarias.","Falso: lo contencioso-administrativo resuelve conflictos con la Administración, no causas penales.","Correcto: art. 71.3 CE. Los parlamentarios están aforados ante la Sala de lo Penal del TS.","Falso: la Sala de lo Civil no tiene competencia penal."]},
{id:6,year:2024,section:"Primera parte",anulada:false,q:"Según el Título III \"De las Cortes Generales\" de la Constitución Española de 1978, las Cámaras podrán:",opts:["Recibir peticiones individuales y colectivas, siempre por escrito, quedando prohibida la presentación directa por manifestaciones ciudadanas.","Delegar en las Comisiones Legislativas Permanentes la aprobación de proyectos o proposiciones de ley relativas a los Presupuestos Generales del Estado.","Reunirse en sesión extraordinaria a petición de la mayoría simple de los miembros de cualquiera de las Cámaras.","Nombrar conjuntamente Comisiones de Investigación sobre asuntos de interés público. Sus conclusiones serán vinculantes para los Tribunales."],answer:0,explanation:"El art. 77 CE establece que las Cámaras pueden recibir peticiones individuales y colectivas, siempre por escrito, y queda prohibida la presentación directa por manifestaciones.",expOpts:["Correcto: recoge literalmente el art. 77.1 CE.","Falso: el art. 75.3 CE excluye expresamente de la delegación las materias como Presupuestos Generales del Estado.","Falso: el art. 73 CE exige mayoría absoluta de los miembros de la Cámara respectiva para convocar sesión extraordinaria.","Falso: el art. 76.1 CE dice que las conclusiones de las comisiones de investigación NO son vinculantes para los Tribunales."]},
{id:7,year:2024,section:"Primera parte",anulada:false,q:"Según lo establecido en el artículo 159 de la Constitución Española de 1978, los miembros del Tribunal Constitucional serán designados por períodos de:",opts:["9 años y se renovarán por terceras partes cada 3.","9 años y se renovarán por terceras partes cada 2.","6 años y se renovarán por terceras partes cada 3.","6 años y se renovarán por terceras partes cada 2."],answer:0,explanation:"El art. 159.3 CE establece exactamente 9 años de mandato y renovación por tercios cada 3 años. El Tribunal tiene 12 miembros, se renuevan 4 cada 3 años.",expOpts:["Correcto: 9 años, renovación por tercios cada 3. Art. 159.3 CE.","Falso: la renovación es cada 3 años, no cada 2.","Falso: el mandato es de 9 años, no 6.","Falso: ni el período ni la renovación son correctos."]},
{id:8,year:2024,section:"Primera parte",anulada:false,q:"El Gobierno se rige, en su organización y funcionamiento, entre otras, por la Ley:",opts:["Ley 50/1997, de 27 de noviembre.","Ley 50/1999, de 26 de noviembre.","Ley 50/1996, de 28 de noviembre.","Ley 50/1998, de 29 de noviembre."],answer:0,explanation:"La Ley 50/1997, de 27 de noviembre, del Gobierno, regula la organización y funcionamiento del Gobierno.",expOpts:["Correcto: Ley 50/1997, de 27 de noviembre, del Gobierno.","Falso: fecha y año incorrectos.","Falso: fecha y año incorrectos.","Falso: fecha y año incorrectos."]},
{id:9,year:2024,section:"Primera parte",anulada:false,q:"La Constitución Española de 1978 en su artículo 113 establece que:",opts:["El Congreso de los Diputados puede exigir la responsabilidad jurídica del Gobierno mediante la adopción por mayoría absoluta de la moción de censura.","El Congreso de los Diputados puede exigir la responsabilidad política del Gobierno mediante la adopción por mayoría simple de la moción de censura.","El Congreso de los Diputados puede exigir la responsabilidad civil del Gobierno mediante la adopción por mayoría absoluta de la moción de censura.","El Congreso de los Diputados puede exigir la responsabilidad política del Gobierno mediante la adopción por mayoría absoluta de la moción de censura."],answer:3,explanation:"El art. 113 CE establece que la moción de censura debe aprobarse por mayoría absoluta del Congreso y que exige responsabilidad política (no jurídica ni civil).",expOpts:["Falso: la responsabilidad es política, no jurídica.","Falso: se exige mayoría absoluta, no simple.","Falso: la responsabilidad es política, no civil.","Correcto: responsabilidad política + mayoría absoluta. Art. 113 CE."]},
