{id:71,year:2019,section:"Primera parte",anulada:false,q:"El estándar comercializado con el nombre de Wi-Fi 6 se corresponde con el estándar de IEEE:",opts:["802.11ax","802.11ac","802.11ac wave 2","802.11az"],answer:0,explanation:"Wi-Fi 6 es el nombre comercial del estándar IEEE 802.11ax, aprobado en 2021. Wi-Fi 5 es 802.11ac.",expOpts:["Correcto: Wi-Fi 6 = IEEE 802.11ax.","IEEE 802.11ac es Wi-Fi 5.","802.11ac wave 2 es una versión avanzada de Wi-Fi 5, no Wi-Fi 6.","802.11az es una extensión de posicionamiento, no el estándar Wi-Fi 6."]},
{id:72,year:2019,section:"Primera parte",anulada:false,q:"¿Cuál es el prefijo para las direcciones multicast en el protocolo IPv6?",opts:["FF80::/10","FF00::/8","FE00::/8","FE80::/10"],answer:1,explanation:"En IPv6, todas las direcciones multicast comienzan con el prefijo FF00::/8. FE80::/10 son las direcciones link-local.",expOpts:["Falso: FF80::/10 no es el prefijo estándar multicast.","Correcto: FF00::/8 es el prefijo de todas las direcciones multicast en IPv6.","Falso: FE00::/8 no está asignado como prefijo multicast.","Falso: FE80::/10 son las direcciones link-local, no multicast."]},
{id:73,year:2019,section:"Primera parte",anulada:false,q:"De los siguientes protocolos de enrutamiento, ¿cuál utiliza un algoritmo de vector de distancia?",opts:["OSPF","IGRP","IS-IS","OLSR"],answer:1,explanation:"Los protocolos de enrutamiento se dividen en vector de distancia (RIP, IGRP, EIGRP) y estado de enlace (OSPF, IS-IS). IGRP de Cisco usa vector de distancia.",expOpts:["OSPF es un protocolo de estado de enlace (link-state), no vector de distancia.","Correcto: IGRP usa algoritmo de vector de distancia.","IS-IS es un protocolo de estado de enlace.","OLSR también es un protocolo de estado de enlace."]},
{id:74,year:2019,section:"Primera parte",anulada:false,q:"En el protocolo HTTP, el código de error que indica que el servicio no está disponible es el:",opts:["500","501","502","503"],answer:3,explanation:"El código HTTP 503 Service Unavailable indica que el servidor no puede atender la petición temporalmente. El 500 es error interno genérico, el 502 es Bad Gateway y el 501 es Not Implemented.",expOpts:["500 Internal Server Error: error interno genérico del servidor.","501 Not Implemented: el servidor no soporta la funcionalidad requerida.","502 Bad Gateway: respuesta inválida de un servidor proxy.","Correcto: 503 Service Unavailable significa que el servicio no está disponible temporalmente."]},
{id:75,year:2019,section:"Primera parte",anulada:false,q:"¿Cuál de los siguientes registros DNS proporciona información sobre las características básicas del dominio y de la zona en la que se encuentra?",opts:["AAAA","PTR","MX","SOA"],answer:3,explanation:"El registro SOA (Start of Authority) contiene información administrativa sobre la zona DNS: servidor primario, email del administrador, número de serie, tiempos de refresco, etc.",expOpts:["AAAA: registro de dirección IPv6.","PTR: registro de resolución inversa (IP a nombre).","MX: Mail Exchange, indica los servidores de correo del dominio.","Correcto: SOA (Start of Authority) contiene información administrativa básica de la zona DNS."]},
{id:76,year:2019,section:"Primera parte",anulada:false,q:"¿Qué modalidad de gestión de dispositivos móviles se basa en permitir al usuario usar su propio dispositivo personal para tareas profesionales o educativas?",opts:["COPE","BYOD","COBO","CYOD"],answer:1,explanation:"BYOD (Bring Your Own Device) permite a los empleados usar sus propios dispositivos personales para acceder a recursos y datos de la organización.",expOpts:["COPE (Corporate Owned, Personally Enabled): la empresa proporciona el dispositivo pero permite uso personal.","Correcto: BYOD (Bring Your Own Device) permite usar el dispositivo personal para trabajo.","COBO (Corporate Owned, Business Only): la empresa proporciona el dispositivo y solo se usa para trabajo.","CYOD (Choose Your Own Device): el empleado elige entre una selección que proporciona la empresa."]},
{id:77,year:2019,section:"Primera parte",anulada:false,q:"La herramienta del CCN-CERT que permite realizar análisis estático de código dañino a través de múltiples motores antivirus y antimalware para plataformas Windows y Linux es:",opts:["MARIA","PILAR","CLARA","REYES"],answer:0,explanation:"MARIA del CCN-CERT realiza análisis estático de malware mediante múltiples motores antivirus para plataformas Windows y Linux.",expOpts:["Correcto: MARIA realiza análisis estático de código malicioso con múltiples motores antivirus.","PILAR es la herramienta del CCN para análisis y gestión de riesgos de seguridad.","CLARA evalúa el nivel de cumplimiento de guías de bastionado de sistemas Windows.","REYES no corresponde a una herramienta del CCN para este propósito."]},
{id:78,year:2019,section:"Primera parte",anulada:false,q:"En relación con las VPN de nivel de enlace, ¿cuál de los siguientes protocolos NO se utiliza para la implementación de dicha VPN?",opts:["PPTP (Point-to-Point Tunneling Protocol).","L2F (Layer Two Forwarding).","L2TP (Layer Two Tunneling Protocol).","P2TP (Point two Tunneling Protocol)."],answer:3,explanation:"Las VPN de nivel de enlace usan PPTP, L2TP y L2F. 'P2TP' no es un protocolo real; es una opción ficticia.",expOpts:["PPTP sí es un protocolo real para VPN de nivel de enlace.","L2F sí es un protocolo real (desarrollado por Cisco).","L2TP sí es un protocolo real, sucesor de PPTP y L2F.","Correcto: P2TP no existe como protocolo real."]},
{id:79,year:2019,section:"Primera parte",anulada:false,q:"¿Qué es una red Scatternet?",opts:["Es un tipo de red MAN (Metropolitan area network).","Es una red de dispositivos WIFI en LAN (Local area network).","Es un grupo de Piconets.","Es la red utilizada para interconectar CubeSATs."],answer:2,explanation:"Una Scatternet es una red Bluetooth formada por la unión de varias Piconets. Un dispositivo puede participar en múltiples Piconets formando la Scatternet.",expOpts:["Falso: una Scatternet no es una red MAN.","Falso: Scatternet es Bluetooth, no WiFi.","Correcto: una Scatternet es una red de múltiples Piconets Bluetooth interconectadas.","Falso: los CubeSATs usan comunicaciones satelitales, no Scatternet Bluetooth."]},
{id:80,year:2019,section:"Primera parte",anulada:false,q:"En relación a TCP y UDP indique cuál de las siguientes características NO es correcta:",opts:["TCP es fiable.","UDP obliga al nivel de red a verificar que el envío es correcto.","TCP trabaja con un flujo de bytes.","UDP es un protocolo sin conexión. Preguntas de reserva"],answer:1,explanation:"UDP es un protocolo sin conexión y sin garantía de entrega. NO verifica que el envío sea correcto ni obliga al nivel de red a hacerlo.",expOpts:["TCP sí es fiable: garantiza entrega, orden y control de errores.","INCORRECTA: UDP no obliga a verificar nada. Es un protocolo 'best effort' sin garantías.","TCP trabaja con un flujo de bytes (byte stream), a diferencia de UDP que trabaja con datagramas.","UDP es efectivamente un protocolo sin conexión (connectionless)."]},
{id:81,year:2019,section:"Reserva P1",anulada:false,q:"La arquitectura de ordenadores Harvard:",opts:["Tiene un único espacio de memoria para datos e instrucciones.","Tiene dos espacios de memoria separados, uno para datos y otro para instrucciones.","Es un tipo de arquitectura Von Neumann.","Tiene tres espacios de memoria separados para datos, instrucciones y memoria no volátil."],answer:1,explanation:"La arquitectura Harvard tiene memorias separadas para datos e instrucciones, permitiendo acceder a ambas simultáneamente. La arquitectura Von Neumann usa una única memoria compartida.",expOpts:["Falso: eso describe la arquitectura Von Neumann.","Correcto: Harvard separa la memoria de datos de la de instrucciones para mayor rendimiento.","Falso: son arquitecturas distintas; Harvard no es variante de Von Neumann.","Falso: Harvard tiene dos memorias separadas, no tres."]},
{id:82,year:2019,section:"Reserva P1",anulada:false,q:"¿Cuál es la funcionalidad de la herramienta 'FACILITA'?",opts:["Una herramienta de la AEPD para el tratamiento de datos personales de escaso riesgo.","Una herramienta ofrecida por la AP para facilitar la adecuación para personas con movilidad reducida.","Una aplicación de código abierto que facilita la visualización de contenidos multimedia.","Una aplicación para móviles de la AEAT para generar y presentar la declaración de la renta."],answer:0,explanation:"FACILITA es la herramienta de la Agencia Española de Protección de Datos (AEPD) para ayudar a organizaciones con tratamientos de datos de bajo riesgo a cumplir con el RGPD.",expOpts:["Correcto: FACILITA es la herramienta de la AEPD para tratamientos de datos de escaso riesgo.","Falso: no tiene relación con movilidad reducida.","Falso: no es una herramienta de multimedia.","Falso: la declaración de la renta es competencia de la AEAT con Renta WEB, no FACILITA."]},
{id:83,year:2019,section:"Reserva P1",anulada:false,q:"En JAVA podemos utilizar el interface PreparedStatement para:",opts:["Inicializar las variables locales del programa con valores preestablecidos.","Preparar los valores que introduciremos en un archivo de texto externo.","Permitir ejecutar muchas veces una sentencia SQL.","Administrar el consumo de memoria que utilizan los objetos creados."],answer:2,explanation:"PreparedStatement en JDBC es una sentencia SQL precompilada que puede ejecutarse múltiples veces con distintos parámetros. Mejora el rendimiento y protege contra inyección SQL.",expOpts:["Falso: no tiene relación con la inicialización de variables.","Falso: no tiene relación con archivos de texto.","Correcto: PreparedStatement permite precompilar y reutilizar sentencias SQL múltiples veces.","Falso: no tiene relación con la administración de memoria."]},
{id:84,year:2019,section:"Reserva P1",anulada:false,q:"Para valorar el nivel de disponibilidad y seguridad de un CPD, el estándar ANSI EIA/TIA 942 estableció:",opts:["Cuatro niveles, siendo TIER I el de mayor disponibilidad y TIER IV el de menor.","Tres niveles, siendo TIER I el de mayor disponibilidad y TIER III el de menor.","Tres niveles, siendo TIER I el de menor disponibilidad y TIER III el de mayor.","Cuatro niveles, siendo TIER I el de menor disponibilidad y TIER IV el de mayor."],answer:3,explanation:"El estándar TIA-942 establece 4 niveles TIER. TIER I es el más básico (99,671% disponibilidad) y TIER IV el más robusto (99,995% disponibilidad).",expOpts:["Falso: TIER I es el de menor disponibilidad, no el de mayor.","Falso: son 4 niveles, no 3.","Falso: son 4 niveles, no 3.","Correcto: 4 niveles TIER, siendo TIER I el menor y TIER IV el de mayor disponibilidad."]},
{id:85,year:2019,section:"Reserva P1",anulada:false,q:"Indique cuál de las siguientes características de JavaScript es INCORRECTA:",opts:["Es imperativo y dinámico.","Proporciona funciones de segunda clase.","Es débilmente tipado.","Está basado en prototipos."],answer:1,explanation:"JavaScript proporciona funciones de PRIMERA clase: las funciones pueden asignarse a variables, pasarse como parámetros y devolverse desde otras funciones.",expOpts:["Correcto: JavaScript es imperativo y dinámico. No es la incorrecta.","INCORRECTA: JavaScript tiene funciones de primera clase, no de segunda.","Correcto: JavaScript es débilmente tipado. No es la incorrecta.","Correcto: JavaScript está basado en prototipos. No es la incorrecta."]},
{id:86,year:2019,section:"Supuesto I",anulada:false,q:"Se necesita presentar una estadística en HTML5. ¿Qué etiqueta se usa para la celda de encabezado de tabla con formato de letra diferenciado?",opts:["<th>Proceso</th>","<tableheader>Proceso</tableheader>","<theader>Proceso</theader>","<tableh>Proceso</tableh>"],answer:0,explanation:"La etiqueta <th> (table header) define una celda de encabezado de tabla. Los navegadores la muestran en negrita y centrada por defecto.",expOpts:["Correcto: <th> es la etiqueta HTML estándar para celdas de encabezado de tabla.","<tableheader> no es una etiqueta HTML válida.","<theader> no es una etiqueta HTML válida.","<tableh> no es una etiqueta HTML válida."]},
{id:87,year:2019,section:"Supuesto I",anulada:false,q:"¿Cuál es el código HTML5 correcto para una lista anidada (opositor con dos notas)?",opts:["<ul><li>Opositor<ul><li>Nota 1</li><li>Nota 2</li></ul></li></ul>","<ul><li>Opositor</li></ul><ul><li>Nota 1</li><li>Nota 2</li></ul>","<ul><li1>Opositor</li1><li2>Nota 1</li2><li2>Nota 2</li2></ul>","<ul><li>Opositor<li>Nota 1</li><li>Nota 2</li></li></ul>"],answer:0,explanation:"Para listas anidadas en HTML, la sublista <ul> debe estar dentro del <li> padre. La sublista de notas debe ir antes del cierre </li> del opositor.",expOpts:["Correcto: la sublista <ul> con las notas está correctamente anidada dentro del <li>Opositor.","Falso: las dos listas son independientes, no anidadas.","Falso: <li1> y <li2> no son etiquetas HTML válidas.","Falso: el cierre </li> tiene posición incorrecta."]},
{id:88,year:2019,section:"Supuesto I",anulada:false,q:"Para forzar la introducción del nombre como campo obligatorio en un formulario HTML, ¿cuál es el código correcto?",opts:["<input type=\"text\" name=\"username\" required/>","<input type=\"text\" name=\"username\" enforced/>","<input type=\"text\" name=\"username\" mandatory/>","<input type=\"text\" name=\"username\" compulsory/>"],answer:0,explanation:"El atributo 'required' de HTML5 marca un campo como obligatorio. El navegador valida que no esté vacío antes de enviar el formulario.",expOpts:["Correcto: el atributo HTML5 'required' hace que el campo sea obligatorio.","'enforced' no es un atributo HTML válido.","'mandatory' no es un atributo HTML válido.","'compulsory' no es un atributo HTML válido."]},
{id:89,year:2019,section:"Supuesto I",anulada:false,q:"Se quiere aplicar color verde a todos los elementos <a> hijos de <li>. ¿Cuál es el código CSS adecuado?",opts:["li.a {color: green;}","li>a {color: green;}","li#a {color: green;}","li_a {color: green;}"],answer:1,explanation:"El selector CSS 'li>a' selecciona los elementos <a> que son hijos DIRECTOS de <li>. El símbolo > es el combinador de hijo directo.",expOpts:["li.a seleccionaría elementos <li> con la clase 'a', no elementos <a> hijos de <li>.","Correcto: li>a selecciona elementos <a> hijos directos de <li>.","li#a seleccionaría elementos <li> con el id 'a'.","li_a no es un selector CSS válido."]},
{id:90,year:2019,section:"Supuesto I",anulada:false,q:"¿Cuál es el código CSS correcto para aplicar Flexbox a un div con id='principal'?",opts:["div#principal {display: flex;}","div#principal {display: flexbox;}","div#principal {display: flex-container;}","div#principal {display:flexible;}"],answer:0,explanation:"Para activar Flexbox en CSS se usa 'display: flex' en el elemento contenedor. El valor correcto es 'flex'.",expOpts:["Correcto: 'display: flex' activa el modelo de caja flexible (Flexbox).","'display: flexbox' no es un valor válido de la propiedad display.","'display: flex-container' no es un valor válido.","'display: flexible' no es un valor válido."]},
{id:91,year:2019,section:"Supuesto I",anulada:false,q:"¿Cuál de los siguientes XML está bien formado?",opts:["<Opositor>Winston Churchill<Nota1>95</nota1></opositor>","<Opositor>Winston Churchill<Nota1>95</Nota1><Nota2>65</Opositor></Nota2>","<Opositor>Winston Churchill<Nota1/>95<Nota2/>65</Opositor>","<Opositor>Winston Churchill<Nota1>95</><Nota2>65</></>"],answer:2,explanation:"En XML bien formado, las etiquetas deben coincidir exactamente (incluyendo mayúsculas/minúsculas) y estar correctamente anidadas. La opción c usa elementos vacíos seguidos de texto, lo cual es válido.",expOpts:["Falso: 'nota1' en minúscula no coincide con 'Nota1'. XML distingue mayúsculas.","Falso: las etiquetas están mal anidadas.","Correcto: <Nota1/>95 es una etiqueta vacía seguida de texto; el XML está bien formado.","Falso: </> no es una etiqueta de cierre válida en XML."]},
{id:92,year:2019,section:"Supuesto I",anulada:false,q:"¿Cuál sería un fichero JSON válido?",opts:["{\"nombre\": \"Juana\", \"apellido\": \"Ruiz\"}","{'nombre': 'Juana', 'apellido': 'Ruiz'}","{nombre: \"Juana\", apellido: \"Ruiz\"}","{nombre: \"Juana\"; apellido: \"Ruiz\"}"],answer:0,explanation:"JSON requiere comillas dobles para claves y strings, y coma como separador entre pares.",expOpts:["Correcto: JSON válido con comillas dobles en claves y valores, y coma como separador.","Falso: JSON no acepta comillas simples; deben ser comillas dobles.","Falso: las claves deben ir siempre entre comillas dobles en JSON.","Falso: el separador es coma (,) no punto y coma (;)."]},
{id:93,year:2019,section:"Supuesto I",anulada:false,q:"¿Qué valor devuelve esta función JavaScript? function prueba(){var i=1;var j=0;while(i<7){j+=i;i+=2;}return j;}",opts:["2","9","6","0"],answer:1,explanation:"Iteraciones: i=1,j=1 → i=3,j=4 → i=5,j=9 → i=7 (sale del bucle). El resultado es j=9 (1+3+5=9).",expOpts:["Falso: no es 2.","Correcto: la función devuelve 9 (suma de 1+3+5 cuando i va de 1 a 5 en pasos de 2).","Falso: no es 6.","Falso: no es 0."]},
{id:94,year:2019,section:"Supuesto I",anulada:false,q:"En Python, ¿cómo asignaría a 'notaSegundoEjercicio' el valor 36 del diccionario opositor = {'nombre': 'Sandra Gomez', 'notas': [27, 36, 12]}?",opts:["notaSegundoEjercicio = opositor.notas.Value.Item2","notaSegundoEjercicio = opositor['notas'][1]","notaSegundoEjercicio = opositor.Key[notas].Value[1]","notaSegundoEjercicio = opositor(notas(2))"],answer:1,explanation:"En Python, opositor['notas'] accede a la lista de notas, y [1] accede al segundo elemento (índice 0=27, 1=36).",expOpts:["Falso: sintaxis de C#, no Python.","Correcto: opositor['notas'][1] accede al segundo elemento de la lista de notas (índice 1 = 36).","Falso: sintaxis incorrecta.","Falso: en Python los accesos son con corchetes, no paréntesis."]},
{id:95,year:2019,section:"Supuesto I",anulada:false,q:"¿Cuál de las siguientes podría ser una librería válida de Machine Learning para Python?",opts:["Keras","Yum","Mahotas","Openpyxl"],answer:0,explanation:"Keras es una librería de deep learning para Python, que funciona sobre TensorFlow. Yum es un gestor de paquetes Linux, Mahotas es de visión por computador y Openpyxl para Excel.",expOpts:["Correcto: Keras es una librería de Machine Learning / Deep Learning para Python.","Yum es el gestor de paquetes de distribuciones Linux basadas en RPM.","Mahotas es para procesamiento de imagen, no ML general.","Openpyxl es para leer y escribir archivos Excel, no de Machine Learning."]},
{id:96,year:2019,section:"Supuesto I",anulada:false,q:"Se detecta un bucle en Java que concatena muchas cadenas penalizando el rendimiento. ¿Qué clase habría que utilizar?",opts:["StringConcat","StringConstruct","StringBuilder","StringCreator"],answer:2,explanation:"StringBuilder es la clase de Java para construcción eficiente de cadenas. La concatenación con + crea objetos String nuevos en cada operación. StringBuilder usa un buffer mutable, mucho más eficiente en bucles.",expOpts:["StringConcat no existe en java.lang.","StringConstruct no existe en java.lang.","Correcto: StringBuilder es la clase eficiente para concatenar cadenas en Java.","StringCreator no existe en java.lang."]},
{id:135,year:2019,section:"Supuesto I",anulada:false,q:"¿Cómo debe definir una clase Ejercicio en Java si quiere impedir que se pueda heredar de la misma?",opts:["closed class Ejercicio","final class Ejercicio","private class Ejercicio","immutable class Ejercicio"],answer:1,explanation:"En Java, el modificador 'final' aplicado a una clase impide que otras clases hereden de ella. Es el mecanismo estándar para sellar la jerarquía de herencia.",expOpts:["'closed' no es un modificador de clase en Java.","Correcto: 'final class Ejercicio' impide la herencia en Java.","'private' se aplica a miembros de clase, no a clases de nivel superior para bloquear herencia.","'immutable' no es un modificador de clase en Java."]},
{id:97,year:2019,section:"Supuesto I",anulada:false,q:"En C# debe crear un SqlConnection y que se llame al método Dispose al final del bloque. ¿Qué instrucción usar?",opts:["using (SqlConnection conn = new SqlConnection(connString)) {conn.Open();}","scope (SqlConnection conn = new SqlConnection(connString)) {conn.Open();}","dispose (SqlConnection conn = new SqlConnection(connString)) {conn.Open();}","internal (SqlConnection conn = new SqlConnection(connString)) {conn.Open();}"],answer:0,explanation:"La instrucción 'using' en C# garantiza que Dispose() se llame automáticamente al salir del bloque, incluso si ocurre una excepción. Es el patrón estándar para gestionar recursos.",expOpts:["Correcto: el bloque 'using' en C# llama automáticamente a Dispose() al finalizar.","'scope' no es una instrucción válida de C# para este propósito.","'dispose' no es una instrucción de bloque en C#.","'internal' es un modificador de acceso en C#, no una instrucción de bloque."]},
{id:98,year:2019,section:"Supuesto I",anulada:false,q:"¿Cuál es la forma correcta de definir un array de enteros en C#?",opts:["int[] arrayEnteros = new {1, 2, 3};","int arrayEnteros[] = new() {1, 2, 3};","int[] arrayEnteros = new[] {1, 2, 3};","int arrayEnteros[] = new {1, 2, 3};"],answer:2,explanation:"En C#, la sintaxis correcta es: tipo[] nombre = new[] {valores}. Los corchetes van después del tipo, no del nombre.",expOpts:["Falso: falta el tipo o [] después de 'new'.","Falso: en C# los corchetes van después del tipo (int[]), no después del nombre.","Correcto: int[] arrayEnteros = new[] {1, 2, 3} es la sintaxis correcta en C#.","Falso: en C# los corchetes van después del tipo, no del nombre."]},
{id:99,year:2019,section:"Supuesto I",anulada:false,q:"Una tabla tiene el registro {NIF, Nombre, PrimerApellido, SegundoApellido, Direccion, Telefonos:'916666666;917777777'}. ¿En qué forma normal está?",opts:["En primera forma normal.","En segunda forma normal.","En tercera forma normal.","No está en ninguna forma normal."],answer:3,explanation:"El campo 'Telefonos' contiene múltiples valores (no atómico), lo que viola la 1FN que exige que todos los atributos sean atómicos.",expOpts:["Falso: el campo Telefonos viola la 1FN al contener múltiples valores.","Falso: si no está en 1FN, tampoco puede estar en 2FN.","Falso: si no está en 1FN, tampoco puede estar en 3FN.","Correcto: el campo Telefonos no atómico viola la 1FN. No está en ninguna FN."]},
{id:100,year:2019,section:"Supuesto I",anulada:false,q:"El campo IdFormaAcceso es char(1) con valores 'L' o 'P'. ¿Qué instrucción SQL obtiene un listado con el nombre descriptivo de la Forma de Acceso?",opts:["SELECT IdProceso, IF IdFormaAcceso = 'L' THEN 'Ingreso Libre' ELSE 'Promocion Interna' ENDIF AS FormaAcceso FROM Proceso","SELECT IdProceso, CASE IdFormaAcceso WHEN 'L' THEN 'Ingreso Libre' WHEN 'P' THEN 'Promocion Interna' END AS FormaAcceso FROM Proceso","SELECT IdProceso, SWITCH IdFormaAcceso ('L' = 'Ingreso Libre', 'P' = 'Promocion Interna') AS FormaAcceso FROM Proceso","SELECT IdProceso, IIF(IdFormaAcceso, 'L' = 'Ingreso Libre', 'P' = 'Promocion Interna') AS FormaAcceso FROM Proceso"],answer:1,explanation:"La expresión CASE WHEN es el estándar SQL para lógica condicional en consultas.",expOpts:["Falso: IF...THEN...ENDIF no es sintaxis SQL estándar ANSI.","Correcto: CASE columna WHEN valor THEN resultado END es la sintaxis SQL estándar.","Falso: SWITCH no existe en SQL estándar.","Falso: IIF no es sintaxis SQL estándar ANSI."]},
{id:101,year:2019,section:"Supuesto I",anulada:false,q:"¿Qué sentencia SQL obtiene los IdOpositor que tienen más de una entrada en la tabla Solicitud?",opts:["SELECT IdOpositor, COUNT(IdSolicitud) AS Num FROM Solicitud GROUP BY IdOpositor WHERE Num > 1","SELECT IdOpositor, IdSolicitud FROM Solicitud WHERE COUNT(IdSolicitud) > 1","SELECT IdOpositor, COUNT(IdSolicitud) FROM Solicitud WHERE COUNT(IdSolicitud) > 1 GROUP BY IdOpositor","SELECT IdOpositor, COUNT(IdSolicitud) FROM Solicitud GROUP BY IdOpositor HAVING COUNT(IdSolicitud) > 1"],answer:3,explanation:"HAVING filtra sobre funciones de agrupación. WHERE filtra filas antes de agrupar; HAVING filtra grupos después de agrupar. Para filtrar por COUNT, se usa HAVING.",expOpts:["Falso: WHERE no puede usarse con alias de funciones de agregación ni filtrar sobre COUNT directamente.","Falso: COUNT no puede usarse en la cláusula WHERE.","Falso: COUNT no puede usarse en la cláusula WHERE en SQL estándar.","Correcto: HAVING COUNT(IdSolicitud) > 1 filtra los grupos con más de una solicitud."]},
{id:102,year:2019,section:"Supuesto I",anulada:false,q:"¿Con qué instrucción ANSI SQL incrementaría un diez por ciento el valor de la columna Duracion para todos los registros de la tabla Ejercicio?",opts:["UPDATE Duracion = Duracion + (0.10 * Duracion) FROM Ejercicio","UPDATE Ejercicio SET Duracion = Duracion * 1.1","UPDATE TABLE Ejercicio (Duracion = Duracion + 10%)","UPDATE SET Duracion *= 1.10 FROM Ejercicio"],answer:1,explanation:"La sintaxis ANSI SQL para UPDATE es: UPDATE tabla SET columna = expresión. 'Duracion * 1.1' incrementa un 10%.",expOpts:["Falso: la sintaxis correcta es UPDATE tabla SET columna = valor.","Correcto: UPDATE Ejercicio SET Duracion = Duracion * 1.1 incrementa Duración un 10%.","Falso: UPDATE TABLE no es sintaxis ANSI SQL.","Falso: '*=' no es un operador SQL estándar."]},
{id:103,year:2019,section:"Supuesto I",anulada:false,q:"Si el campo DNI es char(9), ¿cuál es la instrucción SQL para obtener los registros cuyo DNI empieza por 3?",opts:["SELECT * FROM Opositor WHERE DNI = 3*","SELECT * FROM Opositor WHERE DNI IN ('3.')","SELECT * FROM Opositor WHERE DNI LIKE '3%'","SELECT DNI(3*) FROM Opositor"],answer:2,explanation:"El operador LIKE con el comodín % permite buscar patrones. '3%' significa 'empieza por 3, seguido de cualquier cadena'.",expOpts:["Falso: '= 3*' no es sintaxis SQL válida.","Falso: IN se usa para listas de valores exactos, no para patrones.","Correcto: LIKE '3%' busca todos los DNI que empiecen por '3'.","Falso: DNI(3*) no es sintaxis SQL válida."]},
{id:104,year:2019,section:"Supuesto I",anulada:false,q:"Como repositorio de código se utiliza Git. ¿Qué comando muestra una lista de los commits anteriores?",opts:["git commit","git fetch","git status","git log"],answer:3,explanation:"git log muestra el historial de commits del repositorio, incluyendo hash, autor, fecha y mensaje de cada commit.",expOpts:["git commit crea un nuevo commit; no muestra el historial.","git fetch descarga cambios del repositorio remoto sin integrarlos.","git status muestra el estado del directorio de trabajo actual.","Correcto: git log muestra el historial de commits."]},
{id:105,year:2019,section:"Reserva SI",anulada:false,q:"Para el código HTML <h1 id='titulo'>Primer ejercicio TAI</h1>, ¿cuál es el código JavaScript para obtener la cadena 'Primer ejercicio TAI'?",opts:["var titulo = document.getElementById(\"titulo\").firstChild.nodeValue;","var titulo = document.titulo.InnerHTML;","var titulo = document.getElement(\"h1\").InnerText;","var titulo = document.children[0].getValue();"],answer:0,explanation:"getElementById obtiene el elemento por su id. firstChild accede al primer nodo hijo (el texto). nodeValue obtiene el valor del nodo de texto.",expOpts:["Correcto: getElementById('titulo').firstChild.nodeValue obtiene el texto del nodo hijo del elemento.","Falso: document.titulo no es la forma estándar; además InnerHTML está mal escrito.","Falso: getElement() no es un método válido del DOM.","Falso: document.children[0] sería el elemento <html>, no el h1."]},
{id:106,year:2019,section:"Reserva SI",anulada:false,q:"¿Cuál es el propósito principal del framework de JavaScript Jest?",opts:["Testeado de código.","Machine learning.","Animación y efectos gráficos.","Funciones matemáticas y tratamiento de cadenas."],answer:0,explanation:"Jest es un framework de pruebas (testing) para JavaScript desarrollado por Meta. Es ampliamente usado para pruebas unitarias y de integración.",expOpts:["Correcto: Jest es un framework de testing (pruebas) para JavaScript.","Falso: Jest no tiene relación con machine learning.","Falso: Jest no es para animaciones.","Falso: Jest no es para funciones matemáticas."]},
{id:107,year:2019,section:"Reserva SI",anulada:false,q:"¿Cuál es un framework para desarrollo web en Python?",opts:["Django","Keras","Pip","Numpy"],answer:0,explanation:"Django es el framework web más popular de Python, junto con Flask y FastAPI. Pip es el gestor de paquetes, Keras es de ML y NumPy es computación científica.",expOpts:["Correcto: Django es el framework web más popular de Python.","Keras es una librería de Machine Learning, no un framework web.","Pip es el gestor de paquetes de Python, no un framework web.","NumPy es para computación numérica, no un framework web."]},
{id:108,year:2019,section:"Reserva SI",anulada:false,q:"¿Qué mostrará este fragmento HTML5?: <video controls><source src='movie.mp4' type='video/mp4'><source src='movie.ogg' type='video/ogg'>No soportado</video>",opts:["Se mostrarán los dos vídeos 'movie.mp4' y 'movie.ogg'.","Se mostrará el mensaje 'No soportado' en todos los casos.","Se mostrará el vídeo 'movie.mp4' si el navegador soporta el formato mp4.","No se mostrará nada porque el código no está bien formado."],answer:2,explanation:"El elemento <video> intenta reproducir las fuentes en orden. Si el navegador soporta mp4, usa ese. Solo reproduce la primera fuente compatible.",expOpts:["Falso: no se reproducen ambos vídeos simultáneamente.","Falso: el mensaje 'No soportado' solo aparece si el navegador no soporta ningún formato.","Correcto: el navegador reproduce el primer formato compatible (mp4 si lo soporta).","Falso: el código HTML está bien formado."]},
{id:109,year:2019,section:"Reserva SI",anulada:false,q:"Un usuario introduce '100 OR 1=1' en el campo 'Número de opositor'. ¿Qué técnica está utilizando?",opts:["Denial of Service.","Phishing","Malware attack.","SQL Injection."],answer:3,explanation:"SQL Injection: el atacante inserta código SQL en campos de entrada para manipular las consultas de la base de datos. '100 OR 1=1' hace que la condición sea siempre verdadera.",expOpts:["Denial of Service busca saturar un servicio, no infiltrar código SQL.","Phishing engaña para revelar credenciales, no manipula bases de datos directamente.","Malware es software malicioso que se instala en el sistema.","Correcto: '100 OR 1=1' es un ataque de SQL Injection clásico."]},
{id:110,year:2019,section:"Supuesto II",anulada:false,q:"El equipo asigna la red 10.0.4.0 con la máscara 255.255.255.128. ¿Cuántos bits tiene la máscara de red?",opts:["24","26","25","23"],answer:2,explanation:"La máscara 255.255.255.128 en binario: 11111111.11111111.11111111.10000000 = 25 bits a 1. Es una máscara /25.",expOpts:["Falso: /24 sería 255.255.255.0.","Falso: /26 sería 255.255.255.192.","Correcto: 255.255.255.128 = /25 (25 bits a 1 en la máscara).","Falso: /23 sería 255.255.254.0."]},
{id:111,year:2019,section:"Supuesto II",anulada:false,q:"¿A qué Clase pertenece la red asignada (10.0.4.0)?",opts:["Clase A.","Clase B.","Clase C.","Clase D."],answer:0,explanation:"Las redes de Clase A tienen el primer octeto entre 1 y 127. La red 10.x.x.x pertenece a Clase A.",expOpts:["Correcto: 10.x.x.x pertenece a Clase A (primer octeto 1-127).","Clase B: primer octeto 128-191.","Clase C: primer octeto 192-223.","Clase D: 224-239, reservada para multicast."]},
{id:112,year:2019,section:"Supuesto II",anulada:false,q:"Para la CHT con el direccionamiento 10.0.0.0/21, ¿cuál es el número máximo de hosts disponible?",opts:["1024","2046","32","256"],answer:1,explanation:"/21 significa 11 bits de host. 2^11 = 2048 direcciones totales. Restando red y broadcast: 2048 - 2 = 2046 hosts.",expOpts:["Falso: 1024 = 2^10, correspondería a /22.","Correcto: /21 da 2^11 - 2 = 2046 hosts.","Falso: 32 es demasiado pequeño.","Falso: 256 = 2^8, correspondería a /24."]},
{id:113,year:2019,section:"Supuesto II",anulada:false,q:"Dado el direccionamiento 10.0.0.0/21, ¿cuál es el rango de hosts?",opts:["10.0.3.1 - 10.0.3.254","10.0.0.1 - 10.0.0.254","10.0.3.0 - 10.0.3.255","10.0.0.1 - 10.0.7.254"],answer:3,explanation:"La red 10.0.0.0/21 va desde 10.0.0.0 (red) hasta 10.0.7.255 (broadcast). El rango de hosts válidos es de 10.0.0.1 a 10.0.7.254.",expOpts:["Falso: eso es solo una subred /24 dentro del rango.","Falso: eso solo cubre /24.","Falso: 10.0.3.0 es una dirección de red, no host válido.","Correcto: el rango de hosts de 10.0.0.0/21 es de 10.0.0.1 a 10.0.7.254."]},
{id:114,year:2019,section:"Supuesto II",anulada:false,q:"La DCM no puede especificar la versión de RHEL. ¿Qué comando ejecutar para saber la versión?",opts:["rm -f /etc/redhat-release","cat /etc/redhat-version","cat /etc/redhat-release","mv /etc/redhat-release"],answer:2,explanation:"El fichero /etc/redhat-release contiene la información de la versión de Red Hat o derivadas. El comando cat muestra su contenido.",expOpts:["Falso: rm -f borraría el fichero.","Falso: el fichero se llama redhat-release, no redhat-version.","Correcto: cat /etc/redhat-release muestra la versión de RHEL.","Falso: mv movería el fichero, no lo mostraría."]},
{id:115,year:2019,section:"Supuesto II",anulada:false,q:"Para poner una ruta persistente en Solaris a la red 10.0.5.0/24 con gateway 10.0.5.150, ¿cuál es el comando correcto?",opts:["route -p add -net 10.0.5.0/24 -gateway 10.0.5.150","route new -p -net 10.0.5.0/24 -gateway 10.0.5.150","route -static add -net 10.0.5.0/24 -gateway 10.0.5.150","route add -static -net 10.0.5.0/24 -gateway 10.0.5.150"],answer:0,explanation:"En Solaris, 'route -p' hace la ruta persistente entre reinicios. Sintaxis: route -p add -net red/prefijo -gateway gateway.",expOpts:["Correcto: route -p add -net 10.0.5.0/24 -gateway 10.0.5.150 añade una ruta persistente en Solaris.","Falso: 'route new' no es la sintaxis correcta.","Falso: '-static' no es el parámetro correcto para Solaris.","Falso: 'route add -static' no es la sintaxis de Solaris."]},
{id:116,year:2019,section:"Supuesto II",anulada:false,q:"Se está realizando una auditoría en un servidor Linux. ¿Dónde se guardan las contraseñas encriptadas de los usuarios?",opts:["/etc/passwd","/etc/users","/etc/shadow","/etc/groups"],answer:2,explanation:"En Linux moderno, /etc/shadow almacena las contraseñas cifradas. /etc/passwd solo contiene una 'x' en el campo de contraseña.",expOpts:["/etc/passwd contiene info de usuarios pero NO las contraseñas en texto cifrado (solo 'x').","/etc/users no existe en Linux estándar.","/etc/shadow almacena las contraseñas cifradas con permisos restrictivos.","/etc/groups contiene información de los grupos del sistema, no contraseñas."]},
{id:117,year:2019,section:"Supuesto II",anulada:false,q:"¿Qué consulta puede hacer en la base de datos Oracle para conocer la versión?",opts:["SELECT * FROM V$VERSION","SELECT * FROM V$VERSIONADO","SELECT * FROM V$VERSIONDB","SELECT * FROM V$VERSIONTABLE"],answer:0,explanation:"V$VERSION es la vista del sistema de Oracle que muestra la versión del motor de base de datos y sus componentes.",expOpts:["Correcto: SELECT * FROM V$VERSION muestra la versión de Oracle.","Falso: V$VERSIONADO no es una vista de Oracle.","Falso: V$VERSIONDB no es una vista de Oracle.","Falso: V$VERSIONTABLE no es una vista de Oracle."]},
{id:118,year:2019,section:"Supuesto II",anulada:false,q:"Se necesita crear un backup del directorio /home/opositor/temas/ comprimido con gzip en RHEL. ¿Cuál es el comando correcto?",opts:["tar -czf TEMAS.tar.gz /home/opositor/temas/","tar -xzf TEMAS.tar.gz /home/opositor/temas/","tar -xzf /home/opositor/temas/ TEMAS.tar.gz","tar -cjf /home/opositor/temas/ TEMAS.tar.gz"],answer:0,explanation:"Opciones de tar: -c crea, -z comprime con gzip, -f especifica el nombre del fichero. -x extrae, -j usa bzip2.",expOpts:["Correcto: tar -czf crea (-c) un archivo gzip (-z) con el nombre especificado (-f).","Falso: -x extrae en lugar de crear.","Falso: -x extrae y el orden de argumentos es incorrecto.","Falso: -j usa compresión bzip2, no gzip."]},
{id:119,year:2019,section:"Supuesto II",anulada:false,q:"¿Qué comando de Windows muestra las cuentas de usuario que pertenecen al grupo Administradores locales?",opts:["net local administradores","net localgroup admin","net local admin","net localgroup administradores"],answer:3,explanation:"El comando 'net localgroup grupo' muestra los miembros de un grupo local en Windows.",expOpts:["Falso: 'net local' no es un comando válido de Windows.","Falso: 'admin' no es el nombre exacto del grupo en Windows en español.","Falso: 'net local' no es un comando válido.","Correcto: 'net localgroup Administradores' muestra los miembros del grupo Administradores local."]},
{id:120,year:2019,section:"Supuesto II",anulada:false,q:"¿Qué comando de Windows muestra la configuración actual de las políticas de cuentas y contraseñas de una máquina local?",opts:["net computer","net localgroup","net config","net accounts"],answer:3,explanation:"'net accounts' muestra las políticas de contraseñas y de bloqueo de cuentas de la máquina local en Windows.",expOpts:["Falso: 'net computer' no es un comando estándar de Windows.","Falso: 'net localgroup' muestra los grupos locales, no las políticas de contraseñas.","Falso: 'net config' muestra la configuración del servidor o workstation.","Correcto: 'net accounts' muestra las políticas de cuentas y contraseñas de Windows."]},
{id:121,year:2019,section:"Supuesto II",anulada:false,q:"Si se dispone de 5 discos duros de 6 TB configurados en RAID 6, ¿qué capacidad neta se obtendrá?",opts:["12 TB","18 TB","24 TB","30 TB"],answer:1,explanation:"RAID 6 usa 2 discos para paridad. Con 5 discos, quedan 3 para datos: 3 × 6 TB = 18 TB netos.",expOpts:["Falso: 12 TB correspondería a 2 discos de datos.","Correcto: RAID 6 con 5 discos de 6TB = (5-2) × 6 = 18 TB netos.","Falso: 24 TB correspondería a 4 discos de datos.","Falso: 30 TB sería la capacidad bruta total sin RAID."]},
{id:122,year:2019,section:"Supuesto II",anulada:false,q:"Tienen Docker instalado y quieren arrancar un Windows Server 2008 a partir de una imagen llamada SW2008. ¿Con qué sentencia?",opts:["docker run SW2008","docker start SW2008","start docker SW2008","docker start run SW2008"],answer:0,explanation:"'docker run' crea y arranca un contenedor desde una imagen. 'docker start' arranca un contenedor existente que está parado.",expOpts:["Correcto: 'docker run imagen' crea y arranca un nuevo contenedor desde la imagen.","Falso: 'docker start' inicia un contenedor existente detenido, no crea uno nuevo.","Falso: 'start docker' no es un comando válido de Docker.","Falso: 'docker start run' no es un comando válido de Docker."]},
{id:123,year:2019,section:"Supuesto II",anulada:false,q:"¿Qué comando utilizaría para listar todos los contenedores Docker, estén o no en marcha?",opts:["docker ps","docker ps -a","docker list","docker list-container -all"],answer:1,explanation:"'docker ps' muestra solo los contenedores en ejecución. 'docker ps -a' (--all) muestra todos los contenedores, incluyendo los parados.",expOpts:["docker ps sin opciones muestra solo los contenedores en ejecución.","Correcto: docker ps -a muestra todos los contenedores (ejecutando y parados).","'docker list' no es un comando válido de Docker.","'docker list-container -all' no es un comando válido de Docker."]},
{id:124,year:2019,section:"Supuesto II",anulada:false,q:"Tienen una sonda de 70W que necesita encenderse remotamente por red. ¿Sería posible hacerlo con PoE?",opts:["No, no sería posible.","Sí, mediante PoE IEEE 802.3ct","Sí, mediante PoE IEEE 802.3bt","Sí, mediante PoE IEEE 802.3dt"],answer:2,explanation:"IEEE 802.3bt (PoE++) puede suministrar hasta 90-100W por cable Ethernet, suficiente para los 70W de la sonda. 802.3ct y 802.3dt no son estándares reales.",expOpts:["Falso: sí es posible con PoE de alta potencia.","Falso: IEEE 802.3ct no es un estándar PoE real.","Correcto: IEEE 802.3bt (PoE++) suministra hasta 90-100W, suficiente para la sonda de 70W.","Falso: IEEE 802.3dt no es un estándar PoE real."]},
{id:125,year:2019,section:"Supuesto II",anulada:false,q:"La DCM necesita una conexión Ethernet de 30 Gbps. Según ANSI/TIA-568, ¿qué categoría de cableado necesitaría?",opts:["Categoría 6.","Categoría 7.","Categoría 7A.","Categoría 8."],answer:3,explanation:"Para velocidades de 25-40 Gbps se requiere Categoría 8 (Cat 8). Cat 6 soporta 10 Gbps, Cat 7/7A hasta 10 Gbps con mejor apantallamiento.",expOpts:["Cat 6 soporta hasta 10 Gbps en cortas distancias.","Cat 7 soporta hasta 10 Gbps con mejor apantallamiento.","Cat 7A soporta hasta 10 Gbps.","Correcto: Cat 8 es la categoría certificada por TIA-568 para 25-40 Gbps."]},
{id:126,year:2019,section:"Supuesto II",anulada:false,q:"Algunos equipos Windows no tienen habilitado el firewall. ¿Qué comando lo habilitaría?",opts:["netsh advfirewall set allprofiles enable","netsh advfirewall set allprofiles state on","netsh advfirewall set allprofiles state online","netsh advfirewall set allprofiles on"],answer:1,explanation:"El comando correcto para habilitar el firewall en todos los perfiles es: netsh advfirewall set allprofiles state on.",expOpts:["Falso: 'enable' no es la palabra clave correcta; es 'state on'.","Correcto: netsh advfirewall set allprofiles state on activa el firewall en todos los perfiles.","Falso: 'state online' no es la sintaxis correcta.","Falso: falta la palabra 'state' antes de 'on'."]},
{id:127,year:2019,section:"Supuesto II",anulada:false,q:"Se decide implantar un IPS que analice el comportamiento de la red para detectar ataques DoS y malwares. ¿Qué tipo de IPS necesita?",opts:["DIPS","WIPS","NBA","HIPS"],answer:2,explanation:"NBA (Network Behavior Analysis) analiza el comportamiento del tráfico de red para detectar anomalías como DDoS y malware. HIPS es basado en host, WIPS en wireless.",expOpts:["DIPS no es un tipo estándar de IPS reconocido.","WIPS protege específicamente redes WiFi.","Correcto: NBA (Network Behavior Analysis) analiza el comportamiento del tráfico de red para detectar anomalías.","HIPS protege un host individual, no la red en general."]},
{id:128,year:2019,section:"Supuesto II",anulada:false,q:"En la DCM están preocupados con SMTP inseguro. Se sugiere usar SMTPS. ¿Qué puerto por defecto usa SMTPS?",opts:["25","465","443","425"],answer:1,explanation:"SMTPS usa el puerto 465 para envío de correo cifrado con SSL/TLS. El puerto 25 es SMTP estándar entre servidores y el 443 es HTTPS.",expOpts:["Falso: el puerto 25 es el SMTP estándar entre servidores, sin cifrado.","Correcto: SMTPS usa el puerto 465 para correo cifrado con SSL/TLS.","Falso: el puerto 443 es el estándar para HTTPS.","Falso: el puerto 425 no es el estándar para SMTPS."]},
{id:129,year:2019,section:"Supuesto II",anulada:false,q:"Han decidido limpiar la caché DNS en equipos Windows. ¿Cuál sería el comando adecuado?",opts:["ifconfig /flushdns","ipconfig /flushdns","ipconfig /cleardns","ifconfig /cleardns"],answer:1,explanation:"En Windows, el comando para vaciar la caché DNS es 'ipconfig /flushdns'. 'ifconfig' es el equivalente en Linux/Unix.",expOpts:["Falso: 'ifconfig' es un comando de Linux/Unix, no de Windows.","Correcto: 'ipconfig /flushdns' limpia la caché DNS en Windows.","Falso: '/cleardns' no es un parámetro válido de ipconfig.","Falso: ifconfig es de Linux y /cleardns no es válido."]},
{id:130,year:2019,section:"Reserva SII",anulada:false,q:"Para permitir acceso por el puerto 4433 TCP a equipos Windows, ¿qué comando añadiría la regla al firewall?",opts:["netsh advfirewall firewall create rule name=\"Inventariado\" dir=in action=allow protocol=TCP localport=4433","netsh advfirewall firewall add rule name=\"Inventariado\" dir=in action=permit protocol=TCP localport=4433","netsh advfirewall firewall add rule name=\"Inventariado\" dir=in action=allow protocol=TCP localport=4433","netsh advfirewall firewall new rule name=\"Inventariado\" dir=in action=allow protocol=TCP localport=4433"],answer:2,explanation:"La sintaxis correcta: netsh advfirewall firewall add rule. El action correcto es 'allow' (no 'permit'). 'create' y 'new' no son subcomandos válidos.",expOpts:["Falso: 'create rule' no es un subcomando válido.","Falso: 'action=permit' no es válido; el valor correcto es 'action=allow'.","Correcto: netsh advfirewall firewall add rule con action=allow es la sintaxis correcta.","Falso: 'new rule' no es un subcomando válido."]},
{id:131,year:2019,section:"Reserva SII",anulada:false,q:"Para comprobar que el puerto 422 está abierto en la IP 10.0.4.22 en RHEL, ¿qué comando usar?",opts:["nc -v - ip 10.0.4.22 -port 422","nc -v 10.0.4.22 422","nc -v 422 10.0.4.22","nc -v 10.0.4.22:422"],answer:1,explanation:"nc (netcat) prueba conexiones TCP/UDP. Sintaxis: nc -v [IP] [puerto]. La opción -v es verbose (modo detallado).",expOpts:["Falso: nc no usa parámetros con guión para IP y puerto.","Correcto: nc -v 10.0.4.22 422 prueba la conectividad al puerto 422 de la IP especificada.","Falso: el orden debe ser IP y luego puerto, no al revés.","Falso: nc no usa la notación IP:puerto con dos puntos."]},
{id:132,year:2019,section:"Reserva SII",anulada:false,q:"El dispositivo más importante de la DCM está cifrado. ¿Qué necesitan para restaurar la copia de seguridad?",opts:["El certificado digital.","La clave de BitLocker.","La clave privada.","La clave de sesión."],answer:1,explanation:"BitLocker es el sistema de cifrado de disco de Windows. Para restaurar una copia de un disco cifrado con BitLocker, se necesita la clave de recuperación de BitLocker.",expOpts:["Falso: un certificado digital no es la credencial necesaria para descifrar BitLocker.","Correcto: la clave de recuperación de BitLocker es necesaria para acceder a un disco cifrado.","Falso: la clave privada es de criptografía asimétrica, no lo que usa BitLocker directamente.","Falso: la clave de sesión es de protocolos de comunicación, no de BitLocker."]},
{id:133,year:2019,section:"Reserva SII",anulada:false,q:"¿Cuántos discos duros son necesarios para crear RAID 10?",opts:["2 discos duros.","3 discos duros.","Al menos 4 discos duros.","Es indiferente."],answer:2,explanation:"RAID 10 (RAID 1+0) combina espejado y striping. Necesita mínimo 4 discos: al menos dos pares espejados en striping.",expOpts:["Falso: con 2 discos solo puedes hacer RAID 1, no RAID 10.","Falso: RAID 10 necesita mínimo 4 discos.","Correcto: RAID 10 necesita mínimo 4 discos (2 pares espejados en striping).","Falso: no es indiferente; el mínimo son 4 discos."]},
{id:134,year:2019,section:"Reserva SII",anulada:false,q:"Las comunicaciones se realizarán mediante SSH. ¿Cuál es el puerto que debe solicitar?",opts:["21","63","69","22"],answer:3,explanation:"El protocolo SSH (Secure Shell) usa el puerto 22 por defecto. El puerto 21 es FTP y el 69 es TFTP.",expOpts:["Falso: el puerto 21 es el estándar para FTP.","Falso: el puerto 63 no es el estándar para SSH.","Falso: el puerto 69 es TFTP (Trivial File Transfer Protocol).","Correcto: SSH usa el puerto 22 por defecto."]}];
const Q2022=[{id:1,year:2022,section:"Primera parte",anulada:false,q:"De acuerdo con el artículo 64 de la Constitución Española de 1978 (en adelante CE), los actos del Rey, excepto la propuesta y el nombramiento del Presidente del Gobierno, y la disolución de las Cámaras prevista en el artículo 99, serán refrendados por:",opts:["Los Presidentes del Congreso y el Senado.","Los Ministros o los Secretarios de Estado en función de la materia.","El Presidente del Gobierno y, en su caso, por los Presidentes del Congreso y el Senado.","El Presidente del Gobierno y, en su caso, por los Ministros competentes."],answer:3,explanation:"El art. 64 CE establece que los actos del Rey son refrendados por el Presidente del Gobierno y, en su caso, por los Ministros competentes.",expOpts:["Falso: los Presidentes de las Cámaras solo refrendan actos muy específicos.","Falso: los Secretarios de Estado no tienen capacidad de refrendo.","Falso: los Presidentes del Congreso y Senado solo refrendan actos muy concretos.","Correcto: el refrendo corresponde al Presidente del Gobierno y los Ministros competentes. Art. 64 CE."]},
{id:2,year:2022,section:"Primera parte",anulada:false,q:"La suspensión de los derechos y libertades se encuentra regulada en la CE en:",opts:["En el Capítulo III del Título I.","En sus artículos 52 y 53.","En el artículo 58.","En el Capítulo V del Título I."],answer:3,explanation:"La suspensión de derechos y libertades se regula en el Capítulo V del Título I de la CE (art. 55): estados de excepción, sitio y casos individuales de terrorismo.",expOpts:["El Capítulo III regula los principios rectores de la política social y económica.","Los arts. 52 y 53 regulan la protección y garantías de los derechos fundamentales.","El art. 58 regula incompatibilidades del cargo de Senador.","Correcto: el Capítulo V del Título I (art. 55) regula la suspensión de derechos y libertades."]},
{id:3,year:2022,section:"Primera parte",anulada:false,q:"Según el artículo 68 de la CE, ¿cuál es la circunscripción electoral en nuestro sistema electoral?",opts:["La provincia.","El municipio.","La Comunidad Autónoma.","Distrito Municipal."],answer:0,explanation:"El art. 68.2 CE establece que la circunscripción electoral para el Congreso de los Diputados es la provincia.",expOpts:["Correcto: la circunscripción electoral del Congreso es la provincia. Art. 68.2 CE.","Falso: el municipio no es la circunscripción del Congreso.","Falso: la Comunidad Autónoma no es la circunscripción del Congreso.","Falso: 'Distrito Municipal' no existe como circunscripción electoral nacional."]},
{id:4,year:2022,section:"Primera parte",anulada:false,q:"Según el artículo 18 de la ley 50/1997, de 27 de noviembre, del Gobierno que regula el funcionamiento del Consejo de Ministros, ¿quién actúa como Secretario de este órgano colegiado?",opts:["El Vicepresidente Primero.","El Ministro portavoz del Gobierno.","El Ministro de la Presidencia.","El Ministro de Justicia."],answer:2,explanation:"El art. 18 de la Ley 50/1997 establece que el Ministro de la Presidencia actúa como Secretario del Consejo de Ministros.",expOpts:["Falso: el Vicepresidente preside en ausencia del Presidente, no actúa como Secretario.","Falso: el Ministro portavoz comunica las decisiones a la prensa.","Correcto: el Ministro de la Presidencia actúa como Secretario del Consejo de Ministros.","Falso: el Ministro de Justicia no actúa como Secretario del Consejo."]},
{id:5,year:2022,section:"Primera parte",anulada:false,q:"De acuerdo con el artículo 78 de la CE, expirado el mandato de las Cortes Generales o en caso de disolución de las mismas, las Diputaciones Permanentes seguirán ejerciendo sus funciones hasta:",opts:["La celebración de las elecciones.","La proclamación de los resultados electorales definitivos.","La elección de los nuevos presidentes de cada una de las Cámaras de las Cortes Generales.","La constitución de las nuevas Cortes Generales."],answer:3,explanation:"Las Diputaciones Permanentes ejercen sus funciones hasta la constitución de las nuevas Cortes, según el art. 78.3 CE.",expOpts:["Falso: no cesan con la convocatoria de elecciones.","Falso: no es la proclamación de resultados el momento de cese.","Falso: la elección de presidentes de Cámara no es el momento del cese.","Correcto: funcionan hasta la constitución de las nuevas Cortes. Art. 78.3 CE."]},
{id:6,year:2022,section:"Primera parte",anulada:false,q:"Según establece el artículo 24 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, el plazo máximo para resolver y notificar la resolución de una reclamación ante el Consejo de Transparencia y Buen Gobierno será de:",opts:["Un mes, transcurrido el cual, la reclamación se entenderá estimada.","Un mes, transcurrido el cual, la reclamación se entenderá desestimada.","Tres meses, transcurrido el cual, la reclamación se entenderá estimada.","Tres meses, transcurrido el cual, la reclamación se entenderá desestimada."],answer:3,explanation:"El art. 24.2 de la Ley 19/2013: el plazo máximo es de tres meses. Transcurrido sin resolución, la reclamación se entiende desestimada (silencio negativo).",expOpts:["Falso: el plazo es de tres meses, no uno.","Falso: el plazo es de tres meses, no uno.","Falso: el silencio es negativo (desestimación), no positivo.","Correcto: tres meses y silencio negativo (desestimación). Art. 24.2 Ley 19/2013."]},
{id:7,year:2022,section:"Primera parte",anulada:false,q:"Señale cuál de los siguientes NO es un compromiso del IV Plan de Gobierno Abierto de España:",opts:["Participación de los jóvenes en políticas públicas.","Protección de denunciantes.","Huella normativa.","Reforma del marco regulatorio."],answer:0,explanation:"El IV Plan de Gobierno Abierto incluye protección de denunciantes, huella normativa y reforma del marco regulatorio. La participación específica de jóvenes no es uno de sus compromisos principales.",expOpts:["Correcto: la participación específica de jóvenes no es un compromiso del IV Plan de Gobierno Abierto.","La protección de denunciantes sí es un compromiso del IV Plan.","La huella normativa sí es un compromiso del IV Plan.","La reforma del marco regulatorio sí es un compromiso del IV Plan."]},
{id:8,year:2022,section:"Primera parte",anulada:false,q:"Conforme establece el artículo 18 de la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas, todas las resoluciones de compatibilidad para desempeñar un segundo puesto o actividad en el sector público o el ejercicio de actividades privadas se inscribirán:",opts:["En el Registro Central de Personal.","En la Oficina de Conflicto de Intereses.","En la Unidad de Personal del Ministerio u Organismo correspondiente.","En los Registros de Personal correspondientes."],answer:3,explanation:"Las resoluciones de compatibilidad deben inscribirse en los Registros de Personal correspondientes a cada Administración o Cuerpo.",expOpts:["Falso: el Registro Central de Personal tiene otras funciones.","Falso: la Oficina de Conflicto de Intereses tiene competencias diferentes.","Falso: no es solo en la Unidad de Personal del Ministerio.","Correcto: se inscriben en los Registros de Personal correspondientes."]},
{id:9,year:2022,section:"Primera parte",anulada:false,q:"De acuerdo con el artículo 30 de la Ley 39/2006, de 14 de diciembre, de Promoción de la Autonomía Personal y Atención a las personas en situación de dependencia, el grado de dependencia será revisable:",opts:["A instancia del interesado.","A instancia de los representantes del interesado.","De oficio por las Administraciones Públicas competentes.","Todas las respuestas anteriores son correctas."],answer:3,explanation:"El grado de dependencia puede revisarse a solicitud del interesado, sus representantes, o de oficio por las AAPP.",expOpts:["Correcta pero incompleta.","Correcta pero incompleta.","Correcta pero incompleta.","Correcto: el grado puede revisarse por cualquiera de las tres vías."]},
{id:10,year:2022,section:"Primera parte",anulada:false,q:"Conforme el artículo 49 de la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres, para impulsar la adopción voluntaria de planes de igualdad, el Gobierno establecerá:",opts:["Medidas de acción positiva, especialmente dirigidas a las pequeñas y las medianas empresas.","Medidas de fomento, especialmente dirigidas a las empresas de 50 o más trabajadores.","Medidas de fomento, especialmente dirigidas a las pequeñas y las medianas empresas.","Medidas de acción positiva, dirigidas a cualquier empresa, sea de capital público o privado."],answer:2,explanation:"El art. 49 de la LO 3/2007 establece medidas de fomento (no de acción positiva), dirigidas especialmente a las PYMES.",expOpts:["Falso: son medidas de fomento, no de acción positiva.","Falso: están dirigidas especialmente a PYMES, no a empresas de 50+ trabajadores.","Correcto: medidas de fomento, especialmente para PYMES. Art. 49 LO 3/2007.","Falso: son medidas de fomento y van dirigidas especialmente a PYMES."]},
{id:11,year:2022,section:"Primera parte",anulada:false,q:"Con carácter general el documento nacional de identidad tendrá un período de validez, a contar desde la fecha de la expedición o de cada una de sus renovaciones, de:",opts:["Dos años cuando el solicitante no haya cumplido los cinco años de edad.","Cuatro años, cuando el titular haya cumplido los cinco años de edad y no haya alcanzado los treinta al momento de la expedición o renovación.","Nueve años, cuando el titular haya cumplido los treinta y no haya alcanzado los setenta.","Permanente cuando el titular haya cumplido los sesenta años."],answer:0,explanation:"RD 1553/2005: 2 años (menores de 5 años), 5 años (de 5 a 30 años), 10 años (de 30 a 70 años), permanente (a partir de 70 años).",expOpts:["Correcto: 2 años de validez para menores de 5 años.","Falso: entre 5 y 30 años la validez es 5 años, no 4.","Falso: entre 30 y 70 años la validez es 10 años, no 9.","Falso: el DNI permanente es para mayores de 70 años, no 60."]},
{id:12,year:2022,section:"Primera parte",anulada:false,q:"De acuerdo con el artículo 4 de la Ley 6/2020, de 11 de noviembre, reguladora de determinados aspectos de los servicios electrónicos de confianza, el periodo de vigencia de los certificados cualificados:",opts:["No será superior a 5 años.","No será superior a 3 años.","Es ilimitado.","No será superior a 6 años."],answer:0,explanation:"La Ley 6/2020 establece en su art. 4 que los certificados electrónicos cualificados tienen una vigencia máxima de 5 años.",expOpts:["Correcto: los certificados cualificados tienen vigencia máxima de 5 años.","Falso: el límite es 5 años, no 3.","Falso: los certificados cualificados no son ilimitados.","Falso: el límite es 5 años, no 6."]},
{id:13,year:2022,section:"Primera parte",anulada:false,q:"Indique según el título X de la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales, ¿cuál de los siguientes NO es un derecho digital?",opts:["Derecho al testamento digital.","Derecho al olvido en servicios de redes sociales y servicios equivalentes.","Derecho a la desconexión digital en el ámbito laboral.","Derecho a la igualdad y a la no discriminación en el entorno digital."],answer:3,explanation:"El Título X de la LOPDGDD incluye el testamento digital, derecho al olvido y desconexión digital. El 'derecho a la igualdad y no discriminación en el entorno digital' no está recogido como tal en este título.",expOpts:["El testamento digital (art. 96) sí es un derecho digital.","El derecho al olvido en redes sociales (art. 93) sí es un derecho digital.","La desconexión digital laboral (art. 88) sí es un derecho digital.","Correcto: este derecho no está recogido como tal en el Título X de la LOPDGDD."]},
{id:14,year:2022,section:"Primera parte",anulada:false,q:"Según establece el artículo 34 de la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales, los responsables y encargados de tratamiento comunicarán a la Agencia Española de Protección de Datos, las designaciones, nombramientos y ceses de los delegados de protección de datos en el plazo de:",opts:["10 días.","15 días.","1 mes.","3 meses."],answer:0,explanation:"El art. 34 de la LOPDGDD: la comunicación del nombramiento o cese del DPD a la AEPD debe realizarse en el plazo de 10 días.",expOpts:["Correcto: el plazo para comunicar a la AEPD el nombramiento/cese del DPD es de 10 días.","Falso: el plazo es de 10 días, no 15.","Falso: el plazo es de 10 días, no 1 mes.","Falso: el plazo es de 10 días, no 3 meses."]},
{id:15,year:2022,section:"Primera parte",anulada:false,q:"Según el Real Decreto 311/2022, de 3 de mayo, por el que se regula el Esquema Nacional de Seguridad, ¿cuál de las siguientes medidas de seguridad afecta a la dimensión de Confidencialidad?",opts:["Bloqueo de puesto de trabajo.","Firma electrónica.","Registro de la actividad.","Criptografía."],answer:3,explanation:"La confidencialidad garantiza que la información solo sea accesible a quien está autorizado. La criptografía (cifrado) es la medida técnica principal.",expOpts:["El bloqueo de puesto protege más el acceso físico.","La firma electrónica protege autenticidad e integridad.","El registro de la actividad protege la trazabilidad.","Correcto: la criptografía es la medida principal para garantizar la confidencialidad."]},
{id:16,year:2022,section:"Primera parte",anulada:false,q:"Señale la respuesta correcta sobre lo que establece la Norma Técnica de Interoperabilidad de Protocolos de Intermediación de Datos:",opts:["Las tecnologías utilizadas para los intercambios se implementarán en base a estándares según lo establecido en la Norma Técnica de Interoperabilidad de Catálogo de estándares.","De forma general en servicios de intercambio se utilizará la versión 2.0 del protocolo SCSP (Sustitución de Certificados en Soporte Papel).","Emisores y Requirentes no mantendrán trazabilidad de los intercambios de datos producidos.","Los intercambios de información se podrán implementar a través de servicios web."],answer:3,explanation:"La NTI establece que los intercambios pueden implementarse a través de servicios web.",expOpts:["Falso: las tecnologías siguen múltiples normas.","Falso: la versión SCSP indicada no es la correcta.","Falso: emisores y requirentes SÍ deben mantener trazabilidad.","Correcto: los intercambios pueden implementarse a través de servicios web."]},
{id:17,year:2022,section:"Primera parte",anulada:false,q:"Señale qué afirmación es correcta con respecto a las soluciones de Ciberseguridad proporcionadas por el Centro Criptológico Nacional (CCN):",opts:["CLARA, protección y trazabilidad del dato.","ELENA, Simulador de Técnicas de Cibervigilancia.","GLORIA, Gestión de eventos e información de seguridad.","MONICA, Gestor de logs para responder ante incidentes y amenazas."],answer:1,explanation:"ELENA del CCN es un simulador de técnicas de cibervigilancia para entrenar a analistas.",expOpts:["Falso: CLARA evalúa el cumplimiento de guías de bastionado de sistemas Windows.","Correcto: ELENA es el Simulador de Técnicas de Cibervigilancia del CCN.","Falso: GLORIA es la plataforma de inteligencia sobre amenazas (CTI) del CCN.","Falso: MÓNICA gestiona documentación clasificada, no logs de incidentes."]},
{id:18,year:2022,section:"Primera parte",anulada:false,q:"Señale la respuesta correcta referente a los servicios comunes en materia de administración electrónica:",opts:["SERVINOMINA realiza la gestión completa de las fases de nómina: cálculo, contabilidad y pago.","CIRCAB poderosa herramienta de trabajo en grupo para intercambio de información y trabajo colaborativo.","eVISOR permite a un empleado público la consulta de sus nóminas correspondientes a los cinco últimos años.","ENVIA es una aplicación que hace posible el envío de ficheros de gran volumen entre usuarios."],answer:1,explanation:"CIRCAB es la herramienta de trabajo colaborativo de la AGE para el intercambio de información entre grupos de trabajo.",expOpts:["Falso: la descripción de SERVINOMINA no es exactamente esa.","Correcto: CIRCAB es la plataforma de trabajo colaborativo para intercambio de información.","Falso: eVISOR es para visualizar documentos con firma electrónica, no consultar nóminas.","ENVIA es correcta en su descripción, pero la respuesta correcta es CIRCAB."]},
{id:19,year:2022,section:"Primera parte",anulada:false,q:"La CE regula la institución del Defensor del Pueblo como:",opts:["Alto comisionado del Congreso de los Diputados.","Alto comisionado de las Cortes Generales.","Alto comisionado del Poder judicial.","Alto comisionado del Gobierno de la nación."],answer:1,explanation:"El art. 54 CE define al Defensor del Pueblo como 'alto comisionado de las Cortes Generales'.",expOpts:["Falso: el art. 54 CE dice 'Cortes Generales' (no solo Congreso).","Correcto: el Defensor del Pueblo es alto comisionado de las Cortes Generales. Art. 54 CE.","Falso: no tiene relación con el Poder Judicial.","Falso: no depende del Gobierno."]},
{id:20,year:2022,section:"Primera parte",anulada:false,q:"¿Qué es WCAG?",opts:["Unas pautas de accesibilidad de contenidos web promovidas por el W3C.","Una librería de Java EE para la creación de aplicaciones web creada por Oracle.","Un componente del ecosistema Hadoop para el manejo de Big Data.","Un framework javascript especialmente indicado para trabajar con bases de datos no relacionales."],answer:0,explanation:"WCAG (Web Content Accessibility Guidelines) son las pautas de accesibilidad para el contenido web publicadas por el W3C, estándar internacional de referencia.",expOpts:["Correcto: WCAG son las pautas de accesibilidad de contenido web del W3C.","Falso: WCAG no tiene relación con Java EE.","Falso: WCAG no tiene relación con Hadoop.","Falso: WCAG no es un framework JavaScript."]},
{id:21,year:2022,section:"Primera parte",anulada:false,q:"¿Cuál de los siguientes es el nombre de un conector usado para carga y datos creado por el fabricante Apple?",opts:["USB-Tipo C","iUSB","iFirewire","Lightning"],answer:3,explanation:"Lightning es el conector propietario de Apple introducido en 2012 para iPhone, iPad y iPod. USB-C es universal.",expOpts:["USB-Tipo C es un conector universal estándar, no exclusivo de Apple.","iUSB no es un conector real.","iFirewire no es un conector real.","Correcto: Lightning es el conector propietario de Apple para carga y datos."]},
{id:22,year:2022,section:"Primera parte",anulada:true,q:"Con respecto a las sentencias del lenguaje SQL, indique la respuesta INCORRECTA:",opts:["Sentencia DELETE sirve para borrar en forma sencilla distintos objetos como por ejemplo base de datos, tablas o índices.","La sentencia INSERT agrega uno o más registros a una tabla en una base de datos relacional.","La sentencia UPDATE modifica los valores de un conjunto de registros existentes en una tabla.","La sentencia GRANT se utiliza para dar permisos a un usuario."],answer:0,explanation:"Pregunta anulada. La opción a es incorrecta (DELETE borra filas, no objetos como tablas; eso es DROP), pero la pregunta fue anulada por ambigüedad.",expOpts:["INCORRECTA: DELETE borra registros (filas), no objetos como tablas (eso es DROP).","INSERT añade registros. No es la incorrecta.","UPDATE modifica registros. No es la incorrecta.","GRANT otorga permisos (DCL). No es la incorrecta."]},
{id:23,year:2022,section:"Primera parte",anulada:false,q:"Cuál de los siguientes son los objetos básicos de Kubernetes:",opts:["Pod, State, Volume, Namespace.","Pod, Service, Volume, Namespace.","Job, Service, Volume, Namespace.","Job, Pod, Volume, Deployment."],answer:1,explanation:"Los objetos básicos de Kubernetes son: Pod, Service, Volume y Namespace.",expOpts:["Falso: 'State' no es un objeto básico de Kubernetes.","Correcto: Pod, Service, Volume y Namespace son los cuatro objetos básicos de Kubernetes.","Falso: Job no es uno de los cuatro objetos básicos.","Falso: Deployment tampoco está en los cuatro objetos básicos de esta clasificación."]},
{id:24,year:2022,section:"Primera parte",anulada:false,q:"La ALU es una parte de:",opts:["La memoria.","La CPU.","El bus de operaciones.","El multiplexor de entrada."],answer:1,explanation:"La ALU (Arithmetic Logic Unit) realiza operaciones aritméticas y lógicas. Forma parte de la CPU junto con la Unidad de Control.",expOpts:["Falso: la ALU no es parte de la memoria.","Correcto: la ALU es un componente interno de la CPU.","Falso: el bus de operaciones no existe como elemento estándar independiente.","Falso: la ALU no es un multiplexor de entrada."]},
{id:25,year:2022,section:"Primera parte",anulada:false,q:"Señale la respuesta correcta sobre el modelo CISC:",opts:["La microprogramación es una característica esencial.","Plantea un conjunto reducido de instrucciones para reducir el número de ciclos de reloj de ejecución de cada una de ellas.","Implementa las instrucciones directamente en hardware.","Está muy extendido en el mercado de procesadores para smartphone y tablets por su bajo consumo y buen rendimiento."],answer:0,explanation:"CISC usa microprogramación para implementar instrucciones complejas mediante microcódigo. RISC implementa en hardware y domina en móviles.",expOpts:["Correcto: la microprogramación es una característica esencial de CISC.","Falso: eso describe RISC. CISC tiene un conjunto AMPLIO de instrucciones.","Falso: CISC usa microprogramación (software); RISC implementa en hardware.","Falso: ARM (RISC) domina en smartphones, no CISC."]},
{id:26,year:2022,section:"Primera parte",anulada:false,q:"En relación con los sistemas RAID señale la respuesta INCORRECTA:",opts:["El RAID 1+0 exige un mínimo de 4 discos.","RAID 6 amplía el RAID 5 agregando un bloque de paridad.","RAID 5 necesitará un mínimo de 3 discos para ser implementado.","Un RAID 4 distribuye la información a nivel de bloques con dos discos de paridad dedicados."],answer:3,explanation:"RAID 4 usa UN solo disco de paridad dedicado, no dos. Dos discos de paridad distribuidos sería RAID 6.",expOpts:["Correcto: RAID 10 necesita mínimo 4 discos. No es incorrecta.","Correcto: RAID 6 añade un segundo bloque de paridad respecto a RAID 5. No es incorrecta.","Correcto: RAID 5 necesita mínimo 3 discos. No es incorrecta.","INCORRECTA: RAID 4 tiene UN disco de paridad dedicado, no dos."]},
{id:27,year:2022,section:"Primera parte",anulada:false,q:"¿Cuál de las siguientes es una tecnología de almacenamiento en disco mediante bus serie?",opts:["SATA","ATA","SCSI","DLT"],answer:0,explanation:"SATA (Serial ATA) usa transmisión serial. ATA (PATA/IDE) usa transmisión paralela. DLT es para cintas.",expOpts:["Correcto: SATA (Serial ATA) usa bus serie.","ATA (PATA/IDE) usa bus paralelo.","SCSI clásico es paralelo.","DLT es para almacenamiento en cinta."]},
{id:28,year:2022,section:"Primera parte",anulada:false,q:"Respecto a la norma USB indique la respuesta INCORRECTA:",opts:["USB Type-C es lo mismo que USB 3.1","La diferencia entre USB 3.1 Gen 1 y USB 3.1 Gen 2 se reduce solamente a la velocidad.","USB 3.2 permite velocidades de hasta 20 Gbps.","Los dispositivos USB 2.0 pueden lograr una velocidad de transferencia máxima hasta de 480 Mbps."],answer:0,explanation:"USB Type-C es un formato de conector físico; USB 3.1 es un estándar de velocidad. Son conceptos diferentes.",expOpts:["INCORRECTA: USB Type-C es un tipo de conector físico; USB 3.1 es un estándar de velocidad.","Correcto: Gen 1 (5 Gbps) y Gen 2 (10 Gbps) solo se diferencian en velocidad.","Correcto: USB 3.2 Gen 2x2 alcanza hasta 20 Gbps.","Correcto: USB 2.0 tiene velocidad máxima de 480 Mbps."]},
{id:29,year:2022,section:"Primera parte",anulada:false,q:"En teoría de grafos, el algoritmo para la determinación del camino más corto, dado un vértice origen, hacia el resto de los vértices en un grafo que tiene pesos en cada arista se denomina:",opts:["Algoritmo de Kruskal.","Algoritmo de Prim.","Algoritmo de Dijkstra.","Algoritmo de Floyd-Warshall."],answer:2,explanation:"Dijkstra encuentra el camino más corto desde un vértice origen a todos los demás. Kruskal y Prim son para árbol de expansión mínima.",expOpts:["Kruskal: árbol de expansión mínima.","Prim: árbol de expansión mínima (greedy).","Correcto: Dijkstra encuentra el camino más corto desde un origen a todos los demás.","Floyd-Warshall: caminos mínimos entre todos los pares de vértices."]},
{id:30,year:2022,section:"Primera parte",anulada:false,q:"Con respecto a los estándares PDF, señale que afirmación NO es correcta:",opts:["PDF/UA Es el estándar global para la accesibilidad de PDF.","PDF/A proporciona las especificaciones para crear, ver e imprimir documentos digitales para conservarlos a largo plazo.","PDF/E proporciona especificaciones para crear, ver e imprimir documentos utilizados en flujos de trabajo de ingeniería.","PDF/I proporciona especificaciones para crear, ver e imprimir páginas finales listas para imprimir o listas para la prensa."],answer:3,explanation:"El estándar para documentos listos para imprimir es PDF/X (para producción gráfica), no PDF/I.",expOpts:["Correcto: PDF/UA es el estándar de accesibilidad.","Correcto: PDF/A es para conservación a largo plazo.","Correcto: PDF/E es para ingeniería.","INCORRECTA: para impresión se usa PDF/X, no PDF/I."]},
{id:31,year:2022,section:"Primera parte",anulada:false,q:"¿Cuál de las versiones siguientes es la más reciente del sistema operativo macOS?",opts:["macOS Sierra","macOS Monterey","macOS Big Sur","macOS Ventura"],answer:3,explanation:"macOS Ventura (13, septiembre 2022) fue la versión más reciente en el momento del examen TAI 2022.",expOpts:["macOS Sierra (10.12, 2016) es la más antigua.","macOS Monterey (12, 2021) es anterior a Ventura.","macOS Big Sur (11, 2020) es anterior a Monterey y Ventura.","Correcto: macOS Ventura (13, 2022) era la versión más reciente."]},
{id:32,year:2022,section:"Primera parte",anulada:false,q:"Cuál de las siguientes afirmaciones NO es correcta:",opts:["En Windows de 64 bits, un proceso de 64 bits no puede cargar una biblioteca de vínculos dinámicos (DLL) de 32 bits.","En Windows de 64 bits, un proceso de 32 bits no puede cargar un archivo DLL de 64 bits.","En Windows de 64 bits se admiten llamadas a procedimientos remotos (RPC) entre procesos de 64 y 32 bits solo en el mismo equipo.","En Windows de 64 bits se admiten llamadas a procedimientos remotos (RPC) entre procesos de 64 y 32 bits tanto en el mismo equipo como entre equipos distintos."],answer:2,explanation:"En Windows de 64 bits, los procesos de 64 bits SÍ pueden cargar DLL de 32 bits a través de WoW64. La afirmación de que no pueden es incorrecta.",expOpts:["INCORRECTA: un proceso de 64 bits SÍ puede cargar DLL de 32 bits mediante WoW64.","Correcto: un proceso de 32 bits no puede cargar DLL de 64 bits.","Correcto: las RPC entre 64 y 32 bits solo funcionan en el mismo equipo.","Correcto: las RPC también funcionan entre equipos distintos."]},
{id:33,year:2022,section:"Primera parte",anulada:false,q:"Las bases de datos relacionales ofrecen propiedades ACID. Dicho acrónimo se refiere a:",opts:["Atomicidad, Consistencia, Aislamiento y Durabilidad.","Atomicidad, Coherencia, Integridad y Distribución.","Disponibilidad, Coherencia, Intensidad y Durabilidad.","Atomicidad, Consistencia, Aislamiento y Disponibilidad."],answer:0,explanation:"ACID: Atomicidad (todo o nada), Consistencia (BD pasa de un estado válido a otro), Aislamiento (transacciones no se interfieren) y Durabilidad (cambios son permanentes).",expOpts:["Correcto: ACID = Atomicidad, Consistencia, Aislamiento y Durabilidad.","Falso: 'Coherencia', 'Integridad' y 'Distribución' no son los términos correctos.","Falso: 'Disponibilidad', 'Coherencia' e 'Intensidad' no son los términos del acrónimo.","Falso: la 'D' de ACID es Durabilidad, no Disponibilidad."]},
{id:34,year:2022,section:"Primera parte",anulada:false,q:"Entre las características obligatorias de un sistema gestor de bases de datos orientadas a objetos, NO se encuentra:",opts:["Debe permitir construir objetos complejos.","El conjunto de tipos de datos debe ser fijo, consiguiendo así mayor eficiencia en las búsquedas.","Todos los objetos deben tener un identificador que sea independiente de los valores de sus atributos.","El esquema de una BDOO incluye únicamente un conjunto de clases (o de tipos)."],answer:1,explanation:"Los SGBDOO deben ser extensibles: el usuario puede definir nuevos tipos. Tener un conjunto de tipos FIJO es una limitación inaceptable.",expOpts:["Construir objetos complejos sí es característica obligatoria.","Correcto: el conjunto de tipos NO debe ser fijo; los SGBDOO deben ser extensibles.","El OID independiente de los valores es característica obligatoria.","El esquema basado en clases es característica de los SGBDOO."]},
{id:35,year:2022,section:"Primera parte",anulada:false,q:"Señale qué es el Machine Learning Services para SQL Server:",opts:["Es un conjunto de tecnologías destinadas a la copia y distribución de datos y objetos de base de datos desde una base de datos a otra, para luego sincronizar ambas bases de datos y mantener su coherencia.","Es una característica de SQL Server que proporciona la capacidad de ejecutar scripts de Python y R con datos relacionales.","Es un producto de calidad de datos basado en conocimiento.","Es el servicio principal para almacenar, procesar y proteger los datos."],answer:1,explanation:"Machine Learning Services permite ejecutar scripts de Python y R directamente en SQL Server, facilitando el análisis y ML sobre datos relacionales.",expOpts:["Eso describe la replicación de bases de datos.","Correcto: Machine Learning Services permite ejecutar Python y R en SQL Server.","Eso describe Data Quality Services (DQS).","Eso describe el motor principal de SQL Server."]},
{id:36,year:2022,section:"Primera parte",anulada:false,q:"Señale la respuesta correcta relativa al Modelo Entidad/Relación Extendido según establece METRICA v3:",opts:["Un atributo se define sobre diversos dominios.","El dominio no tiene existencia propia y depende de las entidades, las relaciones o los atributos.","La entidad es aquel objeto, real o abstracto, acerca del cual se desea almacenar información en la base de datos.","La clave candidata es el conjunto de atributos que garantizan la unicidad de las ocurrencias e identifican la ocurrencia unívocamente."],answer:2,explanation:"En el Modelo E/R Extendido de Métrica v3, la entidad se define como el objeto real o abstracto sobre el que se desea almacenar información.",expOpts:["Falso: un atributo se define sobre un único dominio, no sobre diversos.","Falso: el dominio SÍ tiene existencia propia en Métrica v3.","Correcto: la entidad es el objeto (real o abstracto) sobre el que se almacena información.","Falso: eso describe más a la clave primaria; la candidata es cualquier conjunto mínimo identificador."]},
{id:37,year:2022,section:"Primera parte",anulada:true,q:"La arquitectura ANSI/SPARC define para un sistema de gestión de bases de datos tres niveles de abstracción. Indicar la afirmación INCORRECTA:",opts:["El nivel externo contiene las vistas externas de la base de datos y permite a cada tipo de usuario ver sólo aquella parte del esquema que le interesa.","El nivel físico define cómo se almacenan los datos y los métodos de acceso.","El nivel contextual define el formato de los campos.","El nivel interno también recibe el nombre de nivel lógico."],answer:3,explanation:"Pregunta anulada. Los tres niveles de ANSI/SPARC son: externo, conceptual e interno (físico). 'Nivel contextual' no es terminología estándar. La opción d dice que el nivel interno se llama 'lógico', pero el nivel lógico es el conceptual.",expOpts:["El nivel externo (vistas) permite a cada usuario ver la parte que le corresponde.","El nivel físico define el almacenamiento físico.","'Nivel contextual' no es terminología ANSI/SPARC estándar (es 'conceptual').","INCORRECTA: el nivel lógico es el CONCEPTUAL, no el interno (físico)."]},
