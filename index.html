{id:10,year:2024,section:"Primera parte",anulada:false,q:"Señale la respuesta INCORRECTA sobre el uso obligatorio de firma requerida a los interesados por parte de las Administraciones Públicas que recoge el artículo 11 de Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas:",opts:["Conocer el estado de la tramitación.","Desistir de acciones.","Presentar declaraciones responsables o comunicaciones.","Formular solicitudes."],answer:0,explanation:"El art. 11 de la Ley 39/2015 establece cuándo las AAPP pueden exigir firma. Conocer el estado de tramitación no requiere firma: es una mera consulta.",expOpts:["INCORRECTA: consultar el estado de tramitación no requiere firma obligatoria.","Las AAPP pueden exigir firma para el desistimiento.","Las AAPP pueden exigir firma para declaraciones responsables o comunicaciones.","Las AAPP pueden exigir firma para formular solicitudes."]},
{id:11,year:2024,section:"Primera parte",anulada:false,q:"Tal y como se recoge en la Resolución de 14 de diciembre de 2015, de la Dirección de Tecnologías de la Información y las Comunicaciones, por la que se establecen las prescripciones técnicas necesarias para el desarrollo y aplicación del sistema Cl@ve, señale la respuesta correcta:",opts:["Es un sistema que está dirigido a los ciudadanos que cumplan con los requisitos indicados en las Prescripciones Técnicas.","Ofrece tres niveles de garantía de registro asociados a la forma y a las garantías que ofrezca la comunicación de la información de registro por parte del ciudadano.","Proporcionará a los usuarios tres modalidades de identificación electrónica basadas en el uso de claves concertadas.","Permitirá también el acceso a servicios de firma electrónica, en particular, a servicios de firma de documentos electrónicos mediante certificados electrónicos centralizados."],answer:3,explanation:"Cl@ve es el sistema de identificación y firma electrónica de la Administración española. Una de sus funciones clave es permitir la firma de documentos electrónicos mediante certificados centralizados (Cl@ve Firma).",expOpts:["Incompleto y confuso: Cl@ve está dirigido a ciudadanos en general.","Falso: Cl@ve ofrece dos niveles de registro (básico y avanzado), no tres.","Falso: Cl@ve ofrece dos modalidades de claves concertadas (PIN y Permanente), no tres.","Correcto: Cl@ve permite la firma electrónica mediante certificados centralizados."]},
{id:12,year:2024,section:"Primera parte",anulada:false,q:"Señale la respuesta correcta sobre la solicitud de acceso a la información pública que recoge el artículo 17 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno:",opts:["Sólo se podrá presentar en castellano.","Es obligatorio indicar una dirección de contacto electrónica, a efectos de comunicaciones.","Deberá dirigirse al titular del órgano administrativo o entidad que posea la información.","Deberá motivarse."],answer:2,explanation:"El art. 17 de la Ley de Transparencia establece que la solicitud debe dirigirse al titular del órgano que posea la información. No es necesario motivarla.",expOpts:["Falso: puede presentarse en cualquier lengua oficial del Estado.","Falso: no es obligatorio indicar correo electrónico.","Correcto: debe dirigirse al titular del órgano o entidad que posea la información.","Falso: el art. 17.3 dice que el solicitante NO está obligado a motivar su solicitud."]},
{id:13,year:2024,section:"Primera parte",anulada:false,q:"Indique la respuesta correcta sobre la vigencia que tienen los certificados electrónicos reconocidos incorporados al documento nacional de identidad, según la legislación vigente:",opts:["No podrá ser superior a tres años.","No podrá ser superior a cuatro años.","No podrá ser superior a cinco años.","No podrá ser superior a seis años."],answer:2,explanation:"La normativa del DNIe establece que los certificados electrónicos incorporados tienen una vigencia máxima de cinco años.",expOpts:["Falso: tres años es inferior al límite legal.","Falso: cuatro años tampoco es el plazo correcto.","Correcto: la vigencia máxima es de cinco años.","Falso: seis años supera el límite permitido."]},
{id:14,year:2024,section:"Primera parte",anulada:false,q:"La Ley 56/2007, de 28 de diciembre, de Medidas de Impulso de la Sociedad de la Información, ¿qué establece sobre la factura electrónica en el artículo 1?",opts:["Los formatos estructurados de las facturas electrónicas permitirán su visualización y emisión en las distintas lenguas oficiales existentes y en inglés, con la finalidad de garantizar los derechos de los usuarios nacionales y extranjeros.","Los formatos estructurados de las facturas electrónicas permitirán su visualización y emisión en las distintas lenguas oficiales existentes, con la finalidad de garantizar los derechos de los usuarios.","No trata en ningún artículo sobre la factura electrónica.","La factura electrónica solo se utilizará en contratación, estando excluida de la justificación de ayudas y subvenciones."],answer:1,explanation:"El art. 1 de la Ley 56/2007 regula la factura electrónica y establece que los formatos estructurados deben permitir la visualización en las lenguas oficiales españolas, sin incluir el inglés.",expOpts:["Falso: la ley no menciona el inglés, solo las lenguas oficiales del Estado español.","Correcto: los formatos permitirán visualización en lenguas oficiales para garantizar derechos de los usuarios.","Falso: la ley sí regula la factura electrónica.","Falso: la factura electrónica tiene un ámbito más amplio que la mera contratación."]},
{id:15,year:2024,section:"Primera parte",anulada:false,q:"¿Qué principio relativo al tratamiento de datos personales definido en el Reglamento (UE) 2016/679 del Parlamento Europeo y del Consejo, de 27 de abril de 2016, relativo a la protección de las personas físicas en lo que respecta al tratamiento de datos personales y a la libre circulación de estos datos y por el que se deroga la Directiva 95/46/CE (Reglamento general de protección de datos) se refiere a que los datos serán adecuados, pertinentes y limitados a lo necesario en relación con los fines para los que son tratados?",opts:["Limitación de la finalidad.","Exactitud.","Minimización de datos.","Adecuación de datos."],answer:2,explanation:"El art. 5.1.c) del RGPD define el principio de 'minimización de datos': solo deben recogerse y tratarse los datos estrictamente necesarios para el fin previsto.",expOpts:["Limitación de la finalidad (art. 5.1.b): los datos solo pueden usarse para el fin para el que se recogieron.","Exactitud (art. 5.1.d): los datos deben ser exactos y actualizados.","Correcto: minimización de datos (art. 5.1.c). Adecuados, pertinentes y limitados a lo necesario.","'Adecuación de datos' no es un principio con ese nombre en el RGPD."]},
{id:16,year:2024,section:"Primera parte",anulada:false,q:"Señale la respuesta correcta respecto a las notificaciones según la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas:",opts:["Toda notificación deberá ser cursada dentro del plazo de quince días a partir de la fecha en que el acto haya sido dictado.","Cuando los interesados en un procedimiento sean desconocidos, se ignore el lugar de la notificación o bien, intentada ésta, no se hubiese podido practicar, la notificación se hará por medio de un anuncio publicado en el BOE.","Las notificaciones se practicarán preferentemente en papel y, en todo caso, cuando el interesado resulte obligado a recibirlas por esta vía.","Cuando la notificación se practique en el domicilio del interesado, de no hallarse presente éste en el momento de entregarse la notificación, podrá hacerse cargo de ella cualquier persona mayor de dieciséis años que se encuentre en el domicilio y haga constar su identidad."],answer:1,explanation:"El art. 44 de la Ley 39/2015 establece que cuando el interesado sea desconocido o no pueda practicarse la notificación, se publicará en el BOE.",expOpts:["Falso: el plazo es de 10 días hábiles, no 15 (art. 40.2).","Correcto: art. 44. Notificación por publicación en BOE cuando no se pueda practicar.","Falso: la Ley 39/2015 establece preferencia por la notificación electrónica (art. 41.1).","Falso: la ley no contempla esta opción para notificaciones administrativas."]},
{id:17,year:2024,section:"Primera parte",anulada:false,q:"De acuerdo con el Real Decreto 203/2021, de 30 de marzo, por el que se aprueba el Reglamento de actuación y funcionamiento del sector público por medios electrónicos, ¿cuál de las siguientes opciones forma parte del contenido mínimo que debe contener una sede electrónica?",opts:["Relación de los canales de acceso electrónico a dicha sede como instrumento de comunicación para los ciudadanos.","Relación de los Puntos de Acceso General electrónicos que la referencian directa o indirectamente.","Normativa reguladora del Registro al que se acceda a través de la sede electrónica.","Enlace directo al Boletín Oficial correspondiente."],answer:2,explanation:"El RD 203/2021 establece el contenido mínimo de una sede electrónica. Entre los elementos exigidos está la normativa reguladora del registro electrónico accesible desde la sede.",expOpts:["No forma parte del contenido mínimo obligatorio del RD 203/2021.","No es un requisito de contenido mínimo según el RD 203/2021.","Correcto: la normativa reguladora del Registro es contenido mínimo obligatorio.","No es un requisito de contenido mínimo."]},
{id:18,year:2024,section:"Primera parte",anulada:false,q:"Marque la respuesta correcta relacionada con el nodo eIDAS español:",opts:["Para las Administraciones Públicas, la integración con el nodo eIDAS español se realiza a través de @Firma.","Permite el reconocimiento de identidades en soportes físicos emitidas por otros países.","Facilita la aceptación del DNI electrónico en servicios de Administración Electrónica de otras administraciones integrantes de la OCDE.","Utiliza un sistema de intercambio de mensajes conforme al estándar SAML 2.0."],answer:3,explanation:"El nodo eIDAS español es el punto de conexión para el reconocimiento mutuo de identidades electrónicas entre países UE. Utiliza el protocolo SAML 2.0.",expOpts:["Falso: la integración de las AAPP se realiza a través de Cl@ve, no @Firma.","Falso: eIDAS reconoce identidades digitales, no en soportes físicos.","Falso: eIDAS aplica al ámbito de la UE, no de la OCDE.","Correcto: el nodo eIDAS usa SAML 2.0 para el intercambio de mensajes entre países UE."]},
{id:19,year:2024,section:"Primera parte",anulada:false,q:"¿Qué es la taxonomía de Flynn?",opts:["Una clasificación de patrones de diseño para objetos de software, centrados en su creación, relación e interacción.","Una clasificación para las computadoras con arquitectura paralela atendiendo al flujo de datos e instrucciones en un sistema.","Una clasificación que pretende clarificar los diferentes tipos de tecnologías, técnicas y mecanismos que abarca el concepto abstracto de “Inteligencia Artificial”.","Una clasificación de los tipos de controladores (drivers) JDBC."],answer:1,explanation:"La taxonomía de Flynn (1966) clasifica las arquitecturas de computadores según el número de flujos de instrucciones y de datos. Define cuatro categorías: SISD, SIMD, MISD y MIMD.",expOpts:["Falso: eso describe los patrones de diseño GoF, no la taxonomía de Flynn.","Correcto: clasifica arquitecturas paralelas según flujos de instrucciones (Single/Multiple) y datos (Single/Multiple).","Falso: no tiene relación con la Inteligencia Artificial.","Falso: JDBC es una API de Java para bases de datos; no tiene clasificación llamada 'taxonomía de Flynn'."]},
{id:20,year:2024,section:"Primera parte",anulada:false,q:"Indique, de las siguientes palabras, cuál indica además un número hexadecimal válido:",opts:["EBOCA","BECADAS","ACCEDA","CEGADA"],answer:2,explanation:"El sistema hexadecimal usa los dígitos 0-9 y las letras A, B, C, D, E y F. ACCEDA contiene solo A, C, C, E, D, A: todas válidas. EBOCA tiene la O, BECADAS tiene la S, y CEGADA tiene la G.",expOpts:["EBOCA contiene la letra O, que no existe en hexadecimal.","BECADAS contiene S, que no es un dígito hexadecimal.","Correcto: ACCEDA solo contiene A, C, D y E, todas válidas en hexadecimal.","CEGADA contiene G, que no es un dígito hexadecimal."]},
{id:21,year:2024,section:"Primera parte",anulada:false,q:"Señale cuál de las siguientes es un formato de interfaz SSD:",opts:["HHP","MMVe","MMD","M.2"],answer:3,explanation:"Los SSD pueden tener distintos formatos físicos de conexión. M.2 es uno de los más comunes en equipos modernos, y admite protocolos SATA o NVMe.",expOpts:["HHP no es un formato de interfaz SSD real.","MMVe no es un formato de interfaz SSD real.","MMD no es un formato de interfaz SSD real.","Correcto: M.2 es un formato real de interfaz SSD muy utilizado en equipos modernos."]},
{id:22,year:2024,section:"Primera parte",anulada:true,q:"Un controlador de dispositivo periférico:",opts:["Es el componente electrónico de la unidad de entrada y salida.","Es el componente mecánico de la unidad de entrada y salida.","Es la interfaz entre el adaptador y la unidad de entrada y salida.","Es la interfaz entre la tarjeta controladora y el cable de conexión."],answer:0,explanation:"Pregunta anulada en el examen oficial. Un controlador de dispositivo (device driver) es software que permite al sistema operativo comunicarse con el hardware. Ninguna opción lo recoge correctamente, de ahí la anulación.",expOpts:["Fue la opción marcada provisionalmente antes de la anulación.","Falso: un controlador no es un componente mecánico.","Incompleto: confunde el controlador software con una interfaz hardware.","Falso: mezcla conceptos de cableado con software de control."]},
{id:23,year:2024,section:"Primera parte",anulada:false,q:"Con respecto a los árboles 2-3-4, señale la respuesta correcta:",opts:["Cumple las propiedades del árbol binario de búsqueda.","Las hojas pueden estar a distinto nivel.","Los nodos pueden tener 2, 3 o 4 hijos (2-nodo, 3-nodo o 4-nodo).","Las reestructuraciones se realizan desde las hojas hacia la raíz."],answer:2,explanation:"Un árbol 2-3-4 es un árbol de búsqueda balanceado donde cada nodo puede tener 2, 3 o 4 hijos. Las hojas siempre están al mismo nivel y las reestructuraciones se hacen de la raíz hacia las hojas.",expOpts:["Falso: un árbol binario solo tiene nodos con hasta 2 hijos; un árbol 2-3-4 permite hasta 4.","Falso: en los árboles 2-3-4 todas las hojas están al mismo nivel.","Correcto: los nodos pueden ser 2-nodo, 3-nodo o 4-nodo.","Falso: las reestructuraciones se realizan de arriba hacia abajo, de la raíz hacia las hojas."]},
{id:24,year:2024,section:"Primera parte",anulada:false,q:"Señale la respuesta correcta referente al tipo abstracto de datos (TAD) Cola:",opts:["Basada en el principio LIFO (last-in, first-out).","Es un tipo especial de lista en la que se pueden insertar y eliminar por cualquier extremo.","Cada nodo tiene dos enlaces, uno al nodo siguiente, y otro al anterior.","Se pude implementar usando una estructura dinámica."],answer:3,explanation:"Una Cola (Queue) es una estructura de datos FIFO: se insertan elementos por un extremo y se extraen por el otro. Puede implementarse con arrays o estructuras dinámicas.",expOpts:["Falso: LIFO es la pila (Stack). La cola es FIFO.","Falso: en una cola solo se inserta por un extremo y se extrae por el otro.","Falso: esa descripción corresponde a una lista doblemente enlazada.","Correcto: una cola puede implementarse con estructuras dinámicas como listas enlazadas."]},
{id:25,year:2024,section:"Primera parte",anulada:false,q:"Señale la respuesta INCORRECTA acerca de los tipos abstractos de datos (TAD):",opts:["Es una colección de propiedades y operaciones que se definen mediante una especificación que es independiente de cualquier representación.","Nos permiten diseñar nuestros propios tipos para encapsular lógica algorítmica y proveer abstracción a las capas de software de más alto nivel.","Se pueden escribir usando lenguaje natural, usando pseudo-código o incluso algún lenguaje de programación.","En JAVA, una estructura de datos (interface) debe implementar todas las operaciones definidas en su TAD (class)."],answer:3,explanation:"En Java la relación es la inversa: una clase (class) implementa las operaciones definidas en una interfaz (interface). El TAD se modela como interfaz, y la implementación concreta es la clase.",expOpts:["Correcto: un TAD es independiente de su implementación concreta.","Correcto: el objetivo del TAD es la encapsulación y abstracción.","Correcto: un TAD puede especificarse en lenguaje natural, pseudocódigo o cualquier lenguaje.","INCORRECTA: en Java es la clase la que implementa la interfaz, no al revés."]},
{id:26,year:2024,section:"Primera parte",anulada:false,q:"¿Cuál es la función del kernel en un sistema operativo Unix/Linux?",opts:["Gestionar la interfaz gráfica.","Controlar los procesos, la memoria y la administración de dispositivos.","Proveer servicios de red como TCP/IP.","Facilitar la comunicación entre usuarios a través de terminales."],answer:1,explanation:"El kernel (núcleo) es el componente central del sistema operativo. Se encarga de la gestión de procesos, la memoria, los dispositivos hardware y el sistema de ficheros.",expOpts:["Falso: la interfaz gráfica (X Window, Wayland) no es responsabilidad directa del kernel.","Correcto: el kernel gestiona procesos, memoria y dispositivos. Son sus funciones fundamentales.","Falso: TCP/IP es gestionado por la pila de red del kernel, pero no es su función exclusiva.","Falso: la comunicación por terminales es gestionada por demonios del espacio de usuario."]},
{id:27,year:2024,section:"Primera parte",anulada:false,q:"Señale la respuesta INCORRECTA. Android NDK:",opts:["Es un conjunto de herramientas que permiten implementar partes de las aplicaciones de Android mediante C y C++.","Genera librerías binarias para cada arquitectura de procesador que se pueden invocar desde Java por medio de JNI (Java Native Interface).","Se recomienda su uso con aplicaciones intensivas a nivel computacional, como juegos o simulaciones físicas.","No permite la reutilización de código, no pudiendo usar bibliotecas de otros desarrolladores."],answer:3,explanation:"El Android NDK sí permite reutilizar código nativo existente, incluidas bibliotecas de terceros escritas en C o C++. De hecho, esa es una de sus ventajas principales.",expOpts:["Correcto: el NDK permite usar C y C++ para partes de la app Android.","Correcto: genera librerías (.so) para cada arquitectura invocables desde Java mediante JNI.","Correcto: se recomienda para código intensivo computacionalmente.","INCORRECTA: el NDK sí permite reutilizar código y usar bibliotecas de terceros."]},
{id:28,year:2024,section:"Primera parte",anulada:false,q:"¿Cuál es la característica diferenciadora de las claves foráneas en una base de datos relacional?",opts:["Un atributo que no tiene relación con otras tablas.","Un atributo que referencia la clave primaria de otra tabla.","Un atributo que puede tener valores duplicados. de datos.","Un atributo que se utiliza solo para consultas."],answer:1,explanation:"Una clave foránea (foreign key) es un atributo que referencia la clave primaria de otra tabla, estableciendo la integridad referencial.",expOpts:["Falso: es exactamente lo contrario; la clave foránea establece la relación con otra tabla.","Correcto: la clave foránea referencia la clave primaria de otra tabla.","Los valores duplicados pueden existir en claves foráneas, pero no es su característica diferenciadora.","Falso: las claves foráneas tienen un propósito estructural de integridad, no solo de consulta."]},
{id:29,year:2024,section:"Primera parte",anulada:false,q:"¿Cuál de los siguientes es un Sistema de Gestión de Bases de Datos Orientadas a Objetos (SGDBOO)?",opts:["Cézanne.","Picasso.","Matisse.","Rembrandt."],answer:2,explanation:"Matisse es un SGDBOO real. Los SGDBOO almacenan datos como objetos, con sus atributos y métodos. Cézanne, Picasso y Rembrandt son pintores famosos pero no son sistemas de bases de datos.",expOpts:["Cézanne es un pintor, no un SGDBOO.","Picasso es un pintor, no un SGDBOO.","Correcto: Matisse es un SGDBOO real.","Rembrandt es un pintor, no un SGDBOO."]},
{id:30,year:2024,section:"Primera parte",anulada:false,q:"¿Qué es el lenguaje OQL en el contexto de las bases de datos orientadas a objetos?",opts:["OQL no es un lenguaje en el contexto de las bases de datos orientadas a objetos.","Un lenguaje de definición de datos.","Un lenguaje de consulta de datos.","Un lenguaje de manipulación de datos."],answer:2,explanation:"OQL (Object Query Language) es el lenguaje de consulta estándar para bases de datos orientadas a objetos, definido por el ODMG. Es el equivalente del SELECT de SQL.",expOpts:["Falso: OQL sí existe y es un lenguaje estándar para BDOO.","Falso: OQL no define la estructura de los datos (eso lo haría ODL).","Correcto: OQL es un lenguaje de consulta de datos para BDOO.","Falso: OQL no es un lenguaje de manipulación."]},
{id:31,year:2024,section:"Primera parte",anulada:false,q:"De acuerdo con Métrica v3, en el Modelo Entidad/Relación Extendido, ¿cuál es el término que representa la participación en la relación de cada una de las entidades afectadas?",opts:["Atributo.","Cardinalidad.","Tipo de Correspondencia.","Dominio."],answer:1,explanation:"En el Modelo E/R Extendido de Métrica v3, la cardinalidad indica cuántas instancias de una entidad participan en una relación con otra entidad (uno a uno, uno a muchos, muchos a muchos).",expOpts:["Un atributo es una propiedad de una entidad, no la participación en una relación.","Correcto: la cardinalidad indica la participación de cada entidad en la relación.","El tipo de correspondencia indica la proporción máxima (1:1, 1:N, M:N), concepto distinto.","El dominio es el conjunto de valores posibles de un atributo."]},
{id:32,year:2024,section:"Primera parte",anulada:false,q:"Señale la respuesta correcta sobre la normalización de bases de datos en Métrica v3:",opts:["Un atributo tiene dependencia funcional completa de otro si, y sólo si, depende de él a través de otro atributo.","Una entidad está en 1FN si tiene grupos repetitivos, es decir, un atributo puede tomar varios valores de un dominio simple.","Una entidad está en 2FN si está en 1FN y todos los atributos que no forman parte de las claves candidatas tienen dependencia funcional completa respecto de éstas.","Una relación en 3FN estará también en 2FN, pero no en 1FN."],answer:2,explanation:"La Segunda Forma Normal (2FN) exige: (1) estar en 1FN y (2) que todos los atributos no clave dependan funcionalmente de forma completa de la clave candidata entera.",expOpts:["Falso: eso describe la dependencia funcional transitiva, no la completa.","Falso: en 1FN NO puede haber grupos repetitivos; los atributos deben ser atómicos.","Correcto: definición precisa de la 2FN según Métrica v3.","Falso: si está en 3FN, también está en 2FN y en 1FN. Las formas normales son acumulativas."]},
{id:33,year:2024,section:"Primera parte",anulada:false,q:"Señale, de entre las siguientes opciones, el mecanismo en el Modelo Entidad/Relación Extendido que recoge Métrica v3 consistente en relacionar dos tipos de entidades que normalmente son de dominios independientes, pero coyunturalmente se asocian:",opts:["Asociación.","Generalización.","PERT.","Regresión."],answer:0,explanation:"En el Modelo E/R Extendido, la asociación representa una relación entre entidades de dominios independientes que se unen por algún motivo concreto o circunstancial.",expOpts:["Correcto: la asociación relaciona entidades de dominios independientes asociadas de forma circunstancial.","La generalización establece jerarquías (una entidad es un tipo de otra).","PERT es una técnica de planificación de proyectos, no del Modelo E/R.","Regresión es una técnica estadística, no un mecanismo del Modelo E/R."]},
{id:34,year:2024,section:"Primera parte",anulada:false,q:"Para las variables a=1, b=2, c=3, d=1 ¿cuál es la operación lógica que da un resultado true?",opts:["((a>b) or (a<c)) and ((a==c) or (a>=b))","((a>=b) or (a<d)) and ((a>=d) or (c>d))","Not (a==c) and (c>b)","Not (a>=d) and not (c>=b)"],answer:2,explanation:"Con a=1, b=2, c=3, d=1: la opción c es 'Not(1==3) and (3>2)' = 'Not(false) and true' = 'true and true' = true.",expOpts:["(1>2 or 1<3) and (1==3 or 1>=2) = true and false = false.","(1>=2 or 1<1) and (1>=1 or 3>1) = false and true = false.","Correcto: Not(1==3) and (3>2) = Not(false) and true = true and true = true.","Not(1>=1) and Not(3>=2) = false and false = false."]},
{id:35,year:2024,section:"Primera parte",anulada:false,q:"Señale la respuesta correcta en relación con las funciones y los procedimientos:",opts:["Una llamada a un procedimiento puede aparecer como operando de una expresión.","El paso de parámetros por referencia envía una copia del valor que tenga el parámetro real, por lo que no se podrá alterar el contenido de la variable.","Los parámetros por referencia se pueden emplear como parámetros de entrada/salida.","Todo procedimiento debe ejecutar una sentencia de return."],answer:2,explanation:"Cuando se pasa un parámetro por referencia, la función recibe la dirección de memoria de la variable original, por lo que puede leerla (entrada) y modificarla (salida).",expOpts:["Falso: una llamada a procedimiento NO puede ser operando de una expresión (eso lo hace una función).","Falso: eso describe el paso por valor, no por referencia. Por referencia se pasa la dirección.","Correcto: los parámetros por referencia pueden usarse como entrada y salida.","Falso: los procedimientos no tienen por qué ejecutar return; las funciones sí deben devolver valor."]},
{id:36,year:2024,section:"Primera parte",anulada:false,q:"Suponga el siguiente programa escrito en un lenguaje de programación estándar: integer x=0; while x<100 do (x=x+1; print x; x=x-1;)",opts:["Este programa imprime los números enteros del 1 al 100.","Este programa imprime los números impares del 1 al 100.","Este programa imprime los números pares del 1 al 100.","Este programa es un bucle infinito."],answer:3,explanation:"El bucle comienza con x=0. En cada iteración: x pasa a 1, imprime 1, luego x vuelve a 0. La condición x<100 siempre se cumple, por lo que el bucle nunca termina.",expOpts:["Falso: x nunca llega a 100 porque tras cada incremento se decrementa.","Falso: x nunca avanza por los números impares.","Falso: x nunca toma valores pares por encima de 0.","Correcto: x oscila entre 0 y 1 indefinidamente. El bucle nunca termina."]},
{id:37,year:2024,section:"Primera parte",anulada:false,q:"Referente a los comandos DML del lenguaje SQL, señale la respuesta correcta:",opts:["DML es acrónimo de Data Manager Language.","Permiten crear nuevas bases de datos, añadiendo y eliminando elementos.","El comando TRUNCATE es un comando DML.","El comando SELECT es un comando DML."],answer:3,explanation:"DML (Data Manipulation Language) incluye: SELECT, INSERT, UPDATE y DELETE. CREATE y DROP son DDL. TRUNCATE se clasifica generalmente como DDL.",expOpts:["Falso: DML significa Data Manipulation Language, no Data Manager Language.","Falso: crear estructuras es tarea del DDL (CREATE, DROP, ALTER), no del DML.","Falso o discutido: TRUNCATE se clasifica como DDL en la mayoría de SGBD.","Correcto: SELECT es el comando DML de consulta de datos."]},
{id:38,year:2024,section:"Primera parte",anulada:false,q:"Referente al comando DROP de SQL, es correcto decir:",opts:["Es un comando DCL.","Puede ser ejecutado por disparadores (triggers).","Se utiliza para eliminar la estructura de una tabla junto con cualquier dato almacenado en ella.","Utiliza WHERE para condiciones de filtrado."],answer:2,explanation:"DROP TABLE elimina completamente la tabla: tanto su estructura (definición de columnas) como todos los datos. No puede deshacerse con ROLLBACK en la mayoría de SGBD.",expOpts:["Falso: DROP es DDL, no DCL (que sería GRANT/REVOKE).","Falso: DROP no puede ejecutarse dentro de un trigger.","Correcto: DROP TABLE elimina la estructura de la tabla y todos sus datos.","Falso: DROP no usa WHERE. Para filtrar eliminaciones de filas se usa DELETE con WHERE."]},
{id:39,year:2024,section:"Primera parte",anulada:false,q:"Señale la respuesta INCORRECTA referente a los disparadores o triggers de una base de datos:",opts:["Son procedimientos que se ejecutan o activan cada vez que ocurre un evento determinado sobre una tabla determinada.","Los eventos que se pueden asociar a la ejecución de un trigger son: INSERT, UPDATE, DELETE.","Puede decidirse que se activen antes o después de un evento determinado.","Un error durante la ejecución de cualquier trigger no cancela automáticamente la operación que lo disparó, la cancelación hay que programarla."],answer:3,explanation:"En la mayoría de los SGBD, si un trigger genera un error, la operación que lo disparó SÍ se cancela automáticamente (se deshace la transacción).",expOpts:["Correcto: los triggers son procedimientos que se ejecutan ante eventos concretos.","Correcto: INSERT, UPDATE y DELETE son los eventos que pueden activar un trigger.","Correcto: los triggers pueden ser BEFORE o AFTER del evento.","INCORRECTA: un error en el trigger sí cancela automáticamente la operación en la mayoría de SGBD."]},
{id:40,year:2024,section:"Primera parte",anulada:false,q:"En diseño y programación orientada a objetos, una relación de generalización entre clases:",opts:["Implica que la subclase hereda las propiedades, el comportamiento y las relaciones de la superclase, a la vez que puede añadir sus propias propiedades, relaciones y comportamiento.","Describe un conjunto de enlaces, que definen las interconexiones semánticas entre las instancias de las clases que participan en la relación.","Asume una subordinación conceptual del tipo “todo/parte”, o bien “tiene un”.","Se representa mediante una línea discontinua que une la superclase y subclase con un rectángulo al lado de la superclase."],answer:0,explanation:"La generalización (herencia) es una relación 'es un' (is-a): la subclase hereda atributos, operaciones y relaciones de la superclase, y puede añadir los suyos propios.",expOpts:["Correcto: la generalización implica herencia de propiedades, comportamiento y relaciones, más extensión propia.","Falso: eso describe una relación de asociación.","Falso: 'todo/parte' o 'tiene un' describe la agregación o composición.","Falso: se representa con línea continua y triángulo hueco apuntando a la superclase."]},
{id:41,year:2024,section:"Primera parte",anulada:false,q:"Señale la respuesta INCORRECTA respecto al Lenguaje de Modelado Unificado (UML):",opts:["Es un lenguaje basado en diagramas para la especificación, visualización, construcción y documentación de cualquier sistema software.","Es independiente de las metodologías de análisis y diseño y de los lenguajes de programación que se utilicen en la construcción del software.","Se basa en el paradigma de la orientación a objetos.","Muestra únicamente el modelado estático de un sistema software, que puede utilizarse en las diferentes fases de su ciclo de desarrollo."],answer:3,explanation:"UML no solo modela aspectos estáticos (diagramas de clases) sino también dinámicos (diagramas de secuencia, estados, actividades). La afirmación de que es 'únicamente estático' es falsa.",expOpts:["Correcto: UML sirve para especificar, visualizar, construir y documentar sistemas software.","Correcto: UML es independiente del lenguaje de programación y de la metodología.","Correcto: UML nació del paradigma orientado a objetos.","INCORRECTA: UML incluye diagramas dinámicos (secuencia, estados, actividades), no solo estáticos."]},
{id:42,year:2024,section:"Primera parte",anulada:false,q:"Señale la respuesta INCORRECTA. El patrón de diseño “Composite”:",opts:["Es un patrón de diseño estructural que permite componer objetos en estructuras de árbol.","Sirve para construir objetos complejos a partir de otros más simples y similares entre sí.","Simplifica el tratamiento de los objetos creados que, al poseer de una interfaz común, se tratan todos de la misma manera.","Se recomienda su uso cuando se quiere añadir responsabilidades a objetos concretos de manera dinámica y transparente y sin afectar a otros objetos."],answer:3,explanation:"La descripción de la opción d corresponde al patrón Decorator, no al Composite. El Composite se usa para componer objetos en estructuras de árbol y tratarlos uniformemente.",expOpts:["Correcto: Composite es un patrón estructural que organiza objetos en árbol.","Correcto: permite componer objetos complejos a partir de objetos simples con la misma interfaz.","Correcto: la interfaz común permite tratar hojas y compuestos de la misma manera.","INCORRECTA: eso describe el patrón Decorator, no el Composite."]},
{id:43,year:2024,section:"Primera parte",anulada:false,q:"¿Qué es .NET MAUI?",opts:[".NET MAUI es un marco multiplataforma para crear aplicaciones móviles y de escritorio nativas con C# y XAML.","Es una plataforma para desarrollar aplicaciones en Java.","Es una herramienta de pruebas automatizadas.","Es una plataforma para desarrollar aplicaciones móviles que se puede ejecutar en sistema Android solamente."],answer:0,explanation:".NET MAUI (Multi-platform App UI) es el sucesor de Xamarin.Forms. Permite crear aplicaciones nativas para iOS, Android, Windows y macOS usando C# y XAML.",expOpts:["Correcto: .NET MAUI es un framework multiplataforma (iOS, Android, Windows, macOS) con C# y XAML.","Falso: .NET MAUI usa C#, no Java.","Falso: no es una herramienta de pruebas.","Falso: es multiplataforma, no exclusivo de Android."]},
{id:44,year:2024,section:"Primera parte",anulada:false,q:"En el ámbito de ASP.NET Core, señale la respuesta correcta respecto a Razor:",opts:["Razor es la sintaxis de plantillas utilizada en ASP.NET Core para crear vistas dinámicas en aplicaciones web.","Es uno de los lenguajes de programación que se utilizan con ASP.NET Core.","Razor se ejecuta directamente en el navegador del cliente.","Razor utiliza el @símbolo para realizar la transición de C# a HTML."],answer:0,explanation:"Razor es un motor de plantillas (view engine) de ASP.NET Core. Permite mezclar HTML con código C# en el servidor para generar páginas web dinámicas.",expOpts:["Correcto: Razor es la sintaxis de plantillas de ASP.NET Core para crear vistas dinámicas en el servidor.","Falso: Razor no es un lenguaje de programación; es una sintaxis de plantillas que usa C# como subyacente.","Falso: Razor se ejecuta en el servidor, no en el navegador.","Parcialmente correcto pero la definición completa está en la opción a."]},
{id:45,year:2024,section:"Primera parte",anulada:false,q:"La persistencia en Jakarta EE se gestiona principalmente a través de la especificación Jakarta Persistence API (JPA). Indique la respuesta correcta:",opts:["Una de sus ventajas es que no necesita utilizar un proveedor de JPA.","El lenguaje de consulta similar a SQL pero orientado a objetos de JPA es JPSQL.","Normalmente, una entidad representa una tabla en una base de datos relacional y cada instancia de la entidad corresponde a una fila de esa tabla.","JPA no permite definir relaciones entre entidades del tipo uno a muchos."],answer:2,explanation:"JPA mapea clases Java a tablas de base de datos. Una clase anotada con @Entity representa una tabla, y cada objeto (instancia) representa una fila. El lenguaje de consulta es JPQL.",expOpts:["Falso: JPA siempre necesita un proveedor (Hibernate, EclipseLink...). Es una especificación.","Falso: el lenguaje de consulta se llama JPQL (Java Persistence Query Language), no JPSQL.","Correcto: una entidad JPA corresponde a una tabla y cada instancia a una fila.","Falso: JPA sí permite relaciones @OneToMany, @ManyToOne, @ManyToMany, @OneToOne."]},
{id:46,year:2024,section:"Primera parte",anulada:false,q:"¿Cuál es una característica de los sistemas distribuidos?",opts:["Falta de transparencia: un nodo no puede acceder a otros nodos del sistema y comunicarse con ellos.","Procesamiento independiente: varias máquinas no pueden procesar la misma función a la vez.","Escalabilidad: la capacidad computacional y de procesamiento puede escalarse hacia arriba según sea necesario cuando se añaden máquinas adicionales.","Comunicación diferencial: usan nodos distintos para comunicarse y sincronizarse a través de redes independientes entre sí."],answer:2,explanation:"Una ventaja clave de los sistemas distribuidos es la escalabilidad horizontal: se puede aumentar la capacidad añadiendo más nodos.",expOpts:["Falso: la transparencia (que los nodos puedan comunicarse) es precisamente una característica deseable.","Falso: en los sistemas distribuidos varias máquinas sí pueden procesar tareas en paralelo.","Correcto: la escalabilidad es una característica fundamental de los sistemas distribuidos.","'Comunicación diferencial' no es un término estándar; la opción es confusa y errónea."]},
{id:47,year:2024,section:"Primera parte",anulada:false,q:"Señale la opción correcta sobre la arquitectura de servicios web REST:",opts:["En la arquitectura REST, el servicio no almacena información sobre el estado del cliente entre peticiones.","El uso de identificadores está basado en SOA.","En la arquitectura REST, la interfaz para acceder a los recursos expuestos puede ser HTTP o FTP.","Es una arquitectura no orientada a recursos."],answer:0,explanation:"REST es una arquitectura sin estado (stateless): el servidor no guarda información del cliente entre peticiones. Cada petición contiene toda la información necesaria.",expOpts:["Correcto: REST es stateless; el servidor no almacena el estado del cliente entre peticiones.","Falso: REST usa URIs para identificar recursos, no el modelo SOA.","Falso: REST se basa en HTTP/HTTPS. FTP no forma parte de REST.","Falso: REST es precisamente una arquitectura orientada a recursos (cada recurso tiene su URI)."]},
{id:48,year:2024,section:"Primera parte",anulada:false,q:"¿Cuál de las siguientes es una diferencia entre HTML y XHTML?",opts:["HTML exige que las etiquetas se escriban en minúscula, mientras que XHTML no.","XHTML permite que haya elementos no vacíos sin cerrar, mientras que HTML no.","En HTML es obligatorio que los valores de los atributos vayan entre comillas, mientras que en XHTML no.","En XHTML es obligatoria la presencia del elemento <head>."],answer:3,explanation:"XHTML es HTML reformulado como XML. Al ser XML, es más estricto: todos los elementos deben estar bien formados, incluyendo <head> y <body> obligatorios.",expOpts:["Falso: es al revés. XHTML exige minúsculas; HTML admite mayúsculas o minúsculas.","Falso: es al revés. XHTML exige que todos los elementos no vacíos estén cerrados.","Falso: es al revés. XHTML exige comillas en los atributos; HTML es más flexible.","Correcto: en XHTML el elemento <head> es obligatorio."]},
{id:49,year:2024,section:"Primera parte",anulada:false,q:"¿Qué evento de HTML utilizaría para producir un efecto al situar el puntero del ratón sobre un elemento?",opts:["onclick.","onmouseover.","onmousedown.","onmouseout."],answer:1,explanation:"onmouseover se activa cuando el puntero del ratón entra en el área de un elemento.",expOpts:["onclick se activa al hacer clic completo (presionar y soltar) sobre el elemento.","Correcto: onmouseover se activa cuando el puntero entra sobre el elemento.","onmousedown se activa cuando se presiona el botón del ratón, antes de soltarlo.","onmouseout se activa cuando el puntero sale del área del elemento."]},
{id:50,year:2024,section:"Primera parte",anulada:false,q:"Con respecto a las solicitudes de información accesible y quejas, el Real Decreto 1112/2018, de 7 de septiembre, sobre accesibilidad de los sitios web y aplicaciones para dispositivos móviles del sector público establece que:",opts:["Recibidas las solicitudes de información accesible y quejas, la entidad obligada deberá responder a la persona interesada en el plazo de veinte días naturales.","Recibidas las solicitudes de información accesible y quejas, la entidad obligada deberá responder a la persona interesada en el plazo de veinte días hábiles.","Recibidas las solicitudes de información accesible y quejas, la entidad obligada deberá responder a la persona interesada en el plazo de diez días naturales.","Recibidas las solicitudes de información accesible y quejas, la entidad obligada deberá responder a la persona interesada en el plazo de diez días hábiles."],answer:1,explanation:"El art. 12.2 del RD 1112/2018 establece un plazo de veinte días hábiles para responder a solicitudes de información accesible y quejas.",expOpts:["Falso: son días hábiles, no naturales.","Correcto: el plazo es de veinte días hábiles. Art. 12.2 RD 1112/2018.","Falso: el plazo es de veinte días, no diez.","Falso: son veinte días hábiles, no diez."]},
{id:51,year:2024,section:"Primera parte",anulada:true,q:"En relación a los principios del Diseño Universal, señale cuál es uno de ellos:",opts:["Seguridad.","Información operable.","Robustez.","Alto esfuerzo físico."],answer:0,explanation:"Pregunta anulada. Los 7 principios del Diseño Universal son: uso equitativo, flexibilidad en el uso, uso simple e intuitivo, información perceptible, tolerancia al error, bajo esfuerzo físico y tamaño y espacio. Ninguna opción los recoge con precisión.",expOpts:["Fue la opción marcada provisionalmente antes de la anulación.","'Información operable' combina términos de WCAG, no del Diseño Universal.","Robustez es un principio de las WCAG, no del Diseño Universal.","'Alto esfuerzo físico' es lo contrario del principio real: el Diseño Universal busca BAJO esfuerzo."]},
{id:52,year:2024,section:"Primera parte",anulada:false,q:"Señale la respuesta correcta referente al término ATAG:",opts:["Son Pautas de Accesibilidad que explican cómo hacer que el contenido web sea más accesible para las personas con discapacidades.","Es una Suite que define una forma de hacer que el contenido web y las aplicaciones web sean más accesibles para las personas con discapacidades.","Son Pautas de Accesibilidad que explican cómo hacer que los agentes de usuario sean accesibles para las personas con discapacidades.","Son un conjunto de normas que deben cumplir las herramientas de autor para ser accesibles y generar contenidos también accesibles."],answer:3,explanation:"ATAG (Authoring Tool Accessibility Guidelines) son las pautas del W3C para herramientas de creación de contenido web. Exigen que la herramienta sea accesible y genere contenido accesible.",expOpts:["Eso describe las WCAG (Web Content Accessibility Guidelines), no ATAG.","Eso describe la WAI (Web Accessibility Initiative).","Eso describe las UAAG (User Agent Accessibility Guidelines), no ATAG.","Correcto: ATAG son las pautas para herramientas de autor (authoring tools)."]},
{id:53,year:2024,section:"Primera parte",anulada:false,q:"¿Cuál de las siguientes opciones se utilizan para el control de versiones?",opts:["Mercurial, CVS y Selenium.","GitLab, GitHub y Apache Subversion.","SVN, Git y Cucumber.","Selenium, Cucumber y GitLab."],answer:1,explanation:"Las herramientas de control de versiones incluyen Git, SVN (Subversion), Mercurial y CVS. GitLab y GitHub alojan repositorios Git. Selenium y Cucumber son herramientas de pruebas.",expOpts:["Selenium es una herramienta de pruebas, no de control de versiones.","Correcto: GitLab, GitHub y Apache Subversion (SVN) son sistemas de control de versiones.","Cucumber es una herramienta de pruebas BDD, no de control de versiones.","Selenium y Cucumber son herramientas de pruebas, no de control de versiones."]},
{id:54,year:2024,section:"Primera parte",anulada:false,q:"Según establece Métrica V3, en la construcción de un sistema de información, las pruebas que permiten verificar que los componentes o subsistemas interactúan correctamente a través de sus interfaces, tanto internas como externas, cubren la funcionalidad establecida y se ajustan a los requisitos especificados en las verificaciones correspondientes son:",opts:["Pruebas unitarias.","Pruebas de integración.","Pruebas del sistema.","Pruebas de migración."],answer:1,explanation:"Las pruebas de integración verifican que los distintos componentes funcionan correctamente cuando se unen.",expOpts:["Las pruebas unitarias verifican componentes de forma aislada.","Correcto: las pruebas de integración verifican la interacción entre componentes.","Las pruebas del sistema verifican el sistema completo como un todo.","Las pruebas de migración verifican que los datos migran correctamente."]},
{id:55,year:2024,section:"Primera parte",anulada:false,q:"¿Cuál de los siguientes conceptos permite que un proceso ejecute múltiples tareas de manera simultánea o concurrente en un sistema operativo?",opts:["Segmentación.","Paginación.","Prepaging.","Hilos."],answer:3,explanation:"Los hilos (threads) son la unidad básica de ejecución dentro de un proceso. Un proceso puede tener múltiples hilos concurrentes, compartiendo memoria y recursos.",expOpts:["La segmentación es una técnica de gestión de memoria, no de concurrencia.","La paginación es una técnica de gestión de memoria, no de concurrencia.","El prepaging es una técnica de carga anticipada de páginas de memoria.","Correcto: los hilos (threads) permiten la ejecución concurrente de múltiples tareas."]},
{id:56,year:2024,section:"Primera parte",anulada:false,q:"El comando sfc /scannow:",opts:["Examina todos los archivos de sistema protegidos y reemplaza los archivos dañados con una copia en caché.","Rrepara el entorno de arranque ubicado en la partición del sistema.","Muestra o establece la directiva de red de área de almacenamiento (sanSAN) para el sistema operativo.","Analizar uno o varios servidores con una directiva generada por SCW."],answer:0,explanation:"sfc /scannow (System File Checker) escanea los archivos de sistema protegidos de Windows y restaura los dañados desde una caché local.",expOpts:["Correcto: sfc /scannow escanea archivos de sistema y restaura los dañados desde caché.","Eso describe el comando bootrec /fixboot.","Eso describe el comando san de diskpart.","Eso describe herramientas como scwcmd, no sfc."]},
{id:57,year:2024,section:"Primera parte",anulada:false,q:"¿Cuánta carga útil puede almacenar un jumboframe?",opts:["7.000 bytes.","1.500 bytes.","9.000 bytes.","10.000 bytes."],answer:2,explanation:"Un jumbo frame es una trama Ethernet con carga útil mayor que el estándar (1.500 bytes). El tamaño más habitual es 9.000 bytes. Se usa en redes de alta velocidad.",expOpts:["7.000 bytes no es el tamaño estándar de un jumbo frame.","1.500 bytes es el MTU estándar de Ethernet, no de un jumbo frame.","Correcto: el jumbo frame estándar tiene 9.000 bytes de carga útil.","10.000 bytes supera el tamaño habitual de un jumbo frame."]},
{id:58,year:2024,section:"Primera parte",anulada:false,q:"¿Qué protocolo hay que utilizar para obtener una dirección física a partir de una dirección lógica?",opts:["RARP.","NAT.","ARP.","PAT."],answer:2,explanation:"ARP (Address Resolution Protocol) resuelve direcciones IP (lógicas) a direcciones MAC (físicas) en una red local.",expOpts:["RARP (Reverse ARP) hace lo contrario: obtiene una IP a partir de una dirección MAC.","NAT traduce entre IPs públicas y privadas, no entre IP y MAC.","Correcto: ARP obtiene la dirección MAC (física) a partir de una dirección IP (lógica).","PAT es una variante de NAT que usa puertos; no resuelve MAC."]},
{id:59,year:2024,section:"Primera parte",anulada:false,q:"¿Qué topología de red consiste en conectar todos los nodos directamente a un nodo central?",opts:["Estrella.","Anillo.","Bus.","Árbol."],answer:0,explanation:"En la topología en estrella todos los nodos están conectados a un dispositivo central (switch o hub).",expOpts:["Correcto: en la topología estrella todos los nodos se conectan a un nodo central.","En la topología en anillo los nodos se conectan formando un círculo.","En la topología bus todos los nodos comparten un único cable central.","La topología árbol es una jerarquía de estrellas conectadas."]},
{id:60,year:2024,section:"Primera parte",anulada:false,q:"La regla 3-2-1 de las copias de seguridad consiste en:",opts:["Conservar 3 copias de los datos, en 2 medios diferentes con 1 copia almacenada en un lugar externo a la organización.","Conservar 3 copias de los datos, en 2 medios iguales con 1 copia almacenada en un lugar externo a la organización.","Conservar 3 copias de los datos, en 2 medios iguales con 1 copia almacenada en un lugar interno a la organización.","Conservar 3 copias de los datos, en 2 medios diferentes con 1 copia almacenada en un lugar interno a la organización."],answer:0,explanation:"La regla 3-2-1: 3 copias de los datos, en 2 tipos de medios diferentes y al menos 1 copia fuera de las instalaciones (offsite).",expOpts:["Correcto: 3 copias, 2 medios diferentes, 1 copia externa. Definición exacta de la regla 3-2-1.","Falso: los medios deben ser diferentes, no iguales.","Falso: los medios deben ser diferentes y la copia debe ser externa.","Falso: la copia debe ser externa, no interna."]},
{id:61,year:2024,section:"Primera parte",anulada:false,q:"Señale la respuesta correcta referente a los sistemas de almacenamiento SAN y NAS:",opts:["SAN es más económico y fácil de configurar.","SAN es el acrónimo de Storage Attached Network.","NAS es un dispositivo de almacenamiento compartido basado en archivos.","NAS es el acrónimo de Network Area Storage."],answer:2,explanation:"NAS (Network Attached Storage) es un sistema de almacenamiento conectado a la red que comparte archivos a nivel de sistema de ficheros. SAN opera a nivel de bloque y es más complejo.",expOpts:["Falso: es al revés. NAS es más económico; SAN es más complejo y caro.","Falso: SAN es 'Storage Area Network', no 'Storage Attached Network'.","Correcto: NAS es almacenamiento compartido en red basado en archivos.","Falso: NAS es 'Network Attached Storage', no 'Network Area Storage'."]},
{id:62,year:2024,section:"Primera parte",anulada:false,q:"Señale la respuesta correcta:",opts:["Los backups utilizan poca capacidad de almacenamiento.","Los backups son manuales, los snapshots son programables.","Los backups pueden almacenarse en localizaciones y medios distintos.","Los backups son una representación instantánea del estado de un sistema en un momento específico."],answer:2,explanation:"Una ventaja clave de los backups es que pueden almacenarse en diferentes lugares y medios. Los snapshots sí representan un estado instantáneo, pero no los backups en sentido estricto.",expOpts:["Falso: los backups pueden ocupar mucha capacidad.","Falso: ambos pueden automatizarse.","Correcto: los backups pueden almacenarse en distintas localizaciones y medios.","Falso: esa es la definición de snapshot (instantánea), no de backup."]},
{id:63,year:2024,section:"Primera parte",anulada:false,q:"¿Cuál es una ventaja del uso del protocolo IMAP en lugar de POP3?",opts:["Permite visualizar los correos directamente en el servidor sin descargarlos.","Es más sencillo que POP3.","No requiere autenticación.","Descarga los correos automáticamente del servidor."],answer:0,explanation:"IMAP mantiene los correos en el servidor y permite acceder a ellos desde múltiples dispositivos sin descargarlos. POP3 descarga los correos al cliente.",expOpts:["Correcto: IMAP permite leer y gestionar correos directamente en el servidor.","Falso: IMAP es más complejo que POP3.","Falso: ambos protocolos requieren autenticación.","Falso: eso describe POP3, que descarga los mensajes al cliente."]},
{id:64,year:2024,section:"Primera parte",anulada:false,q:"Señale cuáles de las siguientes son tecnologías relacionadas con la contenerización y la gestión de contenedores:",opts:["Docker, Containerd y Podman.","Docker, CRI-O y nginx.","Podman, Kubernetes y Ubuntu.","Docker, Kubernetes y Debian."],answer:0,explanation:"Docker, Containerd y Podman son tecnologías de contenerización. nginx es un servidor web, y Ubuntu/Debian son sistemas operativos.",expOpts:["Correcto: Docker, Containerd y Podman son runtimes de contenedores.","nginx es un servidor web, no una tecnología de contenerización.","Ubuntu es un sistema operativo, no una tecnología de contenerización.","Debian es un sistema operativo, no una tecnología de contenerización."]},
{id:65,year:2024,section:"Primera parte",anulada:false,q:"Indique la respuesta INCORRECTA respecto a PoE (Power over Ethernet):",opts:["Power over Ethernet (PoE) es una tecnología que permite que los conmutadores de red transmitan energía y datos a través de un cable Ethernet simultáneamente.","Existen dos tipos: PoE activo y PoE pasivo.","PoE pasivo no se adhiere a ningún estándar IEEE.","El último estándar de PoE activo es el IEEE 802.3at."],answer:3,explanation:"El estándar IEEE 802.3at define PoE+ (hasta 25,5W). El estándar más reciente es el IEEE 802.3bt (PoE++, hasta 90-100W), aprobado en 2018.",expOpts:["Correcto: PoE transmite datos y electricidad por el mismo cable Ethernet.","Correcto: existe PoE activo (cumple estándares IEEE) y PoE pasivo.","Correcto: el PoE pasivo no cumple ningún estándar IEEE.","INCORRECTA: el último estándar es el IEEE 802.3bt (PoE++), no el 802.3at (PoE+)."]},
{id:66,year:2024,section:"Primera parte",anulada:false,q:"La norma IEEE 802.11 se refiere a:",opts:["Redes inalámbricas.","Redes de área metropolitana.","Redes integradas para voz y datos.","Seguridad de red."],answer:0,explanation:"IEEE 802.11 es el estándar para redes de área local inalámbricas (WLAN), más conocido como WiFi.",expOpts:["Correcto: IEEE 802.11 es el estándar WiFi para redes inalámbricas (WLAN).","Las redes de área metropolitana corresponden a IEEE 802.16 (WiMAX) u otros.","Las redes integradas de voz y datos corresponden a otros estándares como IEEE 802.9.","La seguridad de red inalámbrica se define en extensiones como 802.11i (WPA2)."]},
{id:67,year:2024,section:"Primera parte",anulada:false,q:"¿Cuál de las siguientes es una herramienta de ticketing para la gestión de incidentes de seguridad en las entidades del ámbito de aplicación del Esquema Nacional de Seguridad?",opts:["ATENEA.","MONICA.","LUCIA.","INES."],answer:2,explanation:"LUCIA (Listado Unificado de Coordinación de Incidentes y Amenazas) es la herramienta de ticketing del CCN-CERT para la gestión de incidentes de seguridad en entidades del ENS.",expOpts:["ATENEA es la plataforma de retos de ciberseguridad del CCN.","MÓNICA es una herramienta de gestión documental del CCN.","Correcto: LUCIA es la herramienta de ticketing para incidentes de seguridad en el ámbito del ENS.","INES evalúa el cumplimiento del ENS, no gestiona incidentes."]},
{id:68,year:2024,section:"Primera parte",anulada:false,q:"Indique la respuesta correcta sobre el formato de firma digital CAdES:",opts:["Es apropiado para firmar ficheros grandes, especialmente si la firma contiene el documento original.","Es el formato de firma que utiliza Microsoft Office.","El resultado es un fichero de texto XML. No es adecuado cuando el fichero original es muy grande.","Es el formato más adecuado cuando el documento original es un PDF."],answer:0,explanation:"CAdES (CMS Advanced Electronic Signatures) genera ficheros binarios. Puede contener el documento firmado dentro de la firma, adecuado para ficheros grandes. XAdES usa XML. PAdES es para PDF.",expOpts:["Correcto: CAdES es apropiado para ficheros grandes; puede incluir el documento original.","Falso: Microsoft Office usa su propio formato de firma.","Falso: CAdES genera ficheros binarios, no XML. El formato XML es XAdES.","Falso: el formato más adecuado para PDF es PAdES."]},
{id:69,year:2024,section:"Primera parte",anulada:false,q:"Indique la respuesta correcta sobre tipos de ataque a un sistema de información:",opts:["El sniffing es la generación de tráfico utilizando un origen falseado.","El spoofing es la captura del tráfico que circula por una red.","Denegacion de servicio distribuida (DDoS) es un ataque a varios objetivos desde un solo punto, con la finalidad de degradar total o parcialmente los servicios prestados por esos recursos a sus usuarios legítimos.","El barrido (“escaneo”) de puertos es un ataque que trata de obtener información básica acerca de qué servicios se ofrecen en un determinado sistema, así como otros detalles técnicos del mismo."],answer:3,explanation:"El escaneo de puertos consiste en sondear un sistema para averiguar qué puertos tiene abiertos y qué servicios ofrece. Es una técnica de reconocimiento.",expOpts:["Falso: eso describe el spoofing. El sniffing es la captura pasiva de tráfico.","Falso: eso describe el sniffing. El spoofing es falsificar una dirección o identidad.","Falso: DDoS es desde múltiples puntos a un objetivo, no desde un solo punto.","Correcto: el escaneo de puertos identifica servicios abiertos y detalles técnicos del sistema."]},
{id:70,year:2024,section:"Primera parte",anulada:true,q:"¿Cuál de las siguientes categorías de cable Ethernet tiene 10.000 Mbps como tope de velocidad de transferencia?",opts:["Categoría 6A.","Categoría 8.","Categoría 6.","Categoría 5E."],answer:0,explanation:"Pregunta anulada. Tanto Cat 6A como Cat 8 pueden alcanzar 10.000 Mbps en distintas condiciones. Cat 6A lo hace hasta 100m, Cat 8 hasta 30m pero a 40 Gbps. La ambigüedad causó la anulación.",expOpts:["Cat 6A alcanza 10 Gbps hasta 100 metros. Fue la opción de la plantilla provisional.","Cat 8 también puede operar a 10 Gbps aunque su máximo es 40 Gbps. Ambigüedad causó anulación.","Cat 6 alcanza 10 Gbps solo hasta 55 metros; para distancias normales se limita a 1 Gbps.","Cat 5E alcanza 1 Gbps como máximo, no 10 Gbps."]},
{id:71,year:2024,section:"Primera parte",anulada:false,q:"Señale cuál de las siguientes tecnologías NO es una tecnología LPWAN:",opts:["LoRaWAN.","Bluetooth LE.","SigFox.","NB-IoT."],answer:1,explanation:"LPWAN (Low Power Wide Area Network) son redes de baja potencia y amplio alcance para IoT. Bluetooth LE es de corto alcance, no es LPWAN.",expOpts:["LoRaWAN es una tecnología LPWAN ampliamente usada en IoT.","Correcto: Bluetooth LE es de corto alcance (PAN), no LPWAN.","SigFox es una tecnología LPWAN propietaria.","NB-IoT es una tecnología LPWAN basada en redes celulares."]},
{id:72,year:2024,section:"Primera parte",anulada:false,q:"¿Cuál de las siguientes respuestas es correcta respecto al modelo OSI de ISO?",opts:["Las capas o niveles del modelo OSI son: Física, de red, de transporte, de sesión, de presentación y de aplicación.","La versión actual del estándar OSI es la ISO/IEC 7498-1:1994.","La capa de transporte se ocupa, entre otros, de aspectos como el enrutamiento, el reenvío y el direccionamiento a través de una red.","La capa de sesión a menudo se divide en dos subcapas: la capa de control de acceso a los medios (MAC) y la capa de control de enlace lógico (LLC)."],answer:1,explanation:"El modelo OSI tiene 7 capas. La versión actual del estándar es ISO/IEC 7498-1:1994. El enrutamiento corresponde a la capa de red, y MAC/LLC son subcapas de la capa de enlace.",expOpts:["Falso: el modelo OSI tiene 7 capas, no 6. Falta la capa de enlace de datos.","Correcto: la versión actual del estándar OSI es la ISO/IEC 7498-1:1994.","Falso: el enrutamiento corresponde a la capa de red (capa 3), no a la de transporte.","Falso: MAC y LLC son subcapas de la capa de enlace (capa 2), no de la capa de sesión."]},
{id:73,year:2024,section:"Primera parte",anulada:false,q:"¿Cuál es la respuesta correcta con respecto modelo TCP/IP?",opts:["La arquitectura TCP/IP tiene cinco capas o niveles: Acceso a red, Internet, Transporte, Sesión y Aplicación.","TCP y UDP son protocolos de la capa de Internet.","Telnet es un protocolo de la capa de sesión.","ICMP es un protocolo de la capa de Internet."],answer:3,explanation:"En el modelo TCP/IP, la capa de Internet incluye IP, ICMP, ARP e IGMP. TCP y UDP son de la capa de transporte. Telnet es de aplicación. El modelo tiene 4 capas, no 5.",expOpts:["Falso: el modelo TCP/IP tiene 4 capas, no 5. No existe capa de sesión.","Falso: TCP y UDP son de la capa de transporte, no de Internet.","Falso: Telnet es un protocolo de aplicación, no de sesión.","Correcto: ICMP es un protocolo de la capa de Internet."]},
{id:74,year:2024,section:"Primera parte",anulada:false,q:"Relativa al direccionamiento IPv4, indique la respuesta INCORRECTA:",opts:["La dirección 172.16.52.63 es una dirección de clase B.","Las direcciones 192.168.123.71 y 192.168.123.133 con máscara de subred 255.255.255.192 se encuentran en la misma red.","Las redes de clase A usan una máscara de subred predeterminada de 255.0.0.0.","En las redes clase C se permite direccionar 254 equipos como máximo."],answer:1,explanation:"Con máscara /26 (255.255.255.192), cada subred tiene 64 direcciones. La IP .71 está en la subred .64-.127 y la .133 en la subred .128-.191. No están en la misma red.",expOpts:["Correcto: 172.x.x.x está en el rango de clase B (128-191 en el primer octeto).","INCORRECTA: con máscara /26, .71 y .133 pertenecen a subredes distintas.","Correcto: las redes de clase A usan 255.0.0.0.","Correcto: en clase C hay 256 direcciones, 254 para hosts (restando red y broadcast)."]},
{id:75,year:2024,section:"Primera parte",anulada:false,q:"¿Qué código de respuesta HTTP se devuelve si el usuario que hace la petición NO tiene autorización para obtener la información?",opts:["401","403","405","407"],answer:1,explanation:"El código 403 Forbidden significa que el servidor entiende la petición pero se niega a autorizarla. El 401 indica falta de autenticación.",expOpts:["401 Unauthorized: el usuario no está autenticado (falta credencial o es inválida).","Correcto: 403 Forbidden. El usuario está identificado pero no tiene permiso.","405 Method Not Allowed: el método HTTP no está permitido para ese recurso.","407 Proxy Authentication Required: se requiere autenticación ante un proxy."]},
{id:76,year:2024,section:"Primera parte",anulada:false,q:"Indique la respuesta correcta sobre el IETF (Internet Engineering Task Force):",opts:["Es un organismo creador de estándares en Internet.","Es responsable de las funciones administrativas relacionadas con la raíz del sistema de nombres de dominio (DNS), el direccionamiento del protocolo de Internet y otros recursos del protocolo de Internet.","Es responsable de administrar y supervisar la coordinación del sistema de nombres de dominio (DNS) de Internet y sus identificadores únicos, como las direcciones de protocolo de Internet (IP).","Es el Foro de Gobernanza de Internet."],answer:0,explanation:"El IETF desarrolla y promueve estándares de Internet mediante los documentos RFC. ICANN gestiona el DNS e IPs. IGF es el Foro de Gobernanza.",expOpts:["Correcto: el IETF crea estándares de Internet a través de los RFC.","Eso describe a ICANN (Internet Corporation for Assigned Names and Numbers).","Eso también describe funciones de ICANN.","El Foro de Gobernanza de Internet es el IGF, no el IETF."]},
{id:77,year:2024,section:"Primera parte",anulada:false,q:"Sobre tipos de transferencia de archivos en el servicio FTP (File Transfer Protocol), es CORRECTO decir que:",opts:["El tipo ASCII es adecuado para transferir archivos de texto plano.","El tipo Multimedia es adecuado para transferir imágenes y archivos de audio.","El tipo Binario solo es adecuado para transferir ficheros ejecutables para PC.","El tipo ASCII es adecuado para transferir páginas HTML y las imágenes que puedan contener."],answer:0,explanation:"FTP tiene dos modos: ASCII (para texto, convierte saltos de línea) y Binario (para cualquier otro fichero: imágenes, ejecutables, comprimidos). No existe tipo 'Multimedia'.",expOpts:["Correcto: el modo ASCII es el adecuado para archivos de texto plano.","Falso: no existe un tipo 'Multimedia' en FTP. Las imágenes se transfieren en modo binario.","Falso: el modo Binario sirve para cualquier fichero no textual.","Falso: las imágenes NO deben transferirse en modo ASCII; deben ir en modo binario."]},
{id:78,year:2024,section:"Primera parte",anulada:false,q:"¿Cuál de los siguientes ataques consiste en suplantar a una entidad legítima por medio de llamadas telefónicas?",opts:["Pharming.","Smishing.","Vishing.","Whaling."],answer:2,explanation:"Vishing (voice + phishing) es el phishing por llamada telefónica. Smishing es por SMS, Pharming redirige DNS, Whaling es phishing dirigido a altos directivos.",expOpts:["Pharming: redirige el tráfico web manipulando el DNS para llevar a webs falsas.","Smishing: phishing por SMS, no llamadas.","Correcto: Vishing es phishing por voz/llamada telefónica.","Whaling: phishing dirigido a personas de alto cargo; no es específicamente por teléfono."]},
{id:79,year:2024,section:"Primera parte",anulada:false,q:"La creación de un señuelo atractivo para potenciales atacantes con el objetivo de aprender sus ataques y poder prevenirlos o defenderlos en el futuro se hace mediante un:",opts:["IPS.","SIEM.","IDS.","Honeypot."],answer:3,explanation:"Un honeypot es un sistema señuelo para atraer atacantes y estudiar sus técnicas. IDS detecta intrusiones, IPS las previene, SIEM centraliza eventos de seguridad.",expOpts:["IPS (Intrusion Prevention System): detecta y bloquea activamente ataques.","SIEM: agrega y analiza logs de seguridad.","IDS: detecta intrusiones y alerta. No actúa como señuelo.","Correcto: un honeypot es un señuelo para atraer atacantes y estudiar sus métodos."]},
{id:80,year:2024,section:"Primera parte",anulada:false,q:"La herramienta del CCN que proporciona visibilidad y control sobre la red es:",opts:["CARMEN.","EMMA.","MONICA.","OLVIDO."],answer:1,explanation:"EMMA proporciona visibilidad y control sobre la red de los organismos. CARMEN detecta APTs, MÓNICA gestiona documentación clasificada y OLVIDO facilita el derecho al olvido.",expOpts:["CARMEN detecta tráfico relacionado con APTs, pero no es la herramienta de visibilidad general.","Correcto: EMMA proporciona visibilidad y control sobre la red.","MÓNICA es una herramienta de gestión de documentación clasificada.","OLVIDO facilita el ejercicio del derecho al olvido en Internet."]},
{id:81,year:2024,section:"Reserva P1",anulada:false,q:"Señale cuál es una resolución válida para una pantalla:",opts:["8K UHD - 7680 x 3840 píxeles.","Ultra HD - 4320 x 1280 píxeles.","WQHD - 2560 x 1440 píxeles.","HD - 1920 × 1080 píxeles."],answer:2,explanation:"WQHD (Wide Quad HD) es 2560x1440 píxeles. 8K UHD es 7680x4320. Ultra HD/4K es 3840x2160. HD es 1280x720 y Full HD es 1920x1080.",expOpts:["Falso: 8K UHD son 7680x4320 píxeles, no 7680x3840.","Falso: Ultra HD (4K) son 3840x2160 píxeles.","Correcto: WQHD es 2560x1440 píxeles.","Falso: 1920x1080 es Full HD (FHD), no HD estándar (1280x720)."]},
{id:82,year:2024,section:"Reserva P1",anulada:false,q:"¿Cuál es un tipo de panel de una pantalla LCD?",opts:["IPS (In-Plane Switching).","VN (Vertical Nematic).","TA (Twisted Alignment).","PSI (Plane Switching Input)."],answer:0,explanation:"Los principales tipos de panel LCD son: TN (Twisted Nematic), IPS (In-Plane Switching) y VA (Vertical Alignment). Los demás nombres son inventados.",expOpts:["Correcto: IPS (In-Plane Switching) es un tipo real de panel LCD.","VN (Vertical Nematic) no es un tipo de panel LCD real.","TA (Twisted Alignment) no es un tipo de panel LCD real.","PSI (Plane Switching Input) no es un tipo de panel LCD real."]},
{id:83,year:2024,section:"Reserva P1",anulada:false,q:"El protocolo de IEEE para Rapid Spanning Tree Protocol es:",opts:["802.1w.","802.1Q.","802.1D.","802.1aq."],answer:0,explanation:"RSTP (Rapid Spanning Tree Protocol) está definido en el estándar IEEE 802.1w. El original STP es 802.1D. El 802.1Q define las VLANs.",expOpts:["Correcto: IEEE 802.1w define el Rapid Spanning Tree Protocol (RSTP).","IEEE 802.1Q define el etiquetado de VLANs.","IEEE 802.1D define el Spanning Tree Protocol (STP) original, no el Rapid.","IEEE 802.1aq define Shortest Path Bridging (SPB)."]},
{id:84,year:2024,section:"Reserva P1",anulada:false,q:"En CSS3, ¿cuál de las siguientes unidades de medida NO es relativa?",opts:["Q","vw","ex","ch"],answer:0,explanation:"Q es una unidad absoluta que equivale a un cuarto de milímetro (1Q = 0.25mm). Las unidades vw, ex y ch son relativas.",expOpts:["Correcto: Q es una unidad absoluta (1/4 de milímetro), no relativa.","vw (viewport width) es una unidad relativa al ancho del viewport.","ex es una unidad relativa a la altura de la letra 'x' en la fuente actual.","ch es una unidad relativa al ancho del carácter '0' en la fuente actual."]},
{id:85,year:2024,section:"Reserva P1",anulada:false,q:"Señale la respuesta correcta:",opts:["Xcode es un IDE destinado exclusivamente al desarrollo software para iOS.","Xcode Cloud no existe.","SwiftUI es un framework que facilita la creación de aplicaciones para cualquier dispositivo Apple.","iOS SDK permite el desarrollo de aplicaciones para macOS, iOS, watchOS y tvOS."],answer:2,explanation:"SwiftUI es el framework de Apple para crear interfaces de usuario declarativas para todos sus sistemas: iOS, macOS, watchOS y tvOS. Xcode también sirve para macOS y otros. Xcode Cloud sí existe.",expOpts:["Falso: Xcode soporta macOS, iOS, watchOS, tvOS y visionOS, no solo iOS.","Falso: Xcode Cloud existe; es el servicio CI/CD de Apple integrado en Xcode.","Correcto: SwiftUI permite crear apps para todos los dispositivos Apple.","Falso: iOS SDK es específico para iOS, no para macOS ni otros."]},
{id:86,year:2024,section:"Supuesto I",anulada:false,q:"¿Qué elemento HTML utilizaría para impedir que el e-mail exceda los 100 caracteres cuando el interesado lo cumplimente?",opts:['<input type="email" id="email" name="email" size="100">','<input type="email" id="email" name="email" max="100">','<input type="email" id="email" name="email" maxlength="100">','<input type="email" id="email" name="email" length="100">'],answer:2,explanation:"El atributo maxlength limita el número máximo de caracteres en un campo de texto. size controla el ancho visual, max es para campos numéricos y length no es un atributo HTML estándar.",expOpts:["size='100' controla el ancho visual del campo, no el límite de entrada.","max='100' es para campos numéricos o de fecha, no para limitar caracteres en texto.","Correcto: maxlength='100' limita a 100 caracteres la entrada del usuario.","length no es un atributo HTML estándar."]},
{id:87,year:2024,section:"Supuesto I",anulada:false,q:"¿Qué ORM podría utilizar, en función de la solución de backend escogida?",opts:["JPA en .NET e Hibernate en Java.","Hibernate en .NET y Entity Framework en Java.","Entity Framework en .NET e Hibernate en Java.","Spring Data en .NET e Hibernate en Java."],answer:2,explanation:"Entity Framework (EF Core) es el ORM principal de .NET/C#. Hibernate es el ORM más extendido en Java.",expOpts:["JPA es una especificación Java, no existe para .NET.","Hibernate es un ORM Java, no de .NET.","Correcto: Entity Framework para .NET y Hibernate para Java.","Spring Data es un módulo de Spring para repositorios; no es un ORM de .NET."]},
{id:88,year:2024,section:"Supuesto I",anulada:false,q:"¿Qué sentencia habría que ejecutar si se quiere añadir un nuevo registro a la tabla 'CuerpoBecado'?",opts:["INSERT INTO CuerpoBecado (Codigo, Denominacion) VALUES ('TAI, 'Técnico Auxiliar de Informática');","INSERT INTO CuerpoBecado (Codigo, Denominacion) VALUES (TAI, Técnico Auxiliar de Informática);","INSERT TO CuerpoBecado (Codigo, Denominacion) VALUES ('TAI', 'Técnico Auxiliar de Informática');","INSERT INTO CuerpoBecado (Codigo, Denominacion) VALUES ('TAI', 'Técnico Auxiliar de Informática');"],answer:3,explanation:"La sintaxis correcta de INSERT en SQL es: INSERT INTO tabla (columnas) VALUES (valores). Los valores de texto deben ir entre comillas simples correctamente cerradas.",expOpts:["Falta la comilla de cierre del primer valor: 'TAI (debería ser 'TAI').","Los valores de texto no tienen comillas, lo que causaría error de sintaxis.","La sintaxis correcta es INSERT INTO, no INSERT TO.","Correcto: sintaxis SQL válida con comillas correctamente colocadas."]},
{id:89,year:2024,section:"Supuesto I",anulada:false,q:"¿Qué tipo de correspondencia hay entre las tablas 'SolicitudBeca' y 'FicheroAdjunto'?",opts:["Un registro de SolicitudBeca puede tener N registros de FicheroAdjunto.","Un registro de SolicitudBeca puede tener como máximo un registro de FicheroAdjunto.","N registros de SolicitudBeca pueden tener M registros de FicheroAdjunto.","Un registro de SolicitudBeca puede tener cero o como máximo un registro de FicheroAdjunto."],answer:0,explanation:"Una solicitud de beca puede tener varios ficheros adjuntos (DNI, titulación, documentación...). Eso es una relación uno a muchos (1:N).",expOpts:["Correcto: la relación es 1:N (una solicitud puede tener múltiples ficheros adjuntos).","Falso: limitaría a un único adjunto por solicitud, lo que no es razonable.","Falso: una relación M:N implicaría que un mismo fichero pertenece a varias solicitudes.","Falso: 'cero o como máximo uno' es una relación 1:0..1, muy limitante."]},
{id:90,year:2024,section:"Supuesto I",anulada:false,q:"¿Qué herramienta automatizada utilizaría para probar que la aplicación cumple con los estándares de accesibilidad?",opts:["QualWeb.","Equal Automatic Checker.","AccSite.","Shovel."],answer:0,explanation:"QualWeb es una herramienta real de evaluación automática de accesibilidad web desarrollada por la Universidad de Lisboa, reconocida en el ámbito europeo.",expOpts:["Correcto: QualWeb es una herramienta real y reconocida de evaluación de accesibilidad.","Equal Automatic Checker no es una herramienta reconocida de accesibilidad web.","AccSite no es una herramienta reconocida de accesibilidad web.","Shovel no es una herramienta de accesibilidad web."]},
{id:91,year:2024,section:"Supuesto I",anulada:false,q:"El formulario de solicitud será extenso y tendrá muchas consultas de datos. ¿Qué utilizaría para renderizar la página en el servidor?",opts:["Server Sent Events.","Ajax.","WebSocket.","Server Side Rendering."],answer:3,explanation:"SSR (Server Side Rendering) consiste en que el servidor genera el HTML completo antes de enviarlo al navegador. Es adecuado para formularios extensos.",expOpts:["Server Sent Events permite al servidor enviar eventos al cliente; no es una técnica de renderizado.","Ajax permite peticiones asíncronas pero no es una técnica de renderizado completo.","WebSocket permite comunicación bidireccional en tiempo real; no es una técnica de renderizado.","Correcto: Server Side Rendering (SSR) genera el HTML en el servidor."]},
{id:92,year:2024,section:"Supuesto I",anulada:false,q:"El proceso de presentación implica autenticación, firma, guardado en BD, asiento registral y justificante. ¿Qué diagrama UML representaría este flujo?",opts:["Diagrama de paquetes.","Diagrama de objetos.","Diagrama de secuencia.","Diagrama de Entidad/Relación."],answer:2,explanation:"El diagrama de secuencia UML muestra la interacción entre objetos a lo largo del tiempo, representando el orden de los mensajes en un flujo.",expOpts:["El diagrama de paquetes muestra la organización en módulos, no el flujo de acciones.","El diagrama de objetos muestra instancias en un momento concreto, no un flujo temporal.","Correcto: el diagrama de secuencia representa interacciones ordenadas en el tiempo.","El Diagrama E/R es de modelado de BBDD, no UML, y no representa flujos."]},
{id:93,year:2024,section:"Supuesto I",anulada:false,q:"En caso de utilizar Java para el backend, ¿qué tecnología puede utilizar para generar un cliente de servicios web?",opts:["Apache Flink.","Apache Xalan.","Apache Xerces.","Apache CXF."],answer:3,explanation:"Apache CXF es un framework de Java para crear y consumir servicios web (SOAP y REST). Flink es para procesamiento de streams. Xalan es procesador XSLT. Xerces es parser XML.",expOpts:["Apache Flink: procesamiento de datos en streaming. No genera clientes web.","Apache Xalan: procesador XSLT para transformar XML.","Apache Xerces: parser XML para Java.","Correcto: Apache CXF genera clientes y servidores de servicios web SOAP y REST en Java."]},
{id:94,year:2024,section:"Supuesto I",anulada:false,q:"En un entorno de desarrollo Java, ¿qué utilizaría para mapear elementos XML a clases?",opts:["JAXB.","JPA.","JAXR.","JAX-RS."],answer:0,explanation:"JAXB (Java Architecture for XML Binding) convierte entre objetos Java y documentos XML. JPA es para BBDD. JAXR era para registros. JAX-RS es para servicios REST.",expOpts:["Correcto: JAXB mapea XML a objetos Java y viceversa.","JPA mapea objetos Java a tablas de base de datos relacional, no a XML.","JAXR era para interactuar con registros UDDI; está obsoleto.","JAX-RS define servicios web REST, no mapeo XML."]},
{id:95,year:2024,section:"Supuesto I",anulada:false,q:"¿Cuál de las siguientes herramientas NO le ayudará a analizar y mejorar la calidad del código?",opts:["SonarQube.","Un linter de JavaScript.","PMD.","Mercurial."],answer:3,explanation:"SonarQube, los linters y PMD son herramientas de análisis estático y calidad de código. Mercurial es un sistema de control de versiones distribuido.",expOpts:["SonarQube es una plataforma de análisis estático de calidad y seguridad del código.","Los linters analizan el código en busca de errores de estilo y malas prácticas.","PMD es una herramienta de análisis estático de código Java.","Correcto: Mercurial es un sistema de control de versiones, no de calidad de código."]},
{id:96,year:2024,section:"Supuesto I",anulada:false,q:"Usando Java en el backend, ¿qué clase nativa de Java puede utilizar para trabajar con una fecha y hora simultáneamente?",opts:["LocalDateTime.","LocalDate.","LocalTime.","OffsetTime."],answer:0,explanation:"En java.time de Java 8+: LocalDateTime combina fecha y hora sin zona horaria. LocalDate es solo fecha. LocalTime es solo hora. OffsetTime es hora con offset pero sin fecha.",expOpts:["Correcto: LocalDateTime representa fecha y hora conjuntamente.","LocalDate representa solo una fecha (año, mes, día), sin hora.","LocalTime representa solo una hora, sin fecha.","OffsetTime es hora con offset de zona horaria, pero sin componente de fecha."]},
{id:97,year:2024,section:"Supuesto I",anulada:false,q:"Se va a exponer una capa de servicios web. ¿Cuál de las siguientes opciones NO es válida para documentar dichos servicios?",opts:["RAML.","REST.","WSDL.","OpenAPI/Swagger."],answer:1,explanation:"REST es un estilo de arquitectura, no un lenguaje de documentación. RAML, OpenAPI/Swagger y WSDL son formatos para describir APIs.",expOpts:["RAML (RESTful API Modeling Language) es un lenguaje de descripción de APIs REST.","Correcto: REST es una arquitectura, no un formato de documentación.","WSDL documenta servicios SOAP.","OpenAPI/Swagger es el estándar más extendido para documentar APIs REST."]},
{id:98,year:2024,section:"Supuesto I",anulada:false,q:"Se desea añadir una tabla 'Subsanacion' con columnas numéricas IdSubsanacion e IdSolicitudBeca y una columna alfanumérica de 2000 caracteres TextoFundamento. ¿Cuál es la sentencia correcta?",opts:["CREATE TABLE Subsanacion (IdSubsanacion bigint, IdSolicitudBeca bigint, TextoFundamento varchar(2000));","CREATE Subsanacion (IdSubsanacion bigint, IdSolicitudBeca bigint, TextoFundamento varchar(2000));","CREATE NEW TABLE Subsanacion (IdSubsanacion bigint, IdSolicitudBeca bigint, TextoFundamento varchar(2000));","CREATE TABLE Subsanacion AS (IdSubsanacion bigint, IdSolicitudBeca bigint, TextoFundamento varchar(2000));"],answer:0,explanation:"La sintaxis correcta en SQL para crear una tabla es CREATE TABLE nombre (columna tipo, ...). bigint para enteros grandes, varchar(n) para texto variable.",expOpts:["Correcto: CREATE TABLE con la sintaxis estándar SQL y tipos de datos correctos.","Falso: falta la palabra TABLE después de CREATE.","Falso: CREATE NEW TABLE no es sintaxis SQL estándar.","Falso: CREATE TABLE ... AS se usa para crear tablas a partir de consultas SELECT."]},
